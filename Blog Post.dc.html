<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Homemade+Apple&display=swap" rel="stylesheet">
<meta name="description" content="Blog de lettering — Life Deco Art">
<meta property="og:type" content="article">
<meta property="og:title" content="Life Deco Art | Blog">
<meta property="og:description" content="Blog de lettering — Life Deco Art">
<meta property="og:url" content="https://lifedecoart.com/blog">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Life Deco Art | Blog">
<meta name="twitter:description" content="Blog de lettering — Life Deco Art">
<link rel="canonical" href="https://lifedecoart.com/blog">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #FFFFFF; font-family: 'Montserrat', sans-serif; animation: lda-page-fade .3s ease; }
  @keyframes lda-page-fade { from { opacity: 0; } to { opacity: 1; } }
  a { color: #F65091; }
  a:hover { color: #000000; }
  .post-body h2 { font-size: 24px; font-weight: 500; color: #000; margin: 36px 0 14px; }
  .post-body p { font-size: 16px; line-height: 1.8; color: #333; margin: 0 0 18px; }
  .post-body ul { padding-left: 20px; margin: 0 0 18px; }
  .post-body li { font-size: 16px; line-height: 1.8; color: #333; margin-bottom: 6px; }
  .post-body strong { font-weight: 700; color: #000; }
  .related-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .bp-title { font-size: 38px; }
  .bp-title span { font-size: 44px; }
  @media (max-width: 600px) {
    .related-grid { grid-template-columns: 1fr; }
    .bp-title { font-size: 26px; }
    .bp-title span { font-size: 30px; }
  }
</style>
</helmet>

<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
  <div style="max-width:720px;margin:0 auto;padding:100px 24px;text-align:center;color:#8B795E;font-size:14px;font-weight:300;">Cargando…</div>
</sc-if>

<sc-if value="{{ notFound }}" hint-placeholder-val="{{ false }}">
  <div style="max-width:720px;margin:0 auto;padding:100px 24px;text-align:center;">
    <div style="font-size:20px;color:#000;font-weight:400;margin-bottom:12px;">Artículo no encontrado</div>
    <a href="Aprende.dc.html?tab=Blog" style="font-size:14px;color:#8B795E;">← Volver al blog</a>
  </div>
</sc-if>

<sc-if value="{{ post }}" hint-placeholder-val="{{ false }}">
<div style="max-width:720px;margin:0 auto;padding:56px 24px 100px;">
  <a href="Aprende.dc.html?tab=Blog" style="font-size:13px;color:#8B795E;text-decoration:none;display:inline-block;margin-bottom:32px;">← Volver al blog</a>
  <div style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:14px;">{{ post.category }}</div>
  <h1 class="bp-title" style="line-height:1.25;color:#000;font-weight:300;margin:0 0 14px;">{{ post.titleStart }}<span style="font-family:'Homemade Apple',cursive;font-weight:400;">{{ post.titleAccent }}</span></h1>
  <div style="font-size:13px;color:#8B795E;margin-bottom:32px;">{{ post.meta }}</div>
  <div style="width:100%;aspect-ratio:16/9;background:#F3EEE4;border-radius:8px;margin-bottom:40px;overflow:hidden;">
    <image-slot id="blog-post-cover" shape="rect" fit="cover" style="width:100%;height:100%;" src="{{ post.imageUrl }}" placeholder="foto de portada del artículo"></image-slot>
  </div>
  <div class="post-body" dangerouslySetInnerHTML="{{ post.bodyHtml }}"></div>

  <div style="margin-top:48px;">
    <div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:12px;">Compartir</div>
    <div style="display:flex;gap:10px;">
      <a onClick="{{ onShareFacebook }}" href="#" style="width:36px;height:36px;border-radius:4px;background:#F3EEE4;display:flex;align-items:center;justify-content:center;color:#5C5142;text-decoration:none;font-size:13px;">FB</a>
      <a onClick="{{ onShareX }}" href="#" style="width:36px;height:36px;border-radius:4px;background:#F3EEE4;display:flex;align-items:center;justify-content:center;color:#5C5142;text-decoration:none;font-size:13px;">X</a>
      <a onClick="{{ onSharePinterest }}" href="#" style="width:36px;height:36px;border-radius:4px;background:#F3EEE4;display:flex;align-items:center;justify-content:center;color:#5C5142;text-decoration:none;font-size:13px;">P</a>
      <a onClick="{{ onShareWhatsapp }}" href="#" style="width:36px;height:36px;border-radius:4px;background:#F3EEE4;display:flex;align-items:center;justify-content:center;color:#5C5142;text-decoration:none;font-size:13px;">WA</a>
    </div>
  </div>

  <a href="Sobre Mi.dc.html" style="display:flex;align-items:center;gap:14px;margin-top:32px;padding:20px;background:#F9F6EF;border-radius:8px;text-decoration:none;">
    <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#F3EEE4;">
      <image-slot id="blog-post-author" shape="circle" fit="cover" style="width:100%;height:100%;" src="{{ post.authorPhoto }}" placeholder="foto"></image-slot>
    </div>
    <div>
      <div style="font-size:14px;font-weight:500;color:#000;">{{ post.authorName }}</div>
      <div style="font-size:13px;color:#8B795E;">{{ post.authorRole }}</div>
    </div>
  </a>

  <sc-if value="{{ hasRelated }}" hint-placeholder-val="{{ false }}">
  <div style="border-top:1px solid #F3EEE4;margin-top:32px;padding-top:32px;">
    <div style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:20px;">Sigue leyendo</div>
    <div class="related-grid">
      <sc-for list="{{ related }}" as="r" hint-placeholder-count="2">
      <a href="{{ r.href }}" style="text-decoration:none;display:block;">
        <div style="width:100%;aspect-ratio:16/10;background:#F3EEE4;border-radius:8px;margin-bottom:12px;overflow:hidden;">
          <image-slot id="related-post-{{ r.id }}" shape="rect" fit="cover" style="width:100%;height:100%;" src="{{ r.imageUrl }}" placeholder="foto"></image-slot>
        </div>
        <div style="font-size:12px;color:#0CC0DF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">{{ r.category }}</div>
        <div style="font-size:15px;color:#000;font-weight:400;line-height:1.4;">{{ r.title }}</div>
      </a>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <div style="margin-top:48px;border-top:1px solid #F3EEE4;padding-top:32px;">
    <div style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:24px;">Comentarios</div>
    <textarea placeholder="Escribe un comentario..." rows="3" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #E4DCCB;border-radius:8px;font-family:Montserrat;font-size:14px;resize:vertical;margin-bottom:12px;"></textarea>
    <button style="background:#0CC0DF;color:#FFFFFF;border:none;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:Montserrat;">Publicar comentario</button>
  </div>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { loading: true, allPosts: [] };

  DEFAULT_POSTS = [
    { id: 'b1', category: 'Técnica', title: 'Cómo sostener el marcador: el error que comete el 90% de las principiantes', meta: '3 jul 2026 · 4 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>Un pequeño ajuste en la posición de tu mano puede cambiarlo todo. Antes de preocuparte por marcadores caros o papel especial, vale la pena revisar cómo estás sosteniendo la herramienta.</p>
      <h2>El error más común</h2>
      <p>La mayoría de quienes empiezan sostienen el marcador como si fuera un lápiz para escribir a mano, con la mano muy cerca de la punta y demasiada presión. Esto genera trazos irregulares y cansancio en la muñeca después de pocos minutos.</p>
      <ul>
        <li>Sostén el marcador con los dedos relajados, no apretados.</li>
        <li>Deja espacio entre tus dedos y la punta del marcador.</li>
        <li>Apoya el brazo completo, no solo la muñeca, al hacer trazos largos.</li>
      </ul>
      <h2>Practica antes de escribir palabras completas</h2>
      <p>Antes de intentar una palabra completa, dedica unos minutos a repetir trazos rectos y curvos sueltos. <strong>La consistencia en el ángulo del marcador</strong> es lo que le da uniformidad al lettering, más que la velocidad con la que escribas.</p>
      <p>Con práctica diaria de 10 a 15 minutos, la mayoría de las personas nota una mejora notable en menos de dos semanas.</p>` },
    { id: 'b2', category: 'Materiales', title: 'Mis herramientas favoritas: guía honesta para quien empieza', meta: '26 jun 2026 · 6 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>Sin marcas de lujo ni listas interminables — lo que yo misma uso para practicar lettering todos los días.</p>` },
    { id: 'b3', category: 'Ideas creativas', title: '5 superficies que no sabías que podías usar para lettering', meta: '18 jun 2026 · 5 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>El papel es solo el comienzo — cinco superficies sorprendentes para practicar y crear piezas distintas.</p>` },
    { id: 'b4', category: 'Diseño', title: 'Combinaciones de tipografías que sí funcionan', meta: '10 jun 2026 · 5 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>Pares clásicos para tus composiciones de lettering, explicados con ejemplos.</p>` },
    { id: 'b5', category: 'Lettering', title: 'De boceto a pieza final: mi proceso creativo', meta: '2 jun 2026 · 7 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>Los pasos que sigo antes de dibujar la versión final de una pieza de lettering.</p>` },
    { id: 'b6', category: 'Manualidades', title: '3 manualidades con lettering para regalar', meta: '26 may 2026 · 4 min', imageUrl: '',
      authorName: 'Nombre Apellido', authorRole: 'Fundadora, Life Deco Art', authorPhoto: '',
      content: `<p>Proyectos fáciles de hacer en una tarde, ideales para regalar.</p>` },
  ];

  async componentDidMount() {
    try {
      const cms = await import('./cms.js');
      const data = await cms.getPageContent('aprende');
      const posts = (data.blog && data.blog.length) ? data.blog : this.DEFAULT_POSTS;
      this.setState({ allPosts: posts, loading: false });
    } catch (e) {
      this.setState({ allPosts: this.DEFAULT_POSTS, loading: false });
    }
  }

  splitTitle(title) {
    const words = (title || '').trim().split(' ');
    const last = words.pop() || '';
    return { titleStart: words.length ? words.join(' ') + ' ' : '', titleAccent: last };
  }

  setDocumentMeta(post) {
    const title = `${post.title} | Life Deco Art`;
    const desc = (post.excerpt || post.category || 'Blog de lettering — Life Deco Art').slice(0, 160);
    const url = window.location.href;
    document.title = title;
    const setTag = (selector, attr, value) => {
      let el = document.querySelector(selector);
      if (!el) return;
      el.setAttribute(attr, value);
    };
    setTag('meta[name="description"]', 'content', desc);
    setTag('meta[property="og:title"]', 'content', title);
    setTag('meta[property="og:description"]', 'content', desc);
    setTag('meta[property="og:url"]', 'content', url);
    setTag('meta[name="twitter:title"]', 'content', title);
    setTag('meta[name="twitter:description"]', 'content', desc);
    setTag('link[rel="canonical"]', 'href', url);
  }
  share(url) {
    window.open(url, '_blank', 'noopener,width=600,height=500');
  }

  renderVals() {
    const { loading, allPosts } = this.state;
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || (allPosts[0] && allPosts[0].id);
    const found = allPosts.find(p => p.id === id) || null;

    if (loading) return { isLoading: true, notFound: false, post: null, hasRelated: false };
    if (!found) return { isLoading: false, notFound: true, post: null, hasRelated: false };

    const post = {
      ...found,
      ...this.splitTitle(found.title),
      noImage: !found.imageUrl,
      noAuthorPhoto: !found.authorPhoto,
      authorName: found.authorName || 'Nombre Apellido',
      authorRole: found.authorRole || 'Fundadora, Life Deco Art',
      bodyHtml: { __html: found.content || '' },
    };
    this.setDocumentMeta(post);

    const related = allPosts.filter(p => p.id !== found.id).slice(0, 2).map(r => ({
      ...r, noImage: !r.imageUrl, href: `Blog Post.dc.html?id=${r.id}`,
    }));

    const url = encodeURIComponent(window.location.href);
    const title = encodeURIComponent(found.title);

    return {
      isLoading: false, notFound: false, post, hasRelated: related.length > 0, related,
      onShareFacebook: (e) => { e.preventDefault(); this.share(`https://www.facebook.com/sharer/sharer.php?u=${url}`); },
      onShareX: (e) => { e.preventDefault(); this.share(`https://twitter.com/intent/tweet?url=${url}&text=${title}`); },
      onSharePinterest: (e) => { e.preventDefault(); this.share(`https://pinterest.com/pin/create/button/?url=${url}&description=${title}`); },
      onShareWhatsapp: (e) => { e.preventDefault(); this.share(`https://wa.me/?text=${title}%20${url}`); }
    };
  }
}
</script>
</body>
</html>
