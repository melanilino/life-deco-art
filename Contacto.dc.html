<section style="font-family:'Montserrat',sans-serif;background:#FFFFFF;">

  <div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ heroPad }};display:grid;grid-template-columns:{{ heroCols }};gap:{{ heroGap }};opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">

    <div>
      <div class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:{{ eyebrowGap }};">Contacto</div>
      <h1 style="font-size: {{ h1Size }}; line-height: 1.15; color: #000000; font-weight: 300; margin: 0">{{ heroTitlePrefix }}<span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:1.35em;">{{ heroTitleAccent }}</span>{{ heroTitleSuffix }}</h1>
      <p style="font-size: 14px; color: var(--lda-text-secondary,#756348); font-weight: 300; line-height: 1.8; margin-top: 20px; max-width: 380px">{{ introText }}</p>
    </div>

    <div style="background: #FFFFFF; border: {{ formBorder }}; border-radius: 8px; padding: {{ formPad }}; border-color: #F0EEE6">
      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <div role="status" aria-live="polite" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:340px;text-align:center;">
          <div style="font-size:34px;color:#000000;font-weight:400;">¡<span class="lda-script-section" style="font-family:'Camelia Beauty', cursive;font-weight:400;font-size:59px;">Gracias</span>!</div>
          <p style="font-size:14px;color:var(--lda-text-secondary,#756348);font-weight:300;line-height:1.8;margin-top:12px;">Tu mensaje fue enviado para procesamiento. Te contestaremos muy pronto a {{ form.email }}.</p>
        </div>
      </sc-if>
      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
        <div role="form" aria-label="Formulario de contacto" aria-busy="{{ submitting }}" style="display:flex;flex-direction:column;gap:{{ formGap }};">
          <div style="display:grid;grid-template-columns:{{ nameEmailCols }};gap:16px;min-width:0;">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label for="contact-name" style="font-size:11px;font-weight:500;color:#000000;">{{ nameLabel }}</label>
              <input id="contact-name" type="text" name="name" autocomplete="name" aria-required="true" value="{{ form.name }}" onChange="{{ onNameChange }}" placeholder="Tu nombre" style="min-height:44px;box-sizing:border-box;padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6" style-focus="border-color:#000000;">
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label for="contact-email" style="font-size:11px;font-weight:500;color:#000000;">{{ emailLabel }}</label>
              <input id="contact-email" type="email" name="email" autocomplete="email" aria-required="true" value="{{ form.email }}" onChange="{{ onEmailChange }}" placeholder="tu@email.com" style="min-height:44px;box-sizing:border-box;padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6EB" style-focus="border-color:#000000;">
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="contact-project" style="font-size:11px;font-weight:500;color:#000000;">{{ projectLabel }}</label>
            <select id="contact-project" value="{{ form.type }}" onChange="{{ onTypeChange }}" style="min-height:44px;box-sizing:border-box;color:#000000; padding: 11px 36px 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; background: #FFFFFF url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%228%22%20viewBox%3D%220%200%2014%208%22%3E%3Cpath%20d%3D%22M1%201L7%207L13%201%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E') no-repeat right 14px center; font-weight: 300; transition: border-color .25s ease; appearance: none; -webkit-appearance: none; border-color: #F0EEE6" style-focus="border-color:#000000;">
              <sc-for list="{{ projectTypes }}" as="type" hint-placeholder-count="5"><option value="{{ type.value }}">{{ type.label }}</option></sc-for>
            </select>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="contact-message" style="font-size:11px;font-weight:500;color:#000000;">{{ messageLabel }}</label>
            <textarea id="contact-message" name="message" rows="5" aria-required="true" value="{{ form.message }}" onChange="{{ onMessageChange }}" placeholder="Describe lo que tienes en mente..." style="padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; resize: vertical; font-family: 'Montserrat',sans-serif; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6" style-focus="border-color:#000000;"></textarea>
          </div>
          <button type="button" onClick="{{ onSubmit }}" disabled="{{ submitting }}" style="min-height:44px;box-sizing:border-box;cursor: pointer; margin-top: 8px; background: #000000; color: #FFFFFF; padding: 13px 26px; border-radius: 4px; font-size: 13px; font-weight: 500; border: none; font-family: Montserrat; transition: transform .25s ease, background .25s ease;" style-hover="transform:translateY(-3px);background:#2a2a2a;">{{ submitLabel }}</button>
          <sc-if value="{{ submitError }}" hint-placeholder-val="{{ false }}"><p id="contact-form-error" role="alert" style="font-size:12px;color:#B3261E;font-weight:400;line-height:1.5;margin:0;">{{ submitError }}</p></sc-if>
        </div>
      </sc-if>
    </div>

  </div>

</section>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  async componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
    this._resizeHandler = check;
    window.addEventListener('resize', this._resizeHandler, { passive: true });
    const reveal = (el) => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; el.setAttribute('data-revealed', '1'); };
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    let io;
    try {
      io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
      els.forEach((el) => io.observe(el));
    } catch (err) {}
    const sweep = () => {
      els.forEach((el) => {
        if (el.getAttribute('data-revealed')) return;
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { reveal(el); if (io) io.unobserve(el); }
      });
    };
    requestAnimationFrame(sweep);
    setTimeout(sweep, 400);
    setTimeout(sweep, 1200);
    try {
      const cms = await import('/cms.js');
      const content = (await cms.getPageContent('contacto')) || {};
      const projectTypes = Array.isArray(content.projectTypes) && content.projectTypes.length ? content.projectTypes : ['Cartel / decoración', 'Papelería de boda', 'Regalo personalizado', 'Taller o clase', 'Otro'];
      this.setState({ content, form: { ...this.state.form, type: projectTypes[0] } });
    } catch (_) {}
  }
  state = {
    submitted: false,
    submitting: false,
    submitError: '',
    isMobile: typeof window !== 'undefined' && window.innerWidth < 860,
    form: { name: '', email: '', type: 'Cartel / decoración', message: '' }, content: {},
  };
  componentWillUnmount() {
    if (this._resizeHandler) window.removeEventListener('resize', this._resizeHandler);
  }
  renderVals() {
    const form = this.state.form;
    const m = this.state.isMobile;
    const content = this.state.content || {};
    const projectTypeLabels = Array.isArray(content.projectTypes) && content.projectTypes.length ? content.projectTypes : ['Cartel / decoración', 'Papelería de boda', 'Regalo personalizado', 'Taller o clase', 'Otro'];
    return {
      navGap: m ? '64px' : '88px',
      eyebrowGap: m ? '12px' : '16px',
      eyebrowSize: m ? '10px' : '12px',
      heroPad: m ? '40px 26px 40px' : '72px 48px 96px',
      heroCols: m ? '1fr' : '0.9fr 1.1fr',
      heroGap: m ? '28px' : '56px',
      h1Size: m ? '26px' : '44px',
      formBorder: m ? 'none' : '1px solid #E4DCCB',
      formPad: m ? '0' : '40px',
      nameEmailCols: m ? '1fr' : '1fr 1fr',
      formGap: m ? '14px' : '18px',
      form,
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      submitting: this.state.submitting,
      submitError: this.state.submitError,
      heroTitlePrefix: 'Grandes historias inician con un ', heroTitleAccent: 'hola', heroTitleSuffix: '.',
      introText: content.introText || 'Cuéntame qué tienes en mente y te responderé en menos de 48 horas.',
      nameLabel: content.nameLabel || 'Nombre', emailLabel: content.emailLabel || 'Email',
      projectLabel: content.projectLabel || 'Tipo de proyecto', messageLabel: content.messageLabel || 'Cuéntame tu idea',
      projectTypes: projectTypeLabels.map((label) => ({ label, value: label })),
      submitLabel: this.state.submitting ? 'Enviando…' : (content.submitLabel || 'Enviar mensaje'),
      onNameChange: (e) => this.setState(s => ({ form: { ...s.form, name: e.target.value } })),
      onEmailChange: (e) => this.setState(s => ({ form: { ...s.form, email: e.target.value } })),
      onTypeChange: (e) => this.setState(s => ({ form: { ...s.form, type: e.target.value } })),
      onMessageChange: (e) => this.setState(s => ({ form: { ...s.form, message: e.target.value } })),
      onSubmit: async () => {
        if (this.state.submitting) return;
        if (!form.name.trim() || !form.email.trim() || !form.message.trim()) {
          this.setState({ submitError: 'Completa tu nombre, correo y mensaje.' });
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) {
          this.setState({ submitError: 'Escribe un correo válido.' });
          return;
        }
        this.setState({ submitting: true, submitError: '' });
        try {
          await fetch('https://script.google.com/macros/s/AKfycbzOw5oScxeBcbshUQ5FtxO9EnuxmWGTGA-jx_ls8CW726W2w92_fkvFugwIkLUbrgZ9/exec', {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(form),
          });
          this.setState({ submitted: true, submitting: false });
        } catch (e) {
          console.error('No se pudo enviar el formulario de contacto.', e);
          this.setState({ submitting: false, submitError: content.errorMessage || 'No pudimos enviar el mensaje. Inténtalo nuevamente.' });
        }
      },
    };
  }
}
</script>
</body>
