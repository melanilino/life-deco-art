<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<script data-lda="LDA_HEAD_ZOOM_BLOCK">
(function(){
  if (window.__ldaPinchZoomBlocked) return;
  window.__ldaPinchZoomBlocked = true;
  document.documentElement.style.touchAction = 'manipulation';
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function(e){ if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, false);
})();
</script>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Life Deco Art","description":"Lettering personalizado, piezas hechas a mano y experiencias de aprendizaje.","sameAs":[]}</script>
<link rel="canonical" href="https://lifedecoart.com/contacto">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&amp;family=Homemade+Apple&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; max-width: 100%; overflow-x: clip; }
  body { background: #FFFFFF; animation: lda-page-fade .3s ease; }
  @keyframes lda-page-fade { from { opacity: 0; } to { opacity: 1; } }
  a { color: #000000; }
  a:hover { color: #8B795E; }
</style>
<style>
  input, textarea, select { font-family: 'Montserrat', sans-serif; }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0 1000px #FFFFFF inset; -webkit-text-fill-color: #000000; transition: background-color 9999s ease-in-out 0s; }
  @font-face { font-family: 'Le Jour Script'; src: url('./uploads/Le Jour Script Personal Use Only.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
</style>
</helmet>
<dc-import name="NavBar" active-page="contacto" hint-size="100%,80px"></dc-import>
<div style="height:{{ navGap }};"></div>

<section style="font-family:'Montserrat',sans-serif;background:#FFFFFF;">

  <div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ heroPad }};display:grid;grid-template-columns:{{ heroCols }};gap:{{ heroGap }};opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">

    <div>
      <div style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:16px;">Contacto</div>
      <h1 style="font-size: {{ h1Size }}; line-height: 1.15; color: #000000; font-weight: 300; margin: 0">Grandes historias inician con un <span style="font-family: 'Homemade Apple', cursive; font-weight: 400; font-size: 1.22em">mensaje</span>.</h1>
      <p style="font-size: 14px; color: #8B795E; font-weight: 300; line-height: 1.8; margin-top: 20px; max-width: 380px">Cuéntame qué tienes en mente y te responderé en menos de 48 horas.</p>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DCCB; border-radius: 8px; padding: {{ formPad }}; border-color: #F0EEE6">
      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:340px;text-align:center;">
          <div style="font-size:34px;color:#000000;font-weight:400;">¡<span style="font-family:'Homemade Apple', cursive;font-weight:400;font-size:44px;">Gracias</span>!</div>
          <p style="font-size:14px;color:#8B795E;font-weight:300;line-height:1.8;margin-top:12px;">Recibimos tu mensaje. Te contestaremos muy pronto a {{ form.email }}.</p>
        </div>
      </sc-if>
      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:18px;">
          <div style="display:grid;grid-template-columns:{{ nameEmailCols }};gap:16px;min-width:0;">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label style="font-size:11px;font-weight:500;color:#000000;">Nombre</label>
              <input type="text" name="name" autocomplete="name" value="{{ form.name }}" onChange="{{ onNameChange }}" placeholder="Tu nombre" style="padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6" style-focus="border-color:#000000;">
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <label style="font-size:11px;font-weight:500;color:#000000;">Email</label>
              <input type="email" name="email" autocomplete="email" value="{{ form.email }}" onChange="{{ onEmailChange }}" placeholder="tu@email.com" style="padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6EB" style-focus="border-color:#000000;">
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:11px;font-weight:500;color:#000000;">Tipo de proyecto</label>
            <select value="{{ form.type }}" onChange="{{ onTypeChange }}" style="color:#000000; padding: 11px 36px 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; background: #FFFFFF url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%228%22%20viewBox%3D%220%200%2014%208%22%3E%3Cpath%20d%3D%22M1%201L7%207L13%201%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E') no-repeat right 14px center; font-weight: 300; transition: border-color .25s ease; appearance: none; -webkit-appearance: none; border-color: #F0EEE6" style-focus="border-color:#000000;">
              <option value="carteles">Cartel / decoración</option>
              <option value="boda">Papelería de boda</option>
              <option value="regalo">Regalo personalizado</option>
              <option value="taller">Taller o clase</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:11px;font-weight:500;color:#000000;">Cuéntame tu idea</label>
            <textarea rows="5" value="{{ form.message }}" onChange="{{ onMessageChange }}" placeholder="Describe lo que tienes en mente..." style="padding: 11px 14px; border-radius: 4px; border: 1px solid #E4DCCB; font-size: 14px; outline: none; resize: vertical; font-family: 'Montserrat',sans-serif; font-weight: 300; transition: border-color .25s ease; border-color: #F0EEE6" style-focus="border-color:#000000;"></textarea>
          </div>
          <button onClick="{{ onSubmit }}" style="cursor: pointer; margin-top: 8px; background: #000000; color: #FFFFFF; padding: 13px 26px; border-radius: 4px; font-size: 13px; font-weight: 500; border: none; font-family: Montserrat; transition: transform .25s ease, background .25s ease;" style-hover="transform:translateY(-3px);background:#2a2a2a;">Enviar mensaje</button>
        </div>
      </sc-if>
    </div>

  </div>

</section>

<dc-import name="Footer" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
    const reveal = (el) => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; el.setAttribute('data-revealed', '1'); };
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    let io;
    try {
      io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
      els.forEach((el) => io.observe(el));
    } catch (err) {}
    const sweep = () => {
      els.forEach((el) => {
        if (el.getAttribute('data-revealed')) return;
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { reveal(el); if (io) io.unobserve(el); }
      });
    };
    requestAnimationFrame(sweep);
    setTimeout(sweep, 400);
    setTimeout(sweep, 1200);
  }
  state = {
    submitted: false,
    isMobile: typeof window !== 'undefined' && window.innerWidth < 860,
    form: { name: '', email: '', type: 'carteles', message: '' },
  };
  renderVals() {
    const form = this.state.form;
    const m = this.state.isMobile;
    return {
      navGap: m ? '64px' : '88px',
      heroPad: m ? '48px 24px 56px' : '76px 48px 96px',
      heroCols: m ? '1fr' : '0.9fr 1.1fr',
      heroGap: m ? '40px' : '56px',
      h1Size: m ? '30px' : '44px',
      formPad: m ? '24px' : '40px',
      nameEmailCols: m ? '1fr' : '1fr 1fr',
      form,
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      onNameChange: (e) => this.setState(s => ({ form: { ...s.form, name: e.target.value } })),
      onEmailChange: (e) => this.setState(s => ({ form: { ...s.form, email: e.target.value } })),
      onTypeChange: (e) => this.setState(s => ({ form: { ...s.form, type: e.target.value } })),
      onMessageChange: (e) => this.setState(s => ({ form: { ...s.form, message: e.target.value } })),
      onSubmit: () => {
        fetch('https://script.google.com/macros/s/AKfycbzOw5oScxeBcbshUQ5FtxO9EnuxmWGTGA-jx_ls8CW726W2w92_fkvFugwIkLUbrgZ9/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(form),
        }).catch(() => {});
        this.setState({ submitted: true });
      },
    };
  }
}
</script>
</body>
</html>
