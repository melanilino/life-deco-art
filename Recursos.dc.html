<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://lifedecoart.com/aprende/gratis/plantilla-trazos-basicos">
<meta property="og:url" content="https://lifedecoart.com/aprende/gratis/plantilla-trazos-basicos">
<script src="/support.js?v=20260812-subpages4"></script>
<script src="/site-enhancements.js?v=20260831motion1" defer></script>
<title>Plantilla de Trazos Básicos (gratis) | Life Deco Art</title>
<meta name="description" content="Descarga gratis una guía imprimible con 6 láminas para practicar los trazos fundamentales del lettering.">
<meta property="og:type" content="article"><meta property="og:title" content="Plantilla de Trazos Básicos (gratis) | Life Deco Art"><meta property="og:description" content="Descarga gratis una guía imprimible para practicar los trazos fundamentales del lettering."><meta property="og:image" content="https://lifedecoart.com/og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Plantilla de Trazos Básicos | Life Deco Art"><meta name="twitter:description" content="Guía gratuita para practicar lettering."><meta name="twitter:image" content="https://lifedecoart.com/og-image.png">
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&amp;family=Homemade+Apple&amp;display=swap" rel="stylesheet">
<script src="/image-slot.js?v=20260831touch1"></script>
<style>
  html, body { margin: 0; max-width: 100%; overflow-x: clip; }
  body { background: #FFFFFF; animation: lda-page-fade .3s ease; }
  @keyframes lda-page-fade { from { opacity: 0; } to { opacity: 1; } }
  a { color: #0CC0DF; }
  a:hover { color: #000000; }
</style>
</helmet>
<dc-import name="NavBar" active-page="aprende" hint-size="100%,80px" style="position: absolute; left: 4px; top: 1px"></dc-import>
<div style="height:{{ navGap }};"></div>

<section style="font-family:'Montserrat',sans-serif;background:#FFFFFF;">

  <div style="max-width:1100px;margin:0 auto;padding:{{ crumbPad }};display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#8B795E;font-weight:300;">
    <a href="/aprende" style="text-decoration:none;color:#8B795E;">Aprende</a>
    <span>/</span>
    <a href="/aprende?tab=Gratis" style="text-decoration:none;color:#8B795E;">Gratis</a>
    <span>/</span>
    <span style="color:#000000;">{{ title }}</span>
  </div>

  <div style="max-width:1100px;margin:0 auto;padding:{{ mainPad }};display:grid;grid-template-columns:{{ mainCols }};gap:{{ mainGap }};min-width:0;">

    <div>
      <div style="position:relative;aspect-ratio:3/4;border-radius:14px;background:#F3EEE4;overflow:hidden;">
        <image-slot id="{{ activeGalleryImage.id }}" shape="rect" fit="cover" priority="high" srcset="{{ activeGalleryImage.srcset }}" sizes="(max-width:859px) 100vw, 50vw" alt="{{ activeGalleryImage.alt }}" view-scale="{{ activeGalleryImage.viewScale }}" view-x="{{ activeGalleryImage.viewX }}" view-y="{{ activeGalleryImage.viewY }}" style="width:100%;height:100%;" src="{{ activeGalleryImage.url }}" placeholder="{{ activeGalleryImage.placeholder }}"></image-slot>
        <sc-if value="{{ showGalleryNavigation }}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{ onPreviousGallery }}" aria-label="Imagen anterior" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;color:#5C5142;font-size:25px;line-height:1;cursor:pointer;">‹</button>
          <button type="button" onClick="{{ onNextGallery }}" aria-label="Imagen siguiente" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;color:#5C5142;font-size:25px;line-height:1;cursor:pointer;">›</button>
        </sc-if>
      </div>
      <sc-if value="{{ showGalleryNavigation }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px;padding-top:10px;"><sc-for list="{{ galleryDots }}" as="dot" hint-placeholder-count="4"><button type="button" onClick="{{ dot.onClick }}" aria-label="{{ dot.label }}" style="width:{{ dot.width }};height:7px;padding:0;border:0;border-radius:999px;background:{{ dot.background }};cursor:pointer;transition:width .2s ease,background .2s ease;"></button></sc-for></div></sc-if>
    </div>

    <div>
      <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:12px;">Recurso gratuito</div>
      <h1 style="font-size:{{ h1Size }};line-height:1.2;color:#000000;font-weight:300;margin:0 0 14px;">{{ title }}</h1>
      <p style="font-size:15px;color:#8B795E;font-weight:300;line-height:1.7;margin:0 0 24px;">{{ description }}</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;">
        <div style="padding:7px 14px;border-radius:999px;background:#F3EEE4;font-size:12px;color:#2B2420;font-weight:400;">{{ format }}</div>
        <sc-if value="{{ pageCount }}" hint-placeholder-val="{{ false }}"><div style="padding:7px 14px;border-radius:999px;background:#F3EEE4;font-size:12px;color:#2B2420;font-weight:400;">{{ pageCount }}</div></sc-if>
        <sc-if value="{{ printableLabel }}" hint-placeholder-val="{{ false }}"><div style="padding:7px 14px;border-radius:999px;background:#F3EEE4;font-size:12px;color:#2B2420;font-weight:400;">{{ printableLabel }}</div></sc-if>
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;color:#000;font-weight:400;margin-bottom:10px;">Qué contiene</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <sc-for list="{{ contains }}" as="c" hint-placeholder-count="4">
            <div style="display:flex;gap:8px;font-size:13px;color:#2B2420;font-weight:300;"><span style="color:#0CC0DF;">✓</span>{{ c }}</div>
          </sc-for>
        </div>
      </div>

      <div style="margin-bottom:24px;">
        <div style="font-size:14px;color:#000;font-weight:400;margin-bottom:8px;">Para quién está pensado</div>
        <p style="font-size:13px;color:#8B795E;font-weight:300;line-height:1.6;margin:0;">{{ audience }}</p>
      </div>

      <div style="margin-bottom:32px;">
        <div style="font-size:14px;color:#000;font-weight:400;margin-bottom:8px;">Cómo usarla</div>
        <p style="font-size:13px;color:#8B795E;font-weight:300;line-height:1.6;margin:0;">{{ usage }}</p>
      </div>

      <a href="{{ downloadUrl }}" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:#0CC0DF;color:#FFFFFF;padding:15px 30px;border-radius:6px;font-size:14px;font-weight:500;transition:transform .25s ease;" style-hover="transform:translateY(-3px);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"></path></svg>
        {{ downloadLabel }}
      </a>
    </div>

  </div>

  <div style="max-width:1100px;margin:0 auto;padding:{{ nextPad }};">
    <div style="font-size:13px;color:#8B795E;font-weight:400;margin-bottom:12px;">Tu siguiente paso</div>
    <a href="{{ nextHref }}" style="display:flex;align-items:center;gap:16px;text-decoration:none;background:#F3EEE4;border-radius:12px;padding:18px;transition:transform .25s ease;" style-hover="transform:translateY(-3px);">
      <div style="width:64px;height:64px;border-radius:8px;background:#FFFFFF;flex-shrink:0;overflow:hidden;">
        <image-slot id="rc-next" shape="rect" fit="cover" srcset="{{ nextImageSrcset }}" sizes="(max-width:859px) 100vw, 360px" alt="{{ nextImageAlt }}" style="width:100%;height:100%;" src="{{ nextImageUrl }}" placeholder="contenido relacionado"></image-slot>
      </div>
      <div>
        <div style="font-size:14px;color:#000;font-weight:400;">{{ nextTitle }}</div>
        <div style="font-size:12px;color:#8B795E;font-weight:300;">{{ nextDescription }}</div>
      </div>
    </a>
  </div>

</section>

<dc-import name="Footer" hint-size="100%,320px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 860, resource: null, related: null, galleryIndex: 0 };
  setGalleryIndex(index) { this.setState({ galleryIndex: index }); }
  async componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
    window.addEventListener('resize', check);
    try {
      const id = new URLSearchParams(window.location.search).get('id');
      const cms = await import('/cms.js');
      const [data, entities] = await Promise.all([
        cms.getPageContent('aprende'),
        cms.getEntities('resources').catch(() => []),
      ]);
      const legacyResources = data.gratis || [];
      const resources = legacyResources.length ? legacyResources : entities.map((entry, index) => {
        const legacy = legacyResources.find((old, oldIndex) => String(old.id || oldIndex) === String(entry.id || index));
        return { ...entry, imageAdjustments: entry.imageAdjustments || (legacy && legacy.imageAdjustments) || {} };
      });
      const resource = resources.filter((entry) => (entry.status || 'Activo') !== 'Borrador').find((entry, index) => String(entry.id || `g${index + 1}`) === String(id));
      if (resource) {
        const relation = String(resource.nextItemId || '').split(':');
        const list = relation[0] === 'taller' ? (data.talleres || []) : (data.cursos || []);
        const related = list.filter((entry) => (entry.status || 'Activo') !== 'Borrador').find((entry) => String(entry.id) === relation.slice(1).join(':')) || null;
        this.setState({ resource, related, galleryIndex: 0 });
      } else {
        const placeholders = [
          { id: 'g1', format: 'PDF', title: 'Plantilla de práctica de trazos básicos' },
          { id: 'g2', format: 'PDF', title: 'Alfabeto completo para calcar' },
          { id: 'g3', format: 'PDF', title: 'Guía de proporciones y espaciado' },
          { id: 'g4', format: 'PNG', title: 'Set de fondos digitales para tablet' },
          { id: 'g5', format: 'PDF', title: 'Checklist: materiales para empezar' },
          { id: 'g6', format: 'PDF', title: 'Cuaderno de práctica de 30 días' },
        ];
        const placeholder = placeholders.find((entry) => entry.id === id);
        if (placeholder) this.setState({ resource: placeholder, related: null, galleryIndex: 0 });
        else window.location.replace('/aprende?tab=Gratis');
      }
    } catch (error) {
      console.error('No se pudo cargar el recurso.', error);
    }
  }
  renderVals() {
    const m = this.state.isMobile;
    const resource = this.state.resource || {};
    const related = this.state.related || {};
    const adjustment = resource.imageAdjustments && resource.imageAdjustments.imageUrl;
    const legacyGallery = [
      ...(resource.imageUrl ? [{ id: 'gallery-cover', url: resource.imageUrl, adjustment: adjustment || null }] : []),
      ...(Array.isArray(resource.previewImages) ? resource.previewImages : [])
    ];
    const savedGallery = Array.isArray(resource.gallery) ? resource.gallery : legacyGallery;
    const gallery = (savedGallery.length ? savedGallery : [0, 1, 2, 3].map((index) => ({ id: 'gallery-placeholder-' + index }))).map((entry, index) => {
      const item = typeof entry === 'string' ? { url: entry } : entry, view = item.adjustment || {};
      const legacyMeta = index === 0 && resource.imageMeta && resource.imageMeta.imageUrl;
      return { ...item, srcset: item.srcset || (legacyMeta && legacyMeta.srcset) || '', alt: item.alt || (index === 0 && resource.imageAlts && resource.imageAlts.imageUrl) || resource.title || 'Recurso descargable', id: item.id || ('rc-gallery-' + index), placeholder: index === 0 ? 'portada del recurso' : 'página ' + (index + 1) + ' del recurso', viewScale: Number(view.scale || view.zoom / 100) || 1, viewX: Number(view.x) || 0, viewY: Number(view.y) || 0 };
    });
    const galleryIndex = Math.min(this.state.galleryIndex, gallery.length - 1);
    const activeGalleryImage = gallery[galleryIndex];
    const relationType = String(resource.nextItemId || '').split(':')[0];
    return {
      navGap: m ? '64px' : '88px',
      crumbPad: m ? '16px 24px 0' : '24px 48px 0',
      mainPad: m ? '20px 24px 40px' : '32px 48px 60px',
      mainCols: m ? '1fr' : '0.8fr 1.2fr',
      mainGap: m ? '28px' : '64px',
      h1Size: m ? '24px' : '34px',
      title: resource.title || 'Plantilla de Trazos Básicos',
      format: resource.format || 'PDF',
      pageCount: resource.pageCount || '',
      printableLabel: resource.printableLabel || '',
      description: resource.description || 'Una guía imprimible para practicar los trazos fundamentales del lettering antes de pasar a las letras completas.',
      audience: resource.audience || 'Para quien nunca ha practicado lettering y quiere empezar por los fundamentos, sin necesidad de un curso completo.',
      usage: resource.usage || 'Imprime la plantilla en papel liso y repasa cada trazo con un marcador de punta pincel, siguiendo el orden sugerido en la guía.',
      activeGalleryImage,
      showGalleryNavigation: gallery.length > 1,
      galleryDots: gallery.map((entry, index) => ({ id: entry.id + '-dot', label: 'Mostrar imagen ' + (index + 1), width: index === galleryIndex ? '18px' : '7px', background: index === galleryIndex ? '#0CC0DF' : '#CFC4B2', onClick: () => this.setGalleryIndex(index) })),
      onPreviousGallery: () => this.setGalleryIndex((galleryIndex - 1 + gallery.length) % gallery.length),
      onNextGallery: () => this.setGalleryIndex((galleryIndex + 1) % gallery.length),
      nextPad: m ? '10px 24px 60px' : '0 48px 90px',
      contains: Array.isArray(resource.contains) && resource.contains.length ? resource.contains : ['6 láminas de trazos progresivos', 'Guía de postura y agarre', 'Espacio para practicar tu propio nombre'],
      downloadUrl: resource.fileUrl || '#',
      downloadLabel: resource.downloadLabel || 'Descargar gratis',
      nextHref: related.id ? `/aprende/${relationType === 'taller' ? 'taller' : 'curso'}?id=${encodeURIComponent(related.id)}` : '/aprende?tab=Cursos',
      nextImageUrl: related.imageUrl || '',
      nextImageSrcset: (related.imageMeta && related.imageMeta.imageUrl && related.imageMeta.imageUrl.srcset) || '',
      nextImageAlt: (related.imageAlts && related.imageAlts.imageUrl) || related.name || 'Contenido relacionado de Aprende',
      nextTitle: related.name ? `${relationType === 'taller' ? 'Taller' : 'Curso'}: ${related.name}` : 'Explora los cursos y talleres',
      nextDescription: related.desc || related.summary || 'Sigue aprendiendo con el contenido disponible en Aprende.',
    };
  }
}

</script>
</body>
</html>
