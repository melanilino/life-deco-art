<x-dc>
<nav style="position:fixed;top:0;left:0;right:0;z-index:50;height:{{ navHeight }};box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:{{ navPadding }};background:#FFFFFF;font-family:'Montserrat',sans-serif;transition:box-shadow .3s ease;" id="lda-nav">
  <a href="/" style="display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#000000;flex-shrink:0;">
    <span class="lda-script-logo" style="font-size:30px;font-weight:400;line-height:1;letter-spacing:.13px;color:#000000;font-family:'Camelia Beauty',cursive;white-space:nowrap;">{{ siteName }}</span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
        <a href="{{ link.href }}" style="text-decoration:none;font-size:14px;font-weight:400;letter-spacing:.01em;color:{{ link.color }};padding-bottom:6px;background-image:linear-gradient({{ link.color }},{{ link.color }});background-repeat:no-repeat;background-position:left bottom;background-size:{{ link.bgSize }} 1px;transition:color .25s ease,background-size .25s ease;" style-hover="background-size:100% 1px;">{{ link.label }}</a>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" aria-expanded="{{ menuOpen }}" aria-controls="lda-mobile-navigation" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:5px;padding:10px;min-width:44px;min-height:44px;cursor:pointer;border:0;background:transparent;-webkit-tap-highlight-color:transparent;">
      <span style="width:20px;height:1.25px;background:#000000;"></span>
      <span style="width:20px;height:1.25px;background:#000000;"></span>
      <span style="width:20px;height:1.25px;background:#000000;"></span>
    </button>
  </sc-if>
</nav>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div id="lda-mobile-navigation" style="position:fixed;top:64px;left:0;right:0;bottom:0;z-index:49;background:#FFFFFF;display:flex;flex-direction:column;padding:24px;overflow-y:auto;">
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
      <a href="{{ link.href }}" style="font-family:'Montserrat',sans-serif;text-decoration:none;padding:18px 4px;border-bottom:1px solid #F0EAE0;font-size:20px;font-weight:300;color:{{ link.color }};-webkit-tap-highlight-color:transparent;transition:opacity .12s ease;" style-active="opacity:.55;">{{ link.label }}</a>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;activePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inicio&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;sobre-mi&quot;,&quot;tienda&quot;,&quot;aprende&quot;,&quot;contacto&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0CC0DF&quot;,&quot;options&quot;:[&quot;#0CC0DF&quot;,&quot;#F65091&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 860, menuOpen: false, globalContent: {} };
  async componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860, menuOpen: window.innerWidth < 860 && this.state.menuOpen });
    check();
    this._resizeHandler = check;
    window.addEventListener('resize', this._resizeHandler, { passive: true });
    this._keyHandler = (event) => {
      if (event.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false });
    };
    document.addEventListener('keydown', this._keyHandler);
    try {
      const cms = await import('/cms.js');
      const globalContent = await cms.getPageContent('global');
      this.setState({ globalContent });
    } catch (_) {}

    // Prepare the five navbar destinations invisibly. On browsers that support
    // Speculation Rules this prerenders the full document, so clicking the nav
    // swaps to an already-rendered page instead of showing an intermediate boot.
    const navUrls = ['/', '/sobre-mi', '/tienda', '/aprende', '/contacto'];
    if (!document.getElementById('lda-speculation-rules')) {
      try {
        if (HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules')) {
          const s = document.createElement('script');
          s.id = 'lda-speculation-rules';
          s.type = 'speculationrules';
          s.textContent = JSON.stringify({
            prerender: [{ source: 'list', urls: navUrls, eagerness: 'eager' }]
          });
          document.head.appendChild(s);
        } else {
          navUrls.forEach((href) => {
            if (href === window.location.pathname) return;
            const l = document.createElement('link');
            l.rel = 'prefetch';
            l.href = href;
            l.as = 'document';
            document.head.appendChild(l);
          });
        }
      } catch (_) {}
    }

    if (!document.getElementById('lda-whatsapp-fab')) {
      const a = document.createElement('a');
      a.id = 'lda-whatsapp-fab';
      a.href = `https://wa.me/${this.state.globalContent.whatsappNumber || '18495390410'}`;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = 'Escríbenos por WhatsApp';
      Object.assign(a.style, { position:'fixed',bottom:'40px',right:'24px',zIndex:'2147483000',width:'56px',height:'56px',borderRadius:'999px',background:'#25D366',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 6px 18px rgba(0,0,0,.25)',transition:'transform .25s ease' });
      a.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.62 1.44 5.15L2 22l5.13-1.5a9.8 9.8 0 0 0 4.91 1.32h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.51 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.81 1.98.88 2.12.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.13.63-.05.17-.17.71-.83.9-1.11.19-.29.38-.24.63-.15.26.1 1.65.78 1.93.92.29.15.48.22.55.34.07.13.07.72-.17 1.4z"></path></svg>';
      a.addEventListener('mouseenter', () => { a.style.transform = 'scale(1.08)'; });
      a.addEventListener('mouseleave', () => { a.style.transform = 'scale(1)'; });
      document.body.appendChild(a);
    }
  }
  componentWillUnmount() {
    if (this._resizeHandler) window.removeEventListener('resize', this._resizeHandler);
    if (this._keyHandler) document.removeEventListener('keydown', this._keyHandler);
  }
  renderVals() {
    const active = this.props.activePage || 'inicio';
    const global = this.state.globalContent || {};
    const accentColor = '#8B795E';
    const items = [
      { id:'inicio',label:global.navInicio || 'Inicio',href:'/' },
      { id:'sobre-mi',label:global.navSobreMi || 'Sobre Mí',href:'/sobre-mi' },
      { id:'tienda',label:global.navTienda || 'Tienda',href:'/tienda' },
      { id:'aprende',label:global.navAprende || 'Aprende',href:'/aprende' },
      { id:'contacto',label:global.navContacto || 'Contacto',href:'/contacto' }
    ];
    const sectionColors = { tienda:'#F65091', aprende:'#0CC0DF' };
    const links = items.map(it => ({ href:it.href,label:it.label,color:it.id===active?(sectionColors[it.id]||accentColor):'#000000',bgSize:it.id===active?'100%':'0%' }));
    return { siteName: global.siteName || 'Life Deco Art', accentColor,links,isMobile:this.state.isMobile,isDesktop:!this.state.isMobile,navHeight:this.state.isMobile?'64px':'80px',navPadding:this.state.isMobile?'0 20px':'0 48px',menuOpen:this.state.isMobile&&this.state.menuOpen,menuLabel:this.state.menuOpen?'Cerrar menú':'Abrir menú',toggleMenu:()=>this.setState({ menuOpen:!this.state.menuOpen }) };
  }
}
</script>
