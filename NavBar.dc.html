<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<style id="dc-critical-boot">
x-dc{display:none!important}
#dc-boot-fallback{position:fixed;inset:0;z-index:2147482999;background:#fff;font-family:Montserrat,Arial,sans-serif;color:#000}
#dc-boot-fallback .dc-fb-nav{height:80px;display:flex;align-items:center;padding:0 48px;box-sizing:border-box;background:#fff}
#dc-boot-fallback .dc-fb-brand{font-size:20px;font-weight:400;letter-spacing:.13px;white-space:nowrap}
#dc-boot-fallback .dc-fb-hero{height:calc(100vh - 38px);min-height:560px;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 48px 0;box-sizing:border-box}
#dc-boot-fallback .dc-fb-kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;margin-bottom:28px}
#dc-boot-fallback .dc-fb-title{font-size:clamp(28px,5.2vw,70px);line-height:1.25;font-weight:200;margin:10px 0 18px}
#dc-boot-fallback .dc-fb-sub{font-size:18px;line-height:1.6;color:rgba(255,255,255,.82);font-weight:300;max-width:600px;margin:0 0 32px}
#dc-boot-fallback .dc-fb-actions{display:flex;gap:14px}
#dc-boot-fallback .dc-fb-actions span{display:block;padding:17px 60px;border-radius:4px;font-size:15px;font-weight:500}
#dc-boot-fallback .dc-fb-buy{background:#F65091}.dc-fb-learn{border:1px solid #fff;padding:16px 60px!important}
@media(max-width:859px){#dc-boot-fallback .dc-fb-nav{height:64px;padding:0 20px}#dc-boot-fallback .dc-fb-hero{height:400px;min-height:400px;padding:72px 26px 16px}#dc-boot-fallback .dc-fb-kicker{font-size:11px;letter-spacing:.18em;margin-bottom:18px}#dc-boot-fallback .dc-fb-title{font-size:26px;font-weight:300;margin:0 0 14px}#dc-boot-fallback .dc-fb-sub{font-size:14px;margin:0 0 28px}#dc-boot-fallback .dc-fb-actions{gap:12px;width:100%}#dc-boot-fallback .dc-fb-actions span{flex:1;padding:16px 0}#dc-boot-fallback .dc-fb-learn{padding:15px 0!important}}
</style>
<script src="./support.js?v=20260810p1" defer></script>
</head>
<body>
<div id="dc-boot-fallback" aria-hidden="true"><div class="dc-fb-nav"><span class="dc-fb-brand">Life Deco Art</span></div></div>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&amp;family=Homemade+Apple&amp;display=swap" rel="stylesheet">
<link rel="prefetch" href="/">
<link rel="prefetch" href="/sobre-mi">
<link rel="prefetch" href="/tienda">
<link rel="prefetch" href="/contacto">
<link rel="prefetch" href="/aprende">
<style>
  body { margin: 0; }
</style>
</helmet>
<nav style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: {{ navPadding }}; background: #FFFFFF; font-family: 'Montserrat',sans-serif; transition: box-shadow .3s ease;" id="lda-nav">
  <a href="/" style="display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#000000;flex-shrink:0;">
    <span style="font-size: 20px; font-weight: 400; letter-spacing: 0.13px; text-transform: none; color: #000000; font-family: 'Homemade Apple', cursive;white-space:nowrap;">Life Deco Art</span>
  </a>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;">
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
      <a href="{{ link.href }}" style="text-decoration: none; font-size: 14px; font-weight: 400; letter-spacing: 0.01em; color: {{ link.color }}; padding-bottom: 6px; background-image: linear-gradient({{ link.color }},{{ link.color }}); background-repeat: no-repeat; background-position: left bottom; background-size: {{ link.bgSize }} 1px; transition: color .25s ease, background-size .25s ease;" style-hover="background-size:100% 1px;">{{ link.label }}</a>
    </sc-for>
  </div>
  </sc-if>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ toggleMenu }}" style="display:flex;flex-direction:column;gap:5px;padding:10px;cursor:pointer;">
    <span style="width:22px;height:2px;background:#000000;"></span>
    <span style="width:22px;height:2px;background:#000000;"></span>
    <span style="width:15px;height:2px;background:#000000;"></span>
  </div>
  </sc-if>
</nav>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:64px;left:0;right:0;bottom:0;z-index:49;background:#FFFFFF;display:flex;flex-direction:column;padding:24px;overflow-y:auto;">
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
      <a href="{{ link.href }}" style="font-family:'Montserrat',sans-serif;text-decoration:none;padding:18px 4px;border-bottom:1px solid #F0EAE0;font-size:20px;font-weight:300;color:{{ link.color }};">{{ link.label }}</a>
    </sc-for>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;activePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;inicio&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;sobre-mi&quot;,&quot;tienda&quot;,&quot;aprende&quot;,&quot;contacto&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0CC0DF&quot;,&quot;options&quot;:[&quot;#0CC0DF&quot;,&quot;#F65091&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 860, menuOpen: false };
  componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
    this._resizeHandler = check;
    window.addEventListener('resize', this._resizeHandler, { passive: true });
    if (!document.getElementById('lda-whatsapp-fab')) {
      const a = document.createElement('a');
      a.id = 'lda-whatsapp-fab';
      a.href = 'https://wa.me/18495390410';
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = 'Escríbenos por WhatsApp';
      Object.assign(a.style, {
        position: 'fixed', bottom: '40px', right: '24px', zIndex: '2147483000',
        width: '56px', height: '56px', borderRadius: '999px', background: '#25D366',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        boxShadow: '0 6px 18px rgba(0,0,0,.25)', transition: 'transform .25s ease',
      });
      a.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.62 1.44 5.15L2 22l5.13-1.5a9.8 9.8 0 0 0 4.91 1.32h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.51 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.81 1.98.88 2.12.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.13.63-.05.17-.17.71-.83.9-1.11.19-.29.38-.24.63-.15.26.1 1.65.78 1.93.92.29.15.48.22.55.34.07.13.07.72-.17 1.4z"></path></svg>';
      a.addEventListener('mouseenter', () => { a.style.transform = 'scale(1.08)'; });
      a.addEventListener('mouseleave', () => { a.style.transform = 'scale(1)'; });
      document.body.appendChild(a);
    }
  }
  componentWillUnmount() {
    if (this._resizeHandler) window.removeEventListener('resize', this._resizeHandler);
  }
  renderVals() {
    const active = this.props.activePage || 'inicio';
    const accentColor = '#8B795E';
    const items = [
      { id: 'inicio', label: 'Inicio', href: '/' },
      { id: 'sobre-mi', label: 'Sobre Mí', href: '/sobre-mi' },
      { id: 'tienda', label: 'Tienda', href: '/tienda' },
      { id: 'aprende', label: 'Aprende', href: '/aprende' },
      { id: 'contacto', label: 'Contacto', href: '/contacto' },
    ];
    const sectionColors = { tienda: '#F65091', aprende: '#0CC0DF' };
    const links = items.map(it => {
      const color = it.id === active ? (sectionColors[it.id] || accentColor) : '#000000';
      return {
        href: it.href,
        label: it.label,
        color,
        bgSize: it.id === active ? '100%' : '0%',
      };
    });
    return {
      accentColor, links,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      navPadding: this.state.isMobile ? '18px 20px' : '26px 48px',
      menuOpen: this.state.isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
    };
  }
}
</script>
</body>
</html>
