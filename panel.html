<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="/panel/panel.css?v=20261115-hub-login"><script type="module" src="/panel/app.mjs?v=20261117-hub-form-actions"></script>
<link rel="stylesheet" href="/panel/content.css?v=20261111-hub-visual-fixes">
<link rel="stylesheet" href="/panel/agenda.css?v=20261111-list-and-calendar-width">

<link rel="stylesheet" href="/panel/clients-pilot.css?v=20261108-hub-six-sizes-4">

</head>
<body>
 <a class="skip" href="#main">Ir al contenido</a>
 <div id="app"></div>
 <div id="notice" role="status" aria-live="polite"></div>
 <template id="hub-login-template">
  <main id="main" class="hub-login" tabindex="-1">
   <section class="hub-login-card" aria-labelledby="hub-login-title">
    <p class="hub-login-brand">Life Deco Art</p>
    <h1 id="hub-login-title">HUB — <span>gestión</span></h1>
    <form id="hub-login-form">
     <input type="email" name="email" placeholder="Correo" aria-label="Correo" autocomplete="username" required>
     <div class="hub-login-password">
      <input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required id="hub-login-password">
      <button type="button" data-password-toggle aria-controls="hub-login-password" aria-label="Mostrar contraseña">Mostrar</button>
     </div>
     <p class="hub-login-error" role="alert" hidden></p>
     <button type="submit" class="hub-login-submit">Ingresar</button>
     <button type="button" class="hub-login-recover">Recuperar acceso</button>
     <div class="hub-login-confirmation" role="status" hidden>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Solicitud enviada</div>
      <p>Si el correo está registrado, recibirás el enlace en unos minutos.</p>
     </div>
    </form>
   </section>
  </main>
 </template>
 <noscript>Activa JavaScript para utilizar el panel privado.</noscript>
</body>
</html>
