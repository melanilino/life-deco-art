<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh;background:#F9F6EF;font-family:'Montserrat',sans-serif;padding:56px 40px;">
  <div style="max-width:1000px;margin:0 auto;">
    <div style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:10px;">Life Deco Art</div>
    <h1 style="font-size:28px;font-weight:400;color:#000;margin:0 0 24px;">Opciones de favicon — ícono de lápiz</h1>
    <div style="background:#fff;border:1px solid #EEE6D8;border-radius:10px;padding:14px 20px;display:inline-flex;align-items:center;gap:10px;margin-bottom:40px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
      <div style="display:flex;align-items:center;gap:8px;background:#E8E8E8;border-radius:8px 8px 0 0;padding:8px 16px 8px 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="M15 5l4 4"></path></svg>
        <span style="font-size:12.5px;color:#333;">Life Deco Art | Contacto</span>
        <span style="color:#888;margin-left:4px;">×</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;">

      <sc-for list="{{ options }}" as="opt" hint-placeholder-count="6">
        <div style="background:#FFFFFF;border:1px solid #EEE6D8;border-radius:10px;padding:24px;text-align:center;">
          <div style="font-size:12px;font-weight:600;color:#8B795E;margin-bottom:16px;">{{ opt.label }}</div>
          <div style="width:80px;height:80px;margin:0 auto 20px;border-radius:{{ opt.radius }};background:{{ opt.bg }};display:flex;align-items:center;justify-content:center;" dangerouslySetInnerHTML="{{ opt.icon }}"></div>
          <div style="display:inline-flex;align-items:center;gap:6px;background:#F3EEE4;border-radius:6px;padding:6px 12px;">
            <div style="width:16px;height:16px;border-radius:3px;overflow:hidden;flex-shrink:0;" dangerouslySetInnerHTML="{{ opt.iconSmall }}"></div>
            <span style="font-size:11px;color:#5C5142;">Life Deco Art</span>
          </div>
        </div>
      </sc-for>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  pencil(stroke, fill) {
    return `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="M15 5l4 4"></path></svg>`;
  }
  pencilSmall(stroke) {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="M15 5l4 4"></path></svg>`;
  }
  renderVals() {
    const defs = [
      { label: 'A — Negro con lápiz crema', bg: '#000000', radius: '18px', stroke: '#F3EEE4' },
      { label: 'B — Crema con lápiz negro', bg: '#F3EEE4', radius: '18px', stroke: '#000000' },
      { label: 'C — Rosa marca (F65091)', bg: '#F65091', radius: '18px', stroke: '#FFFFFF' },
      { label: 'D — Cian marca (0CC0DF)', bg: '#0CC0DF', radius: '18px', stroke: '#FFFFFF' },
      { label: 'E — Circular negro', bg: '#000000', radius: '999px', stroke: '#F3EEE4' },
      { label: 'F — Beige cálido (8B795E)', bg: '#8B795E', radius: '18px', stroke: '#FFFFFF' },
    ];
    const options = defs.map(d => ({
      label: d.label,
      bg: d.bg,
      radius: d.radius,
      icon: { __html: this.pencil(d.stroke) },
      iconSmall: { __html: `<div style="width:100%;height:100%;background:${d.bg};border-radius:3px;display:flex;align-items:center;justify-content:center;">${this.pencilSmall(d.stroke)}</div>` },
    }));
    const transparentDefs = [
      { label: 'G — Sin fondo, lápiz negro', stroke: '#000000' },
      { label: 'H — Sin fondo, lápiz rosa (F65091)', stroke: '#F65091' },
      { label: 'I — Sin fondo, lápiz beige (8B795E)', stroke: '#8B795E' },
    ];
    const checker = 'repeating-conic-gradient(#E4DCCB 0% 25%, #FFFFFF 0% 50%) 50% / 12px 12px';
    const transparentOptions = transparentDefs.map(d => ({
      label: d.label,
      bg: checker,
      radius: '18px',
      icon: { __html: this.pencil(d.stroke) },
      iconSmall: { __html: `<div style="width:100%;height:100%;background:${checker};border-radius:3px;display:flex;align-items:center;justify-content:center;">${this.pencilSmall(d.stroke)}</div>` },
    }));
    return { options: [...options, ...transparentOptions] };
  }
}

</script>
</body>
</html>
