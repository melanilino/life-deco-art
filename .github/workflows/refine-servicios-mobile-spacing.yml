name: Refine Servicios mobile spacing

on:
  push:
    paths:
      - '.github/workflows/refine-servicios-mobile-spacing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Servicios section rhythm on mobile
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')

          old_outer = '<div data-reveal="" style="padding:56px 26px 0;opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);">\n    <div class="lda-section-eyebrow lda-eyebrow-servicios"'
          new_outer = '<div data-reveal="" style="padding:80px 26px 0;opacity:0;transform:translateY(16px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);">\n    <div class="lda-section-eyebrow lda-eyebrow-servicios"'
          if old_outer not in t:
              raise SystemExit('Servicios mobile outer spacing pattern not found')
          t = t.replace(old_outer, new_outer, 1)

          old_title = '<div style="font-size:24px;color:#000000;font-weight:300;text-align:center;margin-bottom:20px;">En qué puedo <span'
          new_title = '<div style="font-size:24px;color:#000000;font-weight:300;text-align:center;margin-bottom:8px;">En qué puedo <span'
          if old_title not in t:
              raise SystemExit('Servicios mobile title spacing pattern not found')
          t = t.replace(old_title, new_title, 1)

          p.write_text(t, encoding='utf-8')
          checks = [
              'padding:80px 26px 0;opacity:0;transform:translateY(16px)',
              'text-align:center;margin-bottom:8px;">En qué puedo',
              '.lda-eyebrow-servicios{margin-bottom:0!important;}'
          ]
          for check in checks:
              if check not in t:
                  raise SystemExit(f'Guardrail failed: {check}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html'
          git commit -m "Refine Servicios mobile section spacing"
          git push
