name: Fix product detail mobile layout
on:
  push:
    paths:
      - '.github/workflows/fix-product-detail-mobile.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair mobile layout for product detail template
        shell: python
        run: |
          from pathlib import Path
          p = Path('Productos.dc.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<dc-import name="NavBar" active-page="tienda" hint-size="100%,80px" style="position: absolute; left: 4px; top: 1px"></dc-import>', '<dc-import name="NavBar" active-page="tienda" hint-size="100%,80px"></dc-import>')

          s = s.replace('''  <div style="max-width:1240px;margin:0 auto;padding:{{ crumbPad }};display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#8B795E;font-weight:300;">''', '''  <div style="max-width:1240px;margin:0 auto;padding:{{ crumbPad }};display:flex;align-items:center;gap:{{ crumbGap }};flex-wrap:wrap;font-size:{{ crumbSize }};line-height:1.5;color:#8B795E;font-weight:300;min-width:0;">''')

          s = s.replace('''      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">''', '''      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:{{ thumbGap }};">''')

          s = s.replace('''      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">''', '''      <div style="display:grid;grid-template-columns:{{ infoCols }};gap:{{ infoGap }};margin-bottom:24px;min-width:0;">''')

          s = s.replace('''      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">\n        <a href="{{ whatsappUrl }}" target="_blank" style="text-decoration:none;background:#F65091;color:#FFFFFF;padding:15px 30px;border-radius:6px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;transition:transform .25s ease;" style-hover="transform:translateY(-3px);">\n          Pedir por WhatsApp\n        </a>\n        <div title="Próximamente: pago en línea" style="padding:15px 30px;border-radius:6px;border:1px solid #E5DDD0;font-size:14px;font-weight:500;color:#B8ADA0;cursor:not-allowed;">Comprar — próximamente</div>\n      </div>''', '''      <div style="display:flex;gap:{{ actionGap }};flex-wrap:{{ actionWrap }};align-items:stretch;flex-direction:{{ actionDir }};width:100%;">\n        <a href="{{ whatsappUrl }}" target="_blank" style="box-sizing:border-box;text-decoration:none;background:#F65091;color:#FFFFFF;padding:15px 22px;border-radius:6px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .25s ease;width:{{ actionWidth }};text-align:center;" style-hover="transform:translateY(-3px);">\n          Pedir por WhatsApp\n        </a>\n        <div title="Próximamente: pago en línea" style="box-sizing:border-box;padding:15px 22px;border-radius:6px;border:1px solid #E5DDD0;font-size:14px;font-weight:500;color:#B8ADA0;cursor:not-allowed;width:{{ actionWidth }};text-align:center;">Comprar — próximamente</div>\n      </div>''')

          s = s.replace('''    <div style="position:fixed;bottom:0;left:0;right:0;z-index:40;background:#FFFFFF;box-shadow:0 -4px 16px rgba(0,0,0,0.08);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;">''', '''    <div style="position:fixed;bottom:0;left:0;right:0;z-index:2147482500;background:#FFFFFF;box-shadow:0 -4px 16px rgba(0,0,0,0.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;">''')
          s = s.replace('''      <a href="{{ whatsappUrl }}" target="_blank" style="text-decoration:none;background:#F65091;color:#FFFFFF;padding:12px 22px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap;">Pedir por WhatsApp</a>''', '''      <a href="{{ whatsappUrl }}" target="_blank" style="text-decoration:none;background:#F65091;color:#FFFFFF;padding:11px 16px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;">Pedir por WhatsApp</a>''')

          s = s.replace("crumbPad: m ? '16px 24px 0' : '24px 48px 0',", "crumbPad: m ? '14px 20px 0' : '24px 48px 0',\n      crumbGap: m ? '5px' : '8px',\n      crumbSize: m ? '11px' : '13px',")
          s = s.replace("mainPad: m ? '20px 24px 40px' : '32px 48px 60px',", "mainPad: m ? '18px 20px 32px' : '32px 48px 60px',")
          s = s.replace("mainGap: m ? '32px' : '80px',", "mainGap: m ? '26px' : '80px',\n      thumbGap: m ? '8px' : '12px',\n      infoCols: m ? '1fr' : '1fr 1fr',\n      infoGap: m ? '18px' : '20px',\n      actionDir: m ? 'column' : 'row',\n      actionWrap: m ? 'nowrap' : 'wrap',\n      actionGap: m ? '10px' : '14px',\n      actionWidth: m ? '100%' : 'auto',")
          s = s.replace("relatedPad: m ? '20px 24px 50px' : '40px 48px 90px',", "relatedPad: m ? '28px 20px 46px' : '40px 48px 90px',")
          s = s.replace("relatedGap: m ? '24px 16px' : '32px',", "relatedGap: m ? '22px 12px' : '32px',")
          s = s.replace('/support.js?v=20260812-subpages4', '/support.js?v=20260812-product-mobile1')
          s = s.replace('<script src="/image-slot.js"></script>', '<script src="/image-slot.js?v=20260812-product-mobile1"></script>')
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Productos.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile product detail layout"
          git push