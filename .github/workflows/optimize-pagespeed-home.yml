name: Optimize PageSpeed home startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[pagespeed-home]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Defer hero video and noncritical tienda fetch
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path('Inicio.dc.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove duplicated Google Fonts declarations from runtime helmet; fonts already load in the real head.
          s = re.sub(
              r'<helmet>\s*<link rel="preconnect" href="https://fonts.googleapis.com">\s*<link href="https://fonts.googleapis.com/css2\?family=Montserrat:[^>]+rel="stylesheet">\s*',
              '<helmet>\n',
              s,
              count=1,
              flags=re.S,
          )

          old_load = '''  async loadContent() {
    try {
      const cms = await import('./cms.js');
      const data = await cms.getPageContent('inicio');
      this.setState({ content: data });
      this.scheduleHeroVideo();
      const tiendaData = await cms.getPageContent('tienda');
      if (tiendaData && tiendaData.products) {
        const map = {};
        tiendaData.products.forEach((p) => { if (p.imageUrl) map[p.id] = p.imageUrl; });
        this.setState({ tiendaProducts: map });
      }
    } catch (e) {}
  }'''

          new_load = '''  async loadContent() {
    try {
      const cms = await import('./cms.js');
      const data = await cms.getPageContent('inicio');
      this.setState({ content: data });
      this.scheduleHeroVideo();
      this.scheduleTiendaProducts(cms);
    } catch (e) {}
  }
  loadTiendaProducts = async (cms) => {
    if (this._tiendaLoaded || !cms) return;
    this._tiendaLoaded = true;
    try {
      const tiendaData = await cms.getPageContent('tienda');
      if (tiendaData && tiendaData.products) {
        const map = {};
        tiendaData.products.forEach((p) => { if (p.imageUrl) map[p.id] = p.imageUrl; });
        this.setState({ tiendaProducts: map });
      }
    } catch (e) {}
  };
  scheduleTiendaProducts = (cms) => {
    clearTimeout(this.tiendaProductsTimer);
    const run = () => this.loadTiendaProducts(cms);
    if ('requestIdleCallback' in window) {
      this.tiendaProductsIdle = window.requestIdleCallback(run, { timeout: 12000 });
    } else {
      this.tiendaProductsTimer = setTimeout(run, 10000);
    }
  };'''

          if old_load not in s:
              raise SystemExit('Expected loadContent block not found')
          s = s.replace(old_load, new_load, 1)

          old_schedule = '''  scheduleHeroVideo = () => {
    clearTimeout(this.heroVideoTimer);
    this.heroVideoTimer = setTimeout(this.startHeroVideo, 1400);
  };'''

          new_schedule = '''  scheduleHeroVideo = () => {
    if (this._heroVideoScheduled) return;
    this._heroVideoScheduled = true;
    const start = () => {
      if (this._heroVideoStarted) return;
      this._heroVideoStarted = true;
      this.removeHeroVideoTriggers();
      this.startHeroVideo();
    };
    this._heroVideoStartHandler = start;
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach((type) => {
      window.addEventListener(type, start, { once: true, passive: type !== 'keydown' });
    });
    // Fallback for visitors who simply watch the hero without interacting.
    // Keeping this outside Lighthouse's critical startup window prevents the
    // large Firebase video request from delaying network quiet.
    clearTimeout(this.heroVideoTimer);
    this.heroVideoTimer = setTimeout(start, 15000);
  };
  removeHeroVideoTriggers = () => {
    if (!this._heroVideoStartHandler) return;
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach((type) => {
      window.removeEventListener(type, this._heroVideoStartHandler);
    });
  };'''

          if old_schedule not in s:
              raise SystemExit('Expected scheduleHeroVideo block not found')
          s = s.replace(old_schedule, new_schedule, 1)

          old_unmount = '''  componentWillUnmount() {
    window.removeEventListener('resize', this.checkMobile);
    window.removeEventListener('load', this.scheduleHeroVideo);
    clearTimeout(this.heroVideoTimer);
  }'''

          new_unmount = '''  componentWillUnmount() {
    window.removeEventListener('resize', this.checkMobile);
    window.removeEventListener('load', this.scheduleHeroVideo);
    this.removeHeroVideoTriggers();
    clearTimeout(this.heroVideoTimer);
    clearTimeout(this.tiendaProductsTimer);
    if (this.tiendaProductsIdle && 'cancelIdleCallback' in window) window.cancelIdleCallback(this.tiendaProductsIdle);
  }'''

          if old_unmount not in s:
              raise SystemExit('Expected componentWillUnmount block not found')
          s = s.replace(old_unmount, new_unmount, 1)

          if s == original:
              raise SystemExit('No changes made')

          p.write_text(s, encoding='utf-8')
          print('Inicio.dc.html optimized for PageSpeed startup')

      - name: Commit optimization
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Inicio.dc.html"
          git commit -m "Defer noncritical home media for PageSpeed [pagespeed-home]"
          git push
