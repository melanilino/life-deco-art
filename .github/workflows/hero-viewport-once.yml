name: Hero Viewport Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match hero to viewport below navbar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text(encoding='utf-8')
          old = 'height:calc(100vh - 38px);min-height:560px'
          new = 'height:calc(100vh - 80px);min-height:560px'
          count = s.count(old)
          if count < 1:
              raise SystemExit('Expected hero height not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/hero-viewport-once.yml').unlink()
          print(f'Updated {count} hero height occurrence(s)')
          PY
      - name: Commit hero adjustment
        run: |
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fit home hero to viewport below navbar [hero-viewport]"
          git push
