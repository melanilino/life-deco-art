name: Final mobile visual tune
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-mobile-visual-tune.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final visual tune
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Home Aprende spotlight: 12px more visible breathing room above and below,
          # while keeping the image anchored in the same visual position.
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "spotlightTopPad: m ? '23px' : '96px',\n      spotlightMarginTop: m ? '56px' : gap + 'px',\n      spotlightNegMargin: m ? '-107px' : '-100px',"
          new = "spotlightTopPad: m ? '35px' : '96px',\n      spotlightBottomPad: m ? '142px' : '130px',\n      spotlightMarginTop: m ? '56px' : gap + 'px',\n      spotlightNegMargin: m ? '-131px' : '-100px',"
          if old not in s:
              raise SystemExit('Inicio vars pattern not found')
          s = s.replace(old, new, 1)
          old2 = 'style="padding: {{ spotlightTopPad }} {{ sidePad }} 130px; text-align: center;'
          new2 = 'style="padding: {{ spotlightTopPad }} {{ sidePad }} {{ spotlightBottomPad }}; text-align: center;'
          if old2 not in s:
              raise SystemExit('Inicio padding pattern not found')
          p.write_text(s.replace(old2, new2, 1))

          # Tienda load-more: match Aprende's optical centering by shifting the
          # 72px load-more region upward inside the same total vertical space.
          p = Path('Tienda.dc.html')
          s = p.read_text()
          old = '<div class="lda-load-more-wrap" style="display:flex;justify-content:center;padding:44px 0 24px;">'
          new = '<div class="lda-load-more-wrap lda-tienda-load-more" style="display:flex;justify-content:center;padding:44px 0 24px;transform:translateY(-20px);margin-bottom:-20px;">'
          if old not in s:
              raise SystemExit('Tienda load-more pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html Tienda.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine mobile spotlight and load more alignment"
          git push origin main
