name: Fix blog mobile breakpoint
on:
  push:
    paths:
      - '.github/workflows/fix-blog-mobile-breakpoint.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align blog mobile breakpoint with site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          s = s.replace('@media (max-width: 600px) {', '@media (max-width: 859px) {')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Align blog mobile breakpoint with site"
          git push origin main
