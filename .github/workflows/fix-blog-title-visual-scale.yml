name: Fix blog title visual scale
on:
  push:
    paths:
      - '.github/workflows/fix-blog-title-visual-scale.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match mobile blog title to approved visual reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          s = s.replace(".bp-title { font-size: 20px !important; line-height: 1.32 !important; -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }", ".bp-title { font-size: 16px !important; line-height: 1.38 !important; -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }")
          s = s.replace(".bp-title span.lda-script-hero { font-size: 46px !important; line-height: .78 !important; }", ".bp-title span.lda-script-hero { font-size: 30px !important; line-height: .82 !important; }")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Match blog title visual scale on mobile"
          git push origin main
