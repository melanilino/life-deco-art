name: Fix navigation first paint
on:
  push:
    paths:
      - '.github/workflows/fix-navigation-first-paint.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply navigation continuity fix
        run: |
          python3 - <<'PY'
          import base64
          exec(base64.b64decode(' ').decode())
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html' site-enhancements.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Keep page navigation visually continuous"
          git push origin main
