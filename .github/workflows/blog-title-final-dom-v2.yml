name: Blog title final DOM v2
on:
  push:
    paths:
      - '.github/workflows/blog-title-final-dom-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch blog title after render
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          needle = '</body>'
          snippet = """<script>
          (function(){
            function fixTitle(){
              if(window.innerWidth>859)return;
              var t=document.querySelector('.bp-title');
              if(!t)return;
              t.style.setProperty('font-size','18px','important');
              t.style.setProperty('line-height','1.34','important');
              var a=t.querySelector('.lda-script-hero');
              if(a){a.style.setProperty('font-size','34px','important');a.style.setProperty('line-height','.82','important');}
            }
            fixTitle();
            setTimeout(fixTitle,50);
            setTimeout(fixTitle,250);
            new MutationObserver(fixTitle).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          """
          if 'function fixTitle()' in s:
              raise SystemExit('already patched')
          if needle not in s:
              raise SystemExit('body close not found')
          p.write_text(s.replace(needle, snippet + needle, 1))
          PY
      - name: Commit
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Force smaller mobile blog title after render"
          git push origin main
