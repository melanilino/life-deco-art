name: Restore mobile navigation links
on:
  push:
    paths:
      - '.github/workflows/restore-mobile-nav-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove mobile close handler that cancels iOS navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('site-enhancements.js')
          s = p.read_text()
          pattern = r'''\n\s*if \(!details\.dataset\.ldaCloseBeforeNav\) \{.*?\n\s*\}\n(?=\s*\}\);\n\n\s*document\.querySelectorAll\('a\[target="_blank"\]'\))'''
          ns, n = re.subn(pattern, '\n', s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected to remove 1 mobile close block, removed {n}')
          p.write_text(ns)
          PY
      - name: Commit fix
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add site-enhancements.js
          git diff --cached --check
          git commit -m "Restore mobile navigation link activation"
          git push origin main
