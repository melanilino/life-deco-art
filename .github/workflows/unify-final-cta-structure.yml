name: Unify final CTA structure
on:
  push:
    paths:
      - '.github/workflows/unify-final-cta-structure.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make desktop CTA text stack identical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('Inicio.dc.html'), Path('Sobre Mi.dc.html'), Path('Tienda.dc.html'), Path('Aprende.dc.html')]
          changed=[]
          for p in files:
              s=p.read_text(); old=s

              # Desktop geometry and typography values: preserve mobile side of each ternary.
              vals={
                'ctaRegionHeight':'508px','ctaTopPad':'72px','ctaBottomPad':'80px','ctaBoxHeight':'356px',
                'h2Size':'32px','closingTitleGap':'8px','closingTextSize':'16px','ctaTextSize':'16px',
                'closingTextActionGap':'32px','ctaBtnMarginTop':'0px','closingBtnGap':'18px','ctaBtnGap':'18px',
                'closingBtnPad':'15px 30px','ctaWaPad':'15px 30px','closingBtnSize':'14px','ctaWaSize':'14px'
              }
              for key,val in vals.items():
                  pat=rf"{key}:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'"
                  if re.search(pat,s):
                      s=re.sub(pat, rf"{key}: m ? '\1' : '{val}'", s, count=1)

              # Colored CTA boxes: keep their colors/radius, but remove desktop inner vertical padding
              # so the text stack centers exactly like Inicio/Sobre Mi.
              if p.name in ('Tienda.dc.html','Aprende.dc.html'):
                  s=re.sub(r"ctaPad:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'", r"ctaPad: m ? '\1' : '0 48px'", s, count=1)

                  # Make heading spacing/line behavior identical to the white CTA pages.
                  s=re.sub(
                    r'<h2 style="font-size:\s*\{\{ h2Size \}\};([^>]*)margin:\s*0;?">',
                    lambda m: '<h2 style="font-size:{{ h2Size }};'+m.group(1).replace('margin:0;','').replace('margin: 0;','')+'margin:0 0 8px;white-space:nowrap;">',
                    s, count=1
                  )
                  # Tienda has slightly different spacing in the font-size token.
                  s=re.sub(
                    r'<h2 style="font-size:\s*\{\{ h2Size \}\};\s*color:',
                    '<h2 style="font-size:{{ h2Size }};color:', s, count=1
                  )

                  # Description: same line-height and bottom gap as reference; no separate top gap.
                  s=re.sub(
                    r'<p style="font-size:\{\{ ctaTextSize \}\};color:([^;]+);font-weight:300;margin:\{\{ ctaTextGap \}\} 0 0(?:;text-align:center)?;">',
                    r'<p style="font-size:{{ ctaTextSize }};color:\1;font-weight:300;margin:0 0 32px;line-height:1.7;text-align:center;">',
                    s, count=1
                  )
                  # Actions should not carry a second vertical gap.
                  s=s.replace('align-items:center;margin-top:{{ ctaBtnMarginTop }};', 'align-items:center;', 1)

              # White CTA pages: exact same description-to-actions distance and action sizing.
              if p.name in ('Inicio.dc.html','Sobre Mi.dc.html'):
                  s=s.replace("closingTextActionGap: m ? '32px' : '38px'", "closingTextActionGap: m ? '32px' : '32px'", 1)

              # Normalize the Correo control height across white pages.
              if p.name == 'Inicio.dc.html':
                  s=s.replace("padding:6px 0;background-image:", "padding:6px 0;min-height:44px;display:inline-flex;align-items:center;background-image:", 1)

              if s!=old:
                  p.write_text(s)
                  changed.append(p.name)

          if not changed:
              raise SystemExit('No files changed')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html 'Sobre Mi.dc.html' Tienda.dc.html Aprende.dc.html
          git diff --cached --check
          git commit -m "Make desktop closing CTA structure consistent"
          git push origin main
