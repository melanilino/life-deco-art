name: Fix mobile product card alignment
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-product-grid.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile product cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tienda.dc.html')
          s = p.read_text()

          old = '''          <div style="display:flex;justify-content:space-between;align-items:center;">\n            <div style="font-size:15px;font-weight:400;color:#000000;">{{ p.name }}</div>'''
          new = '''          <div class="lda-product-title-row" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">\n            <div class="lda-product-title" style="font-size:15px;font-weight:400;color:#000000;">{{ p.name }}</div>'''
          if old not in s:
              raise SystemExit('title block not found')
          s = s.replace(old, new, 1)

          old = '''          <div style="font-size:13px;color:#8B795E;font-weight:300;margin-top:5px;max-width:85%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ p.desc }}</div>'''
          new = '''          <div class="lda-product-desc" style="font-size:13px;color:#8B795E;font-weight:300;margin-top:5px;max-width:85%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ p.desc }}</div>'''
          if old not in s:
              raise SystemExit('description block not found')
          s = s.replace(old, new, 1)

          old = '''          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">'''
          new = '''          <div class="lda-product-meta" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">'''
          if old not in s:
              raise SystemExit('meta block not found')
          s = s.replace(old, new, 1)

          anchor = '''<style id="lda-faq-accent-color">\n  .lda-faq-eyebrow{color:#F65091!important;}\n</style>'''
          css = '''<style id="lda-faq-accent-color">\n  .lda-faq-eyebrow{color:#F65091!important;}\n</style>\n<style id="lda-mobile-product-grid-alignment">\n  @media(max-width:859px){\n    .lda-product-title-row{min-height:59px;}\n    .lda-product-title{line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}\n    .lda-product-desc{line-height:1.5;min-height:39px;max-height:39px;}\n    .lda-product-meta{min-height:24px;}\n  }\n</style>'''
          if anchor not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(anchor, css, 1)

          p.write_text(s)
          PY
          rm .github/workflows/fix-mobile-product-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tienda.dc.html .github/workflows/fix-mobile-product-grid.yml
          git commit -m 'Align Tienda mobile product card content'
          git push
