name: Normalize final CTA desktop v2
on:
  push:
    paths:
      - '.github/workflows/normalize-final-cta-desktop-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize final CTA text and spacing on desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in Path('.').glob('*.dc.html'):
              s=p.read_text()
              if '¿No diste con lo' not in s:
                  continue
              old=s

              # Same desktop geometry everywhere; mobile values are preserved.
              desktop_values={
                  'ctaRegionHeight':'508px',
                  'ctaTopPad':'72px',
                  'ctaBottomPad':'80px',
                  'ctaBoxHeight':'356px',
                  'h2Size':'32px',
                  'closingTitleGap':'8px',
                  'closingTextSize':'16px',
                  'ctaTextSize':'16px',
                  'ctaTextGap':'8px',
                  'closingTextActionGap':'38px',
                  'ctaBtnMarginTop':'38px',
                  'closingBtnGap':'18px',
                  'ctaBtnGap':'18px',
                  'closingBtnPad':'15px 30px',
                  'ctaWaPad':'15px 30px',
                  'closingBtnSize':'14px',
                  'ctaWaSize':'14px',
              }
              for key,val in desktop_values.items():
                  pat=rf"{key}:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'"
                  if re.search(pat,s):
                      s=re.sub(pat, rf"{key}: m ? '\1' : '{val}'", s, count=1)

              # Inicio used a different oversized Camelia class in this CTA only.
              s=s.replace(
                  '<span class="lda-camelia-accent" style="font-weight: 400; font-family: \'Camelia Beauty\', cursive;">querías</span>',
                  '<span class="lda-script-section lda-cta-script-word" style="font-weight:400;font-family:\'Camelia Beauty\',cursive;font-size:1.55em;position:relative;top:0;">querías</span>',
                  1
              )

              # Ensure desktop word spacing around the script word without changing mobile line break behavior.
              s=s.replace('<br class="lda-mobile-break"><span class="lda-script-section lda-cta-script-word"', '<br class="lda-mobile-break"> <span class="lda-script-section lda-cta-script-word"', 1)

              if s!=old:
                  p.write_text(s)
                  changed.append(p.name)

          if not changed:
              raise SystemExit('No CTA files changed')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Normalize final CTA desktop text and spacing"
          git push origin main
