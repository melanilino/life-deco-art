name: Mobile detail image ratios
on:
  push:
    paths:
      - '.github/workflows/mobile-detail-image-ratios.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize mobile detail hero images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing expected text for {label} in {path}')
              p.write_text(s.replace(old, new, 1))
              print('updated', label, path)

          # All Aprende individual detail pages (courses + workshops) share this template.
          # Match the approved mobile 4:3 treatment: expand downward, keep width, cover without distortion.
          replace_once(
              'Aprende Detalle.dc.html',
              "heroRatio: m ? '16/10' : '21/8',",
              "heroRatio: m ? '4/3' : '21/8',",
              'Aprende detail mobile hero ratio'
          )

          # All Tienda individual product pages share this template.
          # Remove the square/360px mobile crop and use the same 4:3 mobile frame.
          replace_once(
              'Productos.dc.html',
              "mainAspect: m ? '1 / 1' : '4 / 5',\n      mainMaxHeight: m ? '360px' : 'none',",
              "mainAspect: m ? '4 / 3' : '4 / 5',\n      mainMaxHeight: 'none',",
              'Tienda product detail mobile image ratio'
          )
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Aprende Detalle.dc.html' Productos.dc.html
          git commit -m "Normalize mobile detail image proportions"
          git push origin main
