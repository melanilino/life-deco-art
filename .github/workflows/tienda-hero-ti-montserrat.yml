name: Tienda hero ti Montserrat
on:
  push:
    paths:
      - '.github/workflows/tienda-hero-ti-montserrat.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Change ti to Montserrat in Tienda hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Tienda.dc.html')
          s = p.read_text()
          old = "<span style=\"font-family: 'Homemade Apple', cursive; font-weight: 200; font-size: 1.22em\">ti</span>"
          new = "<span style=\"font-family:'Montserrat',sans-serif;font-weight:300;font-size:1em;\">ti</span>"
          assert old in s, 'Target ti span not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Tienda.dc.html'
          git commit -m 'Use Montserrat for ti in Tienda hero'
          git push
