name: Fix component import root
on:
  push:
    paths:
      - '.github/workflows/fix-component-import-root.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix absolute component fetch paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('support.js')
          s = p.read_text(encoding='utf-8')
          old = 'var COMPONENT_DIR = "/";'
          new = 'var COMPONENT_DIR = "";'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add support.js
          git commit -m "Fix shared component loading on all routes"
          git push
