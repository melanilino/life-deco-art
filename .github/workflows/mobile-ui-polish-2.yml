name: Mobile UI polish 2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('design-system.css')
          s = p.read_text()
          marker = "  /* Mobile storefront / learning rhythm refinement. */\n  .lda-mobile-category-list {"
          insert = """  /* Mobile interactions: no dark/pink tap halo or extra focus ring. */
  button,
  a,
  input,
  select,
  textarea,
  summary,
  [role=\"button\"] {
    -webkit-tap-highlight-color: transparent !important;
  }
  button:active,
  button:focus,
  a:active,
  a:focus,
  summary:active,
  summary:focus,
  [role=\"button\"]:active,
  [role=\"button\"]:focus {
    box-shadow: none !important;
    outline: none !important;
  }
  input:focus,
  select:focus,
  textarea:focus {
    box-shadow: none !important;
    outline: none !important;
    border-color: #E4DCCB !important;
  }

  /* Mobile storefront / learning rhythm refinement. */
  .lda-mobile-category-list {"""
          if marker not in s:
              raise SystemExit('design marker missing')
          p.write_text(s.replace(marker, insert, 1))

          p = Path('Tienda.dc.html')
          s = p.read_text()
          old = 'class="lda-load-more-wrap" style="display:flex;justify-content:center;padding:44px 0 24px;"'
          new = 'class="lda-load-more-wrap lda-tienda-load-more" style="display:flex;justify-content:center;padding:44px 0 24px;transform:translateY(10px);"'
          if old not in s:
              raise SystemExit('tienda marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "spotlightTopPad: m ? '23px' : '96px',\n      spotlightMarginTop: m ? '56px' : gap + 'px',\n      spotlightNegMargin: m ? '-107px' : '-100px',"
          new = "spotlightTopPad: m ? '31px' : '96px',\n      spotlightBottomPad: m ? '138px' : '130px',\n      spotlightMarginTop: m ? '56px' : gap + 'px',\n      spotlightNegMargin: m ? '-123px' : '-100px',"
          if old not in s:
              raise SystemExit('inicio vars marker missing')
          s = s.replace(old, new, 1)
          old2 = 'style="padding: {{ spotlightTopPad }} {{ sidePad }} 130px; text-align: center;'
          new2 = 'style="padding: {{ spotlightTopPad }} {{ sidePad }} {{ spotlightBottomPad }}; text-align: center;'
          if old2 not in s:
              raise SystemExit('inicio padding marker missing')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Commit
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css Tienda.dc.html Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish mobile tap states and spacing"
          git push origin main
