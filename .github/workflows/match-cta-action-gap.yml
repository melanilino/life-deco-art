name: Match CTA action gaps
on:
  push:
    paths:
      - '.github/workflows/match-cta-action-gap.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match mobile CTA button and email spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes = [
            ('Tienda.dc.html', "ctaBtnGap: m ? '14px' : '18px',", "ctaBtnGap: m ? '6px' : '18px',"),
            ('Aprende.dc.html', "closingBtnGap: m ? '14px' : '18px',", "closingBtnGap: m ? '6px' : '18px',"),
          ]
          for fn, old, new in changes:
              p = Path(fn)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing expected spacing token in {fn}')
              p.write_text(s.replace(old, new, 1))
              print('updated', fn)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Tienda.dc.html Aprende.dc.html
          git commit -m "Match mobile CTA action spacing"
          git push origin main
