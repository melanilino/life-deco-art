name: Fix product mobile overlap
on:
  push:
    paths:
      - '.github/workflows/fix-product-mobile-overlap.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Productos.dc.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('Productos.dc.html')
          s = p.read_text(encoding='utf-8')

          # Remove the redundant fixed mobile purchase bar and its spacer.
          start = s.find('  <sc-if value="{{ isMobile }}"')
          marker = '  <div style="max-width:1240px;margin:0 auto;padding:{{ relatedPad }};">'
          end = s.find(marker, start)
          if start != -1 and end != -1:
              block = s[start:end]
              if 'position:fixed;bottom:0' in block and 'Pedir por WhatsApp' in block:
                  s = s[:start] + s[end:]

          # Make related products reliably fit the mobile viewport.
          s = s.replace(
              'display:grid;grid-template-columns:{{ relatedCols }};gap:{{ relatedGap }};',
              'display:grid;grid-template-columns:{{ relatedCols }};gap:{{ relatedGap }};min-width:0;'
          )
          s = s.replace(
              '<sc-for list="{{ related }}" as="p" hint-placeholder-count="4">\n        <div>',
              '<sc-for list="{{ related }}" as="p" hint-placeholder-count="4">\n        <div style="min-width:0;">'
          )
          s = s.replace(
              "relatedPad: m ? '28px 20px 46px' : '40px 48px 90px'",
              "relatedPad: m ? '12px 20px 46px' : '40px 48px 90px'"
          )
          s = s.replace(
              "relatedCols: m ? 'repeat(2,1fr)' : 'repeat(4,1fr)'",
              "relatedCols: m ? 'repeat(2,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))'"
          )
          s = s.replace(
              '<script src="/support.js?v=20260812-product-mobile2"></script>',
              '<script src="/support.js?v=20260812-product-mobile3"></script>'
          )
          s = s.replace(
              '<script src="/image-slot.js?v=20260812-product-mobile2"></script>',
              '<script src="/image-slot.js?v=20260812-product-mobile3"></script>'
          )
          if 'product-mobile3' not in s:
              s = s.replace('/support.js?v=20260812-product-mobile1','/support.js?v=20260812-product-mobile3')
              s = s.replace('/image-slot.js?v=20260812-product-mobile1','/image-slot.js?v=20260812-product-mobile3')

          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Productos.dc.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix mobile product overlap and related layout'
          git push
