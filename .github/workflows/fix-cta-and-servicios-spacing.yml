name: Fix CTA and Servicios spacing

on:
  push:
    paths:
      - '.github/workflows/fix-cta-and-servicios-spacing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply spacing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Sobre Mi closing CTA: reduce the accumulated top whitespace.
          p = Path('Sobre Mi.dc.html')
          t = p.read_text(encoding='utf-8')
          old = "closingOuterPad: m ? '32px 24px 48px' : '72px 48px 72px',\n      closingPad: m ? '40px 24px' : '100px 48px',"
          new = "closingOuterPad: m ? '24px 24px 48px' : '32px 48px 72px',\n      closingPad: m ? '24px 24px' : '32px 48px',"
          if old not in t:
              raise SystemExit('Sobre Mi closing spacing values not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # 2) Inicio Servicios eyebrow: optical spacing for script-heavy title.
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          desktop_old = '<div class="lda-section-eyebrow" style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:20px;text-align:center;">Servicios</div>'
          desktop_new = '<div class="lda-section-eyebrow lda-eyebrow-servicios" style="font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:20px;text-align:center;">Servicios</div>'
          mobile_old = '<div class="lda-section-eyebrow" style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#8B795E;font-weight:500;text-align:center;margin-bottom:12px;">Servicios</div>'
          mobile_new = '<div class="lda-section-eyebrow lda-eyebrow-servicios" style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#8B795E;font-weight:500;text-align:center;margin-bottom:12px;">Servicios</div>'
          if desktop_old not in t or mobile_old not in t:
              raise SystemExit('Servicios eyebrow blocks not found')
          t = t.replace(desktop_old, desktop_new, 1).replace(mobile_old, mobile_new, 1)

          css = '''\n<style id="lda-servicios-optical-gap">\n  .lda-eyebrow-servicios{margin-bottom:8px!important;}\n  @media(max-width:859px){\n    .lda-eyebrow-servicios{margin-bottom:6px!important;}\n  }\n</style>\n'''
          if 'id="lda-servicios-optical-gap"' not in t:
              t = t.replace('</helmet>', css + '</helmet>', 1)
          p.write_text(t, encoding='utf-8')

          # Guardrails
          sm = Path('Sobre Mi.dc.html').read_text(encoding='utf-8')
          if "closingOuterPad: m ? '24px 24px 48px' : '32px 48px 72px'" not in sm:
              raise SystemExit('Sobre Mi outer CTA spacing not applied')
          if "closingPad: m ? '24px 24px' : '32px 48px'" not in sm:
              raise SystemExit('Sobre Mi inner CTA spacing not applied')
          inicio = Path('Inicio.dc.html').read_text(encoding='utf-8')
          if inicio.count('lda-eyebrow-servicios') < 2 or 'lda-servicios-optical-gap' not in inicio:
              raise SystemExit('Servicios optical spacing not applied')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html' 'Sobre Mi.dc.html'
          git commit -m "Tighten Sobre Mi CTA and Servicios eyebrow spacing"
          git push
