name: Mobile consistency fixes
on:
  push:
    paths:
      - '.github/workflows/mobile-consistency-fixes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile consistency fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing expected text for {label} in {path}')
              p.write_text(s.replace(old, new, 1))
              print('updated', label, path)

          # Tienda product breadcrumbs: match Aprende detail mobile size.
          replace_once(
              'Productos.dc.html',
              "crumbSize: m ? '11px' : '13px',",
              "crumbSize: m ? '13px' : '13px',",
              'Tienda mobile breadcrumb size'
          )

          # Contacto: tighten the mobile intro-to-form gap and remove paragraph bottom margin.
          replace_once(
              'Contacto.dc.html',
              "heroGap: m ? '20px' : '56px',",
              "heroGap: m ? '8px' : '56px',",
              'Contacto mobile intro/form gap'
          )
          replace_once(
              'Contacto.dc.html',
              "<p style=\"font-size: 14px; color: var(--lda-text-secondary,#756348); font-weight: 300; line-height: 1.8; margin-top: 20px; max-width: 380px\">{{ introText }}</p>",
              "<p style=\"font-size: 14px; color: var(--lda-text-secondary,#756348); font-weight: 300; line-height: 1.8; margin:20px 0 0; max-width: 380px\">{{ introText }}</p>",
              'Contacto intro paragraph margin'
          )

          # Aprende: mark the terminal no-more-items state so global CSS does not force 96px.
          replace_once(
              'Aprende.dc.html',
              'class="lda-load-more-wrap lda-aprende-load-more" style="height:{{ loadMoreHeight }};min-height:{{ loadMoreHeight }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;"',
              'class="lda-load-more-wrap lda-aprende-load-more {{ loadMoreTerminalClass }}" style="height:{{ loadMoreHeight }};min-height:{{ loadMoreHeight }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;"',
              'Aprende terminal class markup'
          )
          replace_once(
              'Aprende.dc.html',
              "loadMoreHeight: m && !showLoadMore ? '60px' : '88px',",
              "loadMoreHeight: m && !showLoadMore ? '60px' : '88px',\n      loadMoreTerminalClass: m && !showLoadMore ? 'lda-aprende-load-more-terminal' : '',",
              'Aprende terminal class value'
          )

          # CSS override only when Aprende is truly at the end; preserve approved 96px around active Ver más.
          p = Path('design-system.css')
          s = p.read_text()
          anchor = '''  .lda-aprende-load-more {\n    height: 96px !important;\n    min-height: 96px !important;\n    margin-top: 4px !important;\n    margin-bottom: 4px !important;\n    transform: none !important;\n  }\n'''
          extra = anchor + '''  .lda-aprende-load-more.lda-aprende-load-more-terminal {\n    height: 60px !important;\n    min-height: 60px !important;\n    margin-top: 0 !important;\n    margin-bottom: 0 !important;\n    transform: none !important;\n  }\n'''
          if anchor not in s:
              raise SystemExit('Missing Aprende load-more CSS anchor')
          p.write_text(s.replace(anchor, extra, 1))
          print('updated Aprende terminal CSS')
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Productos.dc.html Contacto.dc.html Aprende.dc.html design-system.css
          git commit -m "Standardize mobile detail spacing and breadcrumbs"
          git push origin main
