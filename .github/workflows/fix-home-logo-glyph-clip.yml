name: Fix home logo glyph clip
on:
  push:
    paths:
      - '.github/workflows/fix-home-logo-glyph-clip.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Give open-menu logo safe glyph room without moving it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "body.lda-home-nav-overlay.lda-home-at-top #lda-static-nav:has(.lda-mobile[open]) .lda-brand{color:#000!important;position:relative;z-index:3}"
          new = "body.lda-home-nav-overlay.lda-home-at-top #lda-static-nav:has(.lda-mobile[open]) .lda-brand{color:#000!important;position:relative;z-index:3;display:block;overflow:visible!important;padding-left:8px;margin-left:-8px}"
          if old not in s:
              raise SystemExit('Expected open-menu brand rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html
          git commit -m "Prevent home mobile logo glyph clipping"
          git push origin main
