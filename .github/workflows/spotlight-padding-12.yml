name: Spotlight padding 12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spotlight-padding-12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Adjust spotlight spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "spotlightTopPad: m ? '31px' : '96px',\n      spotlightBottomPad: m ? '138px' : '130px',"
          new = "spotlightTopPad: m ? '35px' : '96px',\n      spotlightBottomPad: m ? '142px' : '130px',"
          if old not in s:
              raise SystemExit('Current spotlight padding values not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase mobile spotlight breathing room"
          git push origin main
