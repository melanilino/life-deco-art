name: Finalize product detail
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-product-detail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make product detail dynamic
        run: python3 .github/scripts/finalize_product_detail.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Productos.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect product detail page to catalog data"
          git push origin main
