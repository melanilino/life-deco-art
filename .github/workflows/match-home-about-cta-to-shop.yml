name: Match Inicio and Sobre Mi CTA rhythm to Tienda

on:
  push:
    paths:
      - '.github/workflows/match-home-about-cta-to-shop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Match CTA vertical rhythm
        run: |
          python - <<'PY'
          from pathlib import Path

          # Reference from Tienda:
          # desktop: 72px lead-in + 96px CTA top/bottom + 80px bottom
          # mobile: 48px lead-in + 64px CTA top/bottom + 80px bottom

          # INICIO
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          old_wrap = 'style="max-width: 1240px; margin: 0 auto; padding: 56px {{ sidePad }} 56px;opacity:0;'
          new_wrap = 'style="max-width: 1240px; margin: 0 auto; padding: {{ closingOuterPad }};opacity:0;'
          if old_wrap not in t:
              raise SystemExit('Inicio closing wrapper not found')
          t = t.replace(old_wrap, new_wrap, 1)
          old_var = "closingPad: m ? '48px 24px' : '100px 48px',"
          new_var = "closingOuterPad: m ? '48px 24px 80px' : '72px 48px 80px',\n      closingPad: m ? '64px 24px' : '96px 48px',"
          if old_var not in t:
              raise SystemExit('Inicio closingPad variable not found')
          t = t.replace(old_var, new_var, 1)
          p.write_text(t, encoding='utf-8')

          # SOBRE MI
          p = Path('Sobre Mi.dc.html')
          t = p.read_text(encoding='utf-8')
          old = "closingOuterPad: m ? '24px 24px 48px' : '56px 48px 56px',\n      closingPad: m ? '24px 24px' : '100px 48px',"
          new = "closingOuterPad: m ? '48px 24px 80px' : '72px 48px 80px',\n      closingPad: m ? '64px 24px' : '96px 48px',"
          if old not in t:
              raise SystemExit('Sobre Mi current CTA values not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Guardrails
          inicio = Path('Inicio.dc.html').read_text(encoding='utf-8')
          sobre = Path('Sobre Mi.dc.html').read_text(encoding='utf-8')
          expected_outer = "closingOuterPad: m ? '48px 24px 80px' : '72px 48px 80px'"
          expected_inner = "closingPad: m ? '64px 24px' : '96px 48px'"
          assert expected_outer in inicio and expected_inner in inicio
          assert expected_outer in sobre and expected_inner in sobre
          assert 'padding: {{ closingOuterPad }}' in inicio
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html' 'Sobre Mi.dc.html'
          git commit -m "Match Inicio and Sobre Mi CTA rhythm to Tienda"
          git push
