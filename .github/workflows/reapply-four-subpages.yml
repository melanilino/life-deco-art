name: Reapply four subpages
on:
  push:
    paths:
      - '.github/workflows/reapply-four-subpages.yml'
permissions:
  contents: write
jobs:
  reapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh four subpages and absolute CMS imports
        shell: python
        run: |
          from pathlib import Path
          files = [
              Path('Productos.dc.html'),
              Path('Recursos.dc.html'),
              Path('Encargos.dc.html'),
              Path('Aprende Detalle.dc.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('/support.js?v=20260812-subpages2', '/support.js?v=20260812-subpages3')
              s = s.replace("import('./cms.js')", "import('/cms.js')")
              marker = '<!-- lda-subpages-reapplied-20260812 -->'
              if marker not in s:
                  s = s.replace('</body>', marker + '\n</body>')
              p.write_text(s, encoding='utf-8')
      - name: Commit refreshed subpages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Productos.dc.html" "Recursos.dc.html" "Encargos.dc.html" "Aprende Detalle.dc.html"
          git diff --cached --quiet && exit 0
          git commit -m "Reapply product resource custom order and learning detail pages"
          git push origin main
