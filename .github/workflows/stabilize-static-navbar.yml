name: Stabilize static navbar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stabilize:
    if: ${{ !contains(github.event.head_commit.message, '[nav-stable]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize document geometry and navigation
        shell: python
        run: |
          from pathlib import Path
          pages=['Inicio.dc.html','Sobre Mi.dc.html','Tienda.dc.html','Aprende.dc.html','Contacto.dc.html']
          css='''\nhtml{margin:0;overflow-y:scroll;scrollbar-gutter:stable;background:#fff}\nbody{margin:0;background:#fff}\n@view-transition{navigation:auto}\n#lda-static-nav{view-transition-name:lda-static-nav}\n::view-transition-group(lda-static-nav){animation-duration:0s}\n::view-transition-old(lda-static-nav),::view-transition-new(lda-static-nav){animation:none}\n'''
          for f in pages:
            p=Path(f); s=p.read_text(encoding='utf-8'); original=s
            marker='<style id="lda-static-nav-css">'
            if marker not in s: raise SystemExit(f'{f}: static nav css missing')
            if 'scrollbar-gutter:stable' not in s:
              s=s.replace(marker, marker+css, 1)
            if s!=original: p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Inicio.dc.html" "Sobre Mi.dc.html" "Tienda.dc.html" "Aprende.dc.html" "Contacto.dc.html"
          git commit -m "Stabilize navbar geometry across page navigation [nav-stable]"
          git push
