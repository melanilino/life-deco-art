name: Spotlight bottom gap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spotlight-bottom-gap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase visible bottom gap only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "spotlightNegMargin: m ? '-131px' : '-100px',"
          new = "spotlightNegMargin: m ? '-119px' : '-100px',"
          if old not in s:
              raise SystemExit('spotlightNegMargin pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase mobile spotlight bottom spacing"
          git push origin main
