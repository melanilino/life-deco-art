name: Sync product detail first paint
on:
  push:
    paths:
      - '.github/workflows/sync-product-detail-first-paint.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep nav hidden until product detail is ready
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Productos.dc.html')
          s = p.read_text()

          old = '<dc-import name="NavBar" active-page="tienda" hint-size="100%,80px"></dc-import>\n<div style="height:{{ navGap }};"></div>\n\n<section style="font-family:\'Montserrat\',sans-serif;background:#FFFFFF;">'
          new = '<div style="display:{{ detailDisplay }};">\n<dc-import name="NavBar" active-page="tienda" hint-size="100%,80px"></dc-import>\n<div style="height:{{ navGap }};"></div>\n\n<section style="font-family:\'Montserrat\',sans-serif;background:#FFFFFF;">'
          if old not in s:
              raise SystemExit('Opening detail block not found')
          s = s.replace(old, new, 1)

          old2 = '</section>\n\n<dc-import name="Footer" hint-size="100%,320px"></dc-import>\n\n</x-dc>'
          new2 = '</section>\n\n<dc-import name="Footer" hint-size="100%,320px"></dc-import>\n</div>\n\n</x-dc>'
          if old2 not in s:
              raise SystemExit('Closing detail block not found')
          s = s.replace(old2, new2, 1)

          marker = '      navGap: m ? \'64px\' : \'88px\','
          replacement = "      detailDisplay: this.state.productReady ? 'block' : 'none',\n" + marker
          if marker not in s:
              raise SystemExit('renderVals marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
      - name: Commit product detail only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Productos.dc.html
          git diff --cached --check
          git commit -m "Sync product detail nav with first paint"
          git push origin main
