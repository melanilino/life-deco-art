name: Fix FAQ eyebrow colors

on:
  push:
    paths:
      - '.github/workflows/fix-faq-eyebrow-colors.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply page accent colors to FAQ eyebrow
        run: |
          python3 <<'PY'
          from pathlib import Path

          configs = {
              'Tienda.dc.html': '#F65091',
              'Aprende.dc.html': '#0CC0DF',
          }

          for filename, color in configs.items():
              p = Path(filename)
              t = p.read_text(encoding='utf-8')
              old = 'class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:' + color + ';font-weight:500;margin-bottom:{{ eyebrowGap }};">Preguntas frecuentes</div>'
              new = 'class="lda-section-eyebrow lda-faq-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:' + color + ';font-weight:500;margin-bottom:{{ eyebrowGap }};">Preguntas frecuentes</div>'
              if old not in t:
                  raise SystemExit(f'FAQ eyebrow pattern not found in {filename}')
              t = t.replace(old, new, 1)

              anchor = '</style>\n</helmet>'
              css = f'''</style>\n<style id="lda-faq-accent-color">\n  .lda-faq-eyebrow{{color:{color}!important;}}\n</style>\n</helmet>'''
              if anchor not in t:
                  raise SystemExit(f'Helmet anchor not found in {filename}')
              t = t.replace(anchor, css, 1)
              p.write_text(t, encoding='utf-8')

              if f'.lda-faq-eyebrow{{color:{color}!important;}}' not in t:
                  raise SystemExit(f'Color guardrail failed in {filename}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Tienda.dc.html' 'Aprende.dc.html'
          git commit -m "Use page accent colors for FAQ eyebrows"
          git push
