name: Normalize mobile CTA system

on:
  push:
    paths:
      - '.github/workflows/normalize-mobile-cta-system.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize mobile CTA geometry and internal rhythm
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing pattern: {label}')
              return text.replace(old, new, 1)

          # ---------------- Inicio ----------------
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          t = must_replace(
              t,
              '<h2 style="font-size: {{ h2Size }}; color: #000000; font-weight: 300; margin: 0 0 18px; white-space: {{ closingH2Wrap }};">',
              '<h2 style="font-size: {{ h2Size }}; color: #000000; font-weight: 300; margin: 0 0 {{ closingTitleGap }}; white-space: {{ closingH2Wrap }};">',
              'Inicio title gap'
          )
          t = must_replace(
              t,
              '<p style="font-size:16px;color:#8B795E;font-weight:300;margin:0 0 32px;line-height:1.7;">{{ closingText }}</p>',
              '<p style="font-size:{{ closingTextSize }};color:#8B795E;font-weight:300;margin:0 0 {{ closingTextActionGap }};line-height:1.7;">{{ closingText }}</p>',
              'Inicio CTA text'
          )
          t = must_replace(
              t,
              'padding:15px 30px;border-radius:4px;font-size:14px;',
              'padding:{{ closingBtnPad }};border-radius:4px;font-size:{{ closingBtnSize }};',
              'Inicio primary button'
          )
          t = must_replace(
              t,
              'color:#000000;font-size:14px;font-weight:500;',
              'color:#000000;font-size:{{ closingBtnSize }};font-weight:500;',
              'Inicio secondary link'
          )
          t = must_replace(
              t,
              "      closingBtnGap: m ? '14px' : '24px',\n      closingBtnDir: m ? 'column' : 'row',\n",
              "      closingBtnGap: m ? '14px' : '24px',\n      closingBtnDir: m ? 'column' : 'row',\n      closingTitleGap: m ? '14px' : '18px',\n      closingTextSize: m ? '13.5px' : '16px',\n      closingTextActionGap: m ? '24px' : '32px',\n      closingBtnPad: m ? '13px 26px' : '15px 30px',\n      closingBtnSize: m ? '13.5px' : '14px',\n",
              'Inicio mobile CTA vars'
          )
          p.write_text(t, encoding='utf-8')

          # ---------------- Sobre Mi ----------------
          p = Path('Sobre Mi.dc.html')
          t = p.read_text(encoding='utf-8')
          t = must_replace(
              t,
              '<h2 style="font-size: {{ h2Size }}; color: #000000; font-weight: 300; margin: 0 0 18px; white-space: {{ closingH2Wrap }};">',
              '<h2 style="font-size: {{ h2Size }}; color: #000000; font-weight: 300; margin: 0 0 {{ closingTitleGap }}; white-space: {{ closingH2Wrap }};">',
              'Sobre Mi title gap'
          )
          t = must_replace(
              t,
              '<p style="font-size:16px;color:#8B795E;font-weight:300;margin:0 0 32px;line-height:1.7;">Ya sea para una marca, un rincón especial o una gran celebración; encontremos la forma de contar tu historia con belleza.</p>',
              '<p style="font-size:{{ closingTextSize }};color:#8B795E;font-weight:300;margin:0 0 {{ closingTextActionGap }};line-height:1.7;">Ya sea para una marca, un rincón especial o una gran celebración; encontremos la forma de contar tu historia con belleza.</p>',
              'Sobre Mi CTA text'
          )
          t = must_replace(
              t,
              'padding:15px 30px;border-radius:4px;font-size:14px;',
              'padding:{{ closingBtnPad }};border-radius:4px;font-size:{{ closingBtnSize }};',
              'Sobre Mi primary button'
          )
          t = must_replace(
              t,
              'color:#000000;font-size:14px;font-weight:500;',
              'color:#000000;font-size:{{ closingBtnSize }};font-weight:500;',
              'Sobre Mi secondary link'
          )
          t = must_replace(
              t,
              "      closingBtnGap: m ? '14px' : '24px',\n",
              "      closingBtnGap: m ? '14px' : '24px',\n      closingTitleGap: m ? '14px' : '18px',\n      closingTextSize: m ? '13.5px' : '16px',\n      closingTextActionGap: m ? '24px' : '32px',\n      closingBtnPad: m ? '13px 26px' : '15px 30px',\n      closingBtnSize: m ? '13.5px' : '14px',\n",
              'Sobre Mi mobile CTA vars'
          )
          p.write_text(t, encoding='utf-8')

          # ---------------- Aprende ----------------
          p = Path('Aprende.dc.html')
          t = p.read_text(encoding='utf-8')
          old_wrapper = '<div style="max-width:1240px;margin:0 auto;padding:0 {{ sidePad }} 80px;">\n    <div style="background:#0CC0DF;border-radius:24px;padding:{{ ctaPad }};text-align:center;">'
          new_wrapper = '<div style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;">\n    <div style="background:#0CC0DF;border-radius:{{ ctaRadius }};padding:{{ ctaPad }};text-align:center;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">'
          t = must_replace(t, old_wrapper, new_wrapper, 'Aprende CTA wrapper')
          t = must_replace(
              t,
              '<p style="font-size:16px;color:#E3F9FC;font-weight:300;margin-top:18px;text-align:center;white-space:pre-line;">{{ ctaSubtitle }}</p>',
              '<p style="font-size:{{ ctaTextSize }};color:#E3F9FC;font-weight:300;margin:{{ ctaTextGap }} 0 0;text-align:center;white-space:pre-line;">{{ ctaSubtitle }}</p>',
              'Aprende CTA subtitle'
          )
          t = must_replace(
              t,
              'align-items:center;margin-top:28px;">',
              'align-items:center;margin-top:{{ ctaBtnMarginTop }};">',
              'Aprende CTA action gap'
          )
          t = must_replace(
              t,
              'padding:15px 30px;border-radius:4px;font-size:14px;',
              'padding:{{ ctaWaPad }};border-radius:4px;font-size:{{ ctaWaSize }};',
              'Aprende primary button'
          )
          t = must_replace(
              t,
              'color:#FFFFFF;font-size:14px;font-weight:500;',
              'color:#FFFFFF;font-size:{{ ctaWaSize }};font-weight:500;',
              'Aprende secondary link'
          )
          t = must_replace(
              t,
              "      ctaPad: m ? '64px 24px' : '96px 48px',\n",
              "      ctaPad: m ? '36px 24px' : '96px 48px',\n      ctaRegionHeight: m ? '440px' : 'auto',\n      ctaTopPad: m ? '48px' : '0',\n      ctaBoxHeight: m ? '312px' : 'auto',\n      ctaRadius: m ? '16px' : '24px',\n      ctaTextSize: m ? '13.5px' : '16px',\n      ctaTextGap: m ? '14px' : '18px',\n      ctaBtnMarginTop: m ? '24px' : '28px',\n      ctaWaPad: m ? '13px 26px' : '15px 30px',\n      ctaWaSize: m ? '13.5px' : '14px',\n",
              'Aprende CTA vars'
          )
          p.write_text(t, encoding='utf-8')

          # Guardrails: desktop values preserved while mobile converges on Tienda.
          for name in ['Inicio.dc.html','Sobre Mi.dc.html']:
              s = Path(name).read_text(encoding='utf-8')
              assert "ctaRegionHeight: m ? '440px' : '508px'" in s
              assert "ctaTopPad: m ? '48px' : '72px'" in s
              assert "ctaBoxHeight: m ? '312px' : '356px'" in s
              assert "closingTextSize: m ? '13.5px' : '16px'" in s
              assert "closingBtnPad: m ? '13px 26px' : '15px 30px'" in s
              assert "closingBtnSize: m ? '13.5px' : '14px'" in s

          a = Path('Aprende.dc.html').read_text(encoding='utf-8')
          assert "ctaRegionHeight: m ? '440px' : 'auto'" in a
          assert "ctaTopPad: m ? '48px' : '0'" in a
          assert "ctaBoxHeight: m ? '312px' : 'auto'" in a
          assert "ctaRadius: m ? '16px' : '24px'" in a
          assert "ctaTextSize: m ? '13.5px' : '16px'" in a
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html' 'Sobre Mi.dc.html' 'Aprende.dc.html'
          git commit -m "Normalize mobile CTA system across main pages"
          git push
