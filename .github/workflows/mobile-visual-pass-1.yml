name: Mobile visual pass 1
on:
  push:
    paths:
      - '.github/workflows/mobile-visual-pass-1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile visual refinements
        shell: python
        run: |
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              '<div class="dc-fb-title">La evolución de una <span class="dc-fb-script">idea</span>.</div>',
              '<div class="dc-fb-title">La evolución de<br class="lda-mobile-break"><span class="lda-hero-idea-line">una <span class="dc-fb-script">idea</span>.</span></div>'
            ),
            (
              "heroTitlePre: c.heroTitlePre ?? 'La evolución de una',",
              "heroTitlePre: m ? 'La evolución de' : (c.heroTitlePre ?? 'La evolución de una'),\n      heroTitleMobileUna: m ? 'una ' : '',"
            ),
            (
              '<h1 style="position:relative;z-index:2;font-size:26px;line-height:1.25;color:#FFFFFF;font-weight:300;margin:0 0 10px;">{{ heroTitlePre }} <span class="lda-camelia-hero" style="font-family:\'Camelia Beauty\',cursive;">{{ heroTitleCursive }}</span>.</h1>',
              '<h1 style="position:relative;z-index:2;font-size:26px;line-height:1.25;color:#FFFFFF;font-weight:300;margin:0 0 10px;">{{ heroTitlePre }}<br><span class="lda-hero-idea-line">{{ heroTitleMobileUna }}<span class="lda-camelia-hero" style="font-family:\'Camelia Beauty\',cursive;">{{ heroTitleCursive }}</span>.</span></h1>'
            ),
            (
              '¿No diste con lo que <span class="lda-camelia-accent" style="font-weight: 400; font-family: \'Camelia Beauty\', cursive;">querías</span>?',
              '¿No diste con lo que<br class="lda-mobile-break"><span class="lda-camelia-accent" style="font-weight: 400; font-family: \'Camelia Beauty\', cursive;">querías</span>?'
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected snippet: {old[:90]}')
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html
          git commit -m "Refine mobile hero and closing line breaks"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/mobile-visual-pass-1.yml
          git commit -m "Remove one-time mobile visual workflow"
          git push
