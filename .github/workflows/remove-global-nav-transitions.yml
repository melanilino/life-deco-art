name: Remove global navigation transitions
on:
  push:
    paths:
      - '.github/workflows/remove-global-nav-transitions.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove cross-page transition and fade behaviors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for p in list(Path('.').glob('*.dc.html')) + list(Path('.').glob('*.html')):
              s = p.read_text()
              original = s

              # Remove browser cross-document view transitions that can create an
              # intermediate/preload-looking frame between pages.
              s = s.replace('@view-transition{navigation:auto}\n', '')
              s = s.replace('@view-transition { navigation: auto; }\n', '')
              s = re.sub(r'\n?#lda-static-nav\{view-transition-name:lda-static-nav\}\n?', '\n', s)
              s = re.sub(r'\n?::view-transition-group\(lda-static-nav\)\{animation-duration:0s\}\n?', '\n', s)
              s = re.sub(r'\n?::view-transition-old\(lda-static-nav\),::view-transition-new\(lda-static-nav\)\{animation:none\}\n?', '\n', s)

              # Remove page-entry fades so navigation lands directly on the new
              # document instead of visually fading through an intermediate state.
              s = s.replace('animation: lda-page-fade .3s ease;', '')
              s = s.replace('animation:lda-page-fade .3s ease;', '')
              s = re.sub(r'\n\s*@keyframes lda-page-fade\s*\{\s*from\s*\{\s*opacity:\s*0;?\s*\}\s*to\s*\{\s*opacity:\s*1;?\s*\}\s*\}\s*', '\n', s)

              if s != original:
                  p.write_text(s)
                  changed.append(str(p))

          if not changed:
              raise SystemExit('No global transition/fade patterns found to remove')
          print('updated:', ', '.join(changed))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add '*.dc.html' '*.html'
          git commit -m "Remove cross-page preload transitions sitewide"
          git push origin main
