name: Update Inicio learning prompt copy

on:
  push:
    paths:
      - '.github/workflows/update-inicio-aprendes-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update desktop and mobile copy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          old_d = '¿Y si también quieres&nbsp;<span style="font-family: \'Homemade Apple\', cursive; font-size: 1.2em;">aprender</span>&nbsp;a hacerlo?'
          new_d = '¿Y si también&nbsp;<span style="font-family: \'Homemade Apple\', cursive; font-size: 1.2em;">aprendes</span>&nbsp;a hacerlo?'
          old_m = '¿Y si también quieres&nbsp;<span style="font-family: \'Homemade Apple\', cursive; font-size: 1.2em;">aprender</span><br>a hacerlo?'
          new_m = '¿Y si también&nbsp;<span style="font-family: \'Homemade Apple\', cursive; font-size: 1.2em;">aprendes</span><br>a hacerlo?'
          if old_d not in t or old_m not in t:
              raise SystemExit('Expected Inicio learning prompt copy not found')
          t = t.replace(old_d, new_d, 1).replace(old_m, new_m, 1)
          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html'
          git commit -m "Update Inicio learning prompt copy"
          git push
