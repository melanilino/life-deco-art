name: Fix Aprende mobile FAQ overlap

on:
  push:
    paths:
      - '.github/workflows/revert-aprende-faq-overlap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove broken negative FAQ offset
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Aprende.dc.html')
          t = p.read_text(encoding='utf-8')

          css = '''<style id="lda-aprende-faq-mobile-align">\n  @media(max-width:859px){\n    .lda-aprende-faq{margin-top:-88px!important;}\n  }\n</style>\n'''
          if css not in t:
              raise SystemExit('Broken FAQ override not found')
          t = t.replace(css, '', 1)

          old = '<div class="lda-aprende-faq" style="max-width:820px;margin:0 auto;padding:{{ faqPad }};">'
          new = '<div style="max-width:820px;margin:0 auto;padding:{{ faqPad }};">'
          if old not in t:
              raise SystemExit('FAQ wrapper class not found')
          t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          if 'margin-top:-88px' in t:
              raise SystemExit('Negative FAQ offset still present')
          if 'class="lda-aprende-faq"' in t:
              raise SystemExit('Temporary FAQ class still present')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Aprende.dc.html'
          git commit -m "Remove broken Aprende mobile FAQ negative offset"
          git push
