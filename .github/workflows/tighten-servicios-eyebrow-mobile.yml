name: Tighten Servicios eyebrow mobile spacing

on:
  push:
    paths:
      - '.github/workflows/tighten-servicios-eyebrow-mobile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten Servicios eyebrow gap on mobile
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          old = ".lda-eyebrow-servicios{margin-bottom:12px!important;}"
          new = ".lda-eyebrow-servicios{margin-bottom:0!important;}"
          if old not in t:
              raise SystemExit('Servicios mobile eyebrow spacing pattern not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          if new not in t:
              raise SystemExit('Guardrail failed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html'
          git commit -m "Tighten Servicios eyebrow spacing on mobile"
          git push
