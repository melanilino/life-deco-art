name: Hero Box Sizing Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[hero-box-sizing]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero box sizing
        shell: python
        run: |
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text(encoding='utf-8')
          old = 'position:relative;height:calc(100vh - 80px);min-height:560px;display:flex;'
          new = 'position:relative;height:calc(100vh - 80px);min-height:560px;box-sizing:border-box;display:flex;'
          if old not in s:
              raise SystemExit('Expected desktop hero style not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/hero-box-sizing-once.yml
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Inicio.dc.html .github/workflows/hero-box-sizing-once.yml
          git commit -m "Include hero padding inside viewport height [hero-box-sizing]"
          git push
