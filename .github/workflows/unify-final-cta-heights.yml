name: Unify final CTA heights

on:
  push:
    paths:
      - '.github/workflows/unify-final-cta-heights.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Inicio and Sobre Mi final CTA exactly match Tienda region height
        run: |
          python - <<'PY'
          from pathlib import Path

          # Shared geometry, derived from the current Tienda desktop composition:
          # 72px white lead-in + 356px CTA area + 80px white tail = 508px total.
          # Mobile keeps the same structural rhythm: 48px + 312px + 80px = 440px.
          shared_vals = """
      ctaRegionHeight: m ? '440px' : '508px',
      ctaTopPad: m ? '48px' : '72px',
      ctaBoxHeight: m ? '312px' : '356px',
"""

          # --- TIENDA: lock its current visual reference into explicit geometry ---
          p = Path('Tienda.dc.html')
          t = p.read_text(encoding='utf-8')
          old_outer = '<div style="max-width:1240px;margin:0 auto;padding:0 {{ sidePad }} 80px;">'
          new_outer = '<div style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;">'
          if old_outer not in t:
              raise SystemExit('Tienda CTA outer wrapper not found')
          t = t.replace(old_outer, new_outer, 1)

          old_inner = '<div style="background:#F65091;border-radius:{{ ctaRadius }};padding:{{ ctaPad }};text-align:center;">'
          new_inner = '<div style="background:#F65091;border-radius:{{ ctaRadius }};padding:{{ ctaPad }};text-align:center;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">'
          if old_inner not in t:
              raise SystemExit('Tienda CTA inner wrapper not found')
          t = t.replace(old_inner, new_inner, 1)

          anchor = "      ctaPad: m ? '64px 24px' : '96px 48px',\n"
          if anchor not in t:
              raise SystemExit('Tienda render values anchor not found')
          t = t.replace(anchor, anchor + shared_vals, 1)
          p.write_text(t, encoding='utf-8')

          # --- INICIO: same exact total region and equivalent CTA-area height ---
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          old_outer = '<div data-reveal="" style="max-width: 1240px; margin: 0 auto; padding: {{ closingOuterPad }};opacity:0;transform:translateY(13px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);">'
          new_outer = '<div data-reveal="" style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;opacity:0;transform:translateY(13px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);">'
          if old_outer not in t:
              raise SystemExit('Inicio CTA outer wrapper not found')
          t = t.replace(old_outer, new_outer, 1)

          old_inner = '<div style="max-width:760px;margin:0 auto;padding:{{ closingPad }};text-align:center;">'
          new_inner = '<div style="max-width:760px;margin:0 auto;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;">'
          if old_inner not in t:
              raise SystemExit('Inicio CTA inner wrapper not found')
          t = t.replace(old_inner, new_inner, 1)

          anchor = "      closingPad: m ? '64px 24px' : '96px 48px',\n"
          if anchor not in t:
              raise SystemExit('Inicio render values anchor not found')
          t = t.replace(anchor, anchor + shared_vals, 1)
          p.write_text(t, encoding='utf-8')

          # --- SOBRE MI: same exact total region and equivalent CTA-area height ---
          p = Path('Sobre Mi.dc.html')
          t = p.read_text(encoding='utf-8')
          old_outer = '<div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ closingOuterPad }};opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">'
          new_outer = '<div data-reveal="" style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">'
          if old_outer not in t:
              raise SystemExit('Sobre Mi CTA outer wrapper not found')
          t = t.replace(old_outer, new_outer, 1)

          old_inner = '<div style="max-width:760px;margin:0 auto;padding:{{ closingPad }};text-align:center;">'
          new_inner = '<div style="max-width:760px;margin:0 auto;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;">'
          if old_inner not in t:
              raise SystemExit('Sobre Mi CTA inner wrapper not found')
          t = t.replace(old_inner, new_inner, 1)

          anchor = "      closingPad: m ? '64px 24px' : '96px 48px',\n"
          if anchor not in t:
              raise SystemExit('Sobre Mi render values anchor not found')
          t = t.replace(anchor, anchor + shared_vals, 1)
          p.write_text(t, encoding='utf-8')

          # Guardrails: all three pages must now share exactly the same region geometry.
          for fn in ['Tienda.dc.html','Inicio.dc.html','Sobre Mi.dc.html']:
              s = Path(fn).read_text(encoding='utf-8')
              assert "ctaRegionHeight: m ? '440px' : '508px'" in s, fn
              assert "ctaTopPad: m ? '48px' : '72px'" in s, fn
              assert "ctaBoxHeight: m ? '312px' : '356px'" in s, fn
              assert 'height:{{ ctaRegionHeight }}' in s, fn
              assert 'height:{{ ctaBoxHeight }}' in s, fn
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Tienda.dc.html' 'Inicio.dc.html' 'Sobre Mi.dc.html'
          git commit -m "Set identical final CTA region heights across Tienda Inicio and Sobre Mi"
          git push
