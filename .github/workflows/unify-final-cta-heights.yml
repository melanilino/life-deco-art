name: Unify final CTA heights
on:
  push:
    paths:
      - .github/workflows/unify-final-cta-heights.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize exact CTA region heights
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          vals = "      ctaRegionHeight: m ? '440px' : '508px',\n      ctaTopPad: m ? '48px' : '72px',\n      ctaBoxHeight: m ? '312px' : '356px',\n"

          p=Path('Tienda.dc.html'); t=p.read_text()
          a='<div style="max-width:1240px;margin:0 auto;padding:0 {{ sidePad }} 80px;">'
          b='<div style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;">'
          assert a in t; t=t.replace(a,b,1)
          a='<div style="background:#F65091;border-radius:{{ ctaRadius }};padding:{{ ctaPad }};text-align:center;">'
          b='<div style="background:#F65091;border-radius:{{ ctaRadius }};padding:{{ ctaPad }};text-align:center;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">'
          assert a in t; t=t.replace(a,b,1)
          a="      ctaPad: m ? '64px 24px' : '96px 48px',\n"; assert a in t; t=t.replace(a,a+vals,1); p.write_text(t)

          p=Path('Inicio.dc.html'); t=p.read_text()
          a='<div data-reveal="" style="max-width: 1240px; margin: 0 auto; padding: {{ closingOuterPad }};opacity:0;transform:translateY(13px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);">'
          b='<div data-reveal="" style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;opacity:0;transform:translateY(13px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);">'
          assert a in t; t=t.replace(a,b,1)
          a='<div style="max-width:760px;margin:0 auto;padding:{{ closingPad }};text-align:center;">'
          b='<div style="max-width:760px;margin:0 auto;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;">'
          assert a in t; t=t.replace(a,b,1)
          a="      closingPad: m ? '64px 24px' : '96px 48px',\n"; assert a in t; t=t.replace(a,a+vals,1); p.write_text(t)

          p=Path('Sobre Mi.dc.html'); t=p.read_text()
          a='<div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ closingOuterPad }};opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">'
          b='<div data-reveal="" style="max-width:1240px;margin:0 auto;height:{{ ctaRegionHeight }};padding:{{ ctaTopPad }} {{ sidePad }} 80px;box-sizing:border-box;display:flex;align-items:flex-start;opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">'
          assert a in t; t=t.replace(a,b,1)
          a='<div style="max-width:760px;margin:0 auto;padding:{{ closingPad }};text-align:center;">'
          b='<div style="max-width:760px;margin:0 auto;width:100%;height:{{ ctaBoxHeight }};box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;text-align:center;">'
          assert a in t; t=t.replace(a,b,1)
          a="      closingPad: m ? '64px 24px' : '96px 48px',\n"; assert a in t; t=t.replace(a,a+vals,1); p.write_text(t)

          for f in ('Tienda.dc.html','Inicio.dc.html','Sobre Mi.dc.html'):
              s=Path(f).read_text()
              assert "ctaRegionHeight: m ? '440px' : '508px'" in s
              assert 'height:{{ ctaRegionHeight }}' in s
              assert 'height:{{ ctaBoxHeight }}' in s
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Tienda.dc.html Inicio.dc.html 'Sobre Mi.dc.html'
          git commit -m 'Set exact matching final CTA heights across main pages'
          git push
