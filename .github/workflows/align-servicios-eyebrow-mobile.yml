name: Align Servicios eyebrow mobile spacing

on:
  push:
    paths:
      - '.github/workflows/align-servicios-eyebrow-mobile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Servicios eyebrow gap to Conóceme on mobile
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          t = p.read_text(encoding='utf-8')
          old = "@media(max-width:859px){\n    .lda-eyebrow-servicios{margin-bottom:6px!important;}\n  }"
          new = "@media(max-width:859px){\n    .lda-eyebrow-servicios{margin-bottom:12px!important;}\n  }"
          if old not in t:
              raise SystemExit('Servicios mobile eyebrow spacing pattern not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          if ".lda-eyebrow-servicios{margin-bottom:12px!important;}" not in t:
              raise SystemExit('Guardrail failed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html'
          git commit -m "Match Servicios eyebrow gap to Conóceme on mobile"
          git push
