name: Unify desktop final CTA
on:
  push:
    paths:
      - '.github/workflows/unify-desktop-final-cta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unify desktop CTA geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages=[]
          for p in Path('.').glob('*.dc.html'):
              s=p.read_text()
              if '¿No diste con lo' in s and 'lda-cta-script-word' in s:
                  pages.append(p)

          if not pages:
              raise SystemExit('No final CTA pages found')

          changed=[]
          for p in pages:
              s=p.read_text(); old=s

              # Match Sobre Mi desktop proportions while preserving each page's colors and mobile values.
              replacements={
                  'ctaRegionHeight':'508px',
                  'ctaTopPad':'72px',
                  'ctaBottomPad':'80px',
                  'ctaBoxHeight':'356px',
              }
              for key, desktop in replacements.items():
                  s,n=re.subn(rf"{key}:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'", rf"{key}: m ? '\1' : '{desktop}'", s, count=1)
                  if n!=1:
                      raise SystemExit(f'{key} not uniquely found in {p.name}')

              # Pages use one of two names for the description-to-actions gap.
              if 'closingTextActionGap:' in s:
                  s,n=re.subn(r"closingTextActionGap:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'", r"closingTextActionGap: m ? '\1' : '38px'", s, count=1)
                  if n!=1:
                      raise SystemExit(f'closingTextActionGap not found in {p.name}')
              elif 'ctaBtnMarginTop:' in s:
                  s,n=re.subn(r"ctaBtnMarginTop:\s*m\s*\?\s*'([^']*)'\s*:\s*'[^']*'", r"ctaBtnMarginTop: m ? '\1' : '38px'", s, count=1)
                  if n!=1:
                      raise SystemExit(f'ctaBtnMarginTop not found in {p.name}')
              else:
                  raise SystemExit(f'CTA action gap variable not found in {p.name}')

              if s!=old:
                  p.write_text(s)
                  changed.append(p.name)

          print('Updated:', ', '.join(changed))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Unify desktop final CTA layout"
          git push origin main
