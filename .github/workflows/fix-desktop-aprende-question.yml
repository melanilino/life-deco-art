name: Fix desktop Aprende question spacing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-desktop-aprende-question.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Center desktop Aprende question in visible blue band
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = "spotlightTopPad: m ? '35px' : '108px',\n      spotlightBottomPad: m ? '142px' : '142px',"
          new = "spotlightTopPad: m ? '35px' : '78px',\n      spotlightBottomPad: m ? '142px' : '172px',"
          if old not in s:
              raise SystemExit('Desktop spotlight spacing pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Center desktop Aprende spotlight question"
          git push origin main
