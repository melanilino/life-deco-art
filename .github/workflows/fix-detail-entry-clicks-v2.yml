name: Run detail entry click repair
on:
  push:
    paths:
      - '.github/workflows/fix-detail-entry-clicks-v2.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_detail_entry_clicks.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tienda.dc.html Aprende.dc.html
          git commit -m "Fix navigation into detail subpages"
          git push