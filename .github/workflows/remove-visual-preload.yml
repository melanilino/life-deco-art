name: Remove visual preload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-preload:
    if: ${{ !contains(github.event.head_commit.message, '[preload-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Restore Contacto and hide all boot fallbacks
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          # Restore Contacto exactly from the production commit before the temporary edit.
          original = subprocess.check_output([
              'git','show','613379fb2de3e696a3f40b39a91cd46de8160890:Contacto.dc.html'
          ]).decode('utf-8')
          Path('Contacto.dc.html').write_text(original, encoding='utf-8')

          files = [
              'Inicio.dc.html',
              'Sobre Mi.dc.html',
              'Tienda.dc.html',
              'Aprende.dc.html',
              'Contacto.dc.html',
          ]
          sentinel = '<div id="dc-boot-fallback" style="display:none!important" aria-hidden="true"></div>'
          pattern = re.compile(r'<div id="dc-boot-fallback"[^>]*>.*?</div>\s*(?=<x-dc>)', re.S)

          for filename in files:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, n = pattern.subn(sentinel + '\n', text, count=1)
              if n != 1:
                  raise SystemExit(f'No se encontró fallback único en {filename}: {n}')
              p.write_text(text, encoding='utf-8')

      - name: Validate preload removal
        shell: python
        run: |
          from pathlib import Path
          files = ['Inicio.dc.html','Sobre Mi.dc.html','Tienda.dc.html','Aprende.dc.html','Contacto.dc.html']
          for f in files:
              s = Path(f).read_text(encoding='utf-8')
              assert 'id="dc-boot-fallback" style="display:none!important"' in s, f
              assert s.count('id="dc-boot-fallback"') == 1, f

      - name: Commit cleanup
        run: |
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Inicio.dc.html" "Sobre Mi.dc.html" "Tienda.dc.html" "Aprende.dc.html" "Contacto.dc.html"
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove visual preload from navigation [preload-cleanup]"
          git push
