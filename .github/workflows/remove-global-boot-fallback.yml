name: Remove global boot fallback
on:
  push:
    paths:
      - '.github/workflows/remove-global-boot-fallback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable boot fallback and streaming shimmer globally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('design-system.css')
          s = p.read_text()
          marker = '/* Global boot/loading visual cleanup */'
          if marker in s:
              raise SystemExit('Global boot/loading cleanup already present')
          s += '''\n\n/* Global boot/loading visual cleanup */\nhtml body #dc-boot-fallback {\n  display:none !important;\n  opacity:0 !important;\n  visibility:hidden !important;\n  pointer-events:none !important;\n  transition:none !important;\n}\nhtml.sc-dc-streaming .sc-placeholder::before,\nhtml.sc-dc-streaming .sc-interp.sc-missing::before {\n  animation:none !important;\n  background:none !important;\n}\nhtml.sc-dc-streaming .sc-placeholder,\nhtml.sc-dc-streaming .sc-interp.sc-missing {\n  transition:none !important;\n  animation:none !important;\n}\n'''
          p.write_text(s)
          PY
      - name: Commit design system only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css
          git diff --cached --check
          git commit -m "Remove global boot preload visuals"
          git push origin main
