name: Mobile polish pass
on:
  push:
    paths:
      - '.github/workflows/mobile-polish-pass.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved mobile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Missing expected text for {label} in {path}')
              s2 = s.replace(old, new, 1)
              p.write_text(s2)
              print('updated', label, path)

          # Tienda: when there is nothing else to load, match the 60px mobile gap
          # before the banner to the 60px gap after the banner before FAQ.
          replace_once(
              'Tienda.dc.html',
              "shopEndPad: m && !showLoadMore ? '32px' : '0',",
              "shopEndPad: m && !showLoadMore ? '60px' : '0',",
              'Tienda terminal spacing'
          )

          # Tienda: remove hover-only interaction from Ver más on touch devices and
          # explicitly favor immediate tap activation.
          p = Path('Tienda.dc.html')
          s = p.read_text()
          old = '''<button type="button" class="lda-load-more" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;border:0;background:transparent;color:var(--lda-text-secondary,#756348);padding:8px 4px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;letter-spacing:0;cursor:pointer;transition:transform .25s ease,color .25s ease;" style-hover="transform:translateY(-2px);color:#B79A6B;">Ver más</button>'''
          new = '''<button type="button" class="lda-load-more" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;border:0;background:transparent;color:var(--lda-text-secondary,#756348);padding:8px 4px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;letter-spacing:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;">Ver más</button>'''
          if old not in s:
              raise SystemExit('Missing Tienda Ver más button')
          p.write_text(s.replace(old,new,1))

          # Aprende: keep the regular Ver más breathing room when it exists, but
          # use exactly 60px when there are no more items, matching FAQ top space.
          replace_once(
              'Aprende.dc.html',
              "bannerBottomGap: '0px',\n      bannerHeight:",
              "bannerBottomGap: '0px',\n      loadMoreHeight: m && !showLoadMore ? '60px' : '88px',\n      bannerHeight:",
              'Aprende terminal spacing variable'
          )
          replace_once(
              'Aprende.dc.html',
              'class="lda-load-more-wrap lda-aprende-load-more" style="height:88px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;"',
              'class="lda-load-more-wrap lda-aprende-load-more" style="height:{{ loadMoreHeight }};min-height:{{ loadMoreHeight }};box-sizing:border-box;display:flex;align-items:center;justify-content:center;"',
              'Aprende load more wrapper height'
          )
          p = Path('Aprende.dc.html')
          s = p.read_text()
          old = '''<button type="button" class="lda-load-more" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;border:0;background:transparent;color:var(--lda-text-secondary,#756348);padding:8px 4px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;letter-spacing:0;cursor:pointer;transition:transform .25s ease,color .25s ease;" style-hover="transform:translateY(-2px);color:#B79A6B;">Ver más</button>'''
          new = '''<button type="button" class="lda-load-more" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;border:0;background:transparent;color:var(--lda-text-secondary,#756348);padding:8px 4px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;letter-spacing:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;">Ver más</button>'''
          if old not in s:
              raise SystemExit('Missing Aprende Ver más button')
          p.write_text(s.replace(old,new,1))

          # Contacto: tighten only the mobile gap between intro copy and form.
          replace_once(
              'Contacto.dc.html',
              "heroGap: m ? '28px' : '56px',",
              "heroGap: m ? '20px' : '56px',",
              'Contacto mobile intro/form gap'
          )

          # Product detail copy.
          replace_once(
              'Productos.dc.html',
              'También te puede <span class="lda-script-section"',
              'También te podría <span class="lda-script-section"',
              'Product recommendation heading'
          )

          # The pending mobile Aprende spotlight fix must remain present in main:
          # 4:3 expands the photo frame downward and cover fills it without distortion.
          inicio = Path('Inicio.dc.html').read_text()
          expected = "spotlightImgAspect: m ? '4/3' : 'auto',"
          if expected not in inicio:
              raise SystemExit('Pending mobile spotlight 4/3 fix is missing from Inicio.dc.html')
          print('verified Inicio mobile spotlight 4/3 fix')
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Tienda.dc.html Aprende.dc.html Contacto.dc.html Productos.dc.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish mobile spacing and interactions"
          git push origin main
