name: Bust subpage runtime cache
on:
  push:
    paths:
      - '.github/workflows/bust-subpage-runtime-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version support runtime on five subpages
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ['Productos.dc.html','Aprende Detalle.dc.html','Recursos.dc.html','Servicios.dc.html','Encargos.dc.html']
          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('<script src="/support.js"></script>', '<script src="/support.js?v=20260812-subpages2"></script>', 1)
              if s2 == s:
                  raise SystemExit(f'support tag not found in {name}')
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Productos.dc.html' 'Aprende Detalle.dc.html' 'Recursos.dc.html' 'Servicios.dc.html' 'Encargos.dc.html'
          git commit -m "Refresh runtime on all five new subpages"
          git push
