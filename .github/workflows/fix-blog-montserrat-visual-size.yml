name: Fix blog Montserrat visual size
on:
  push:
    paths:
      - '.github/workflows/fix-blog-montserrat-visual-size.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set mobile blog title to visual reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          s = s.replace("    .bp-title { font-size: 26px !important; -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }", "    .bp-title { font-size: 20px !important; line-height: 1.32 !important; -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }")
          s = s.replace("    .bp-title { font-size: 26px; }", "    .bp-title { font-size: 20px !important; line-height: 1.32 !important; }")
          # Keep Camelia emphasized independently.
          if "    .bp-title span.lda-script-hero { font-size: 46px !important; line-height: .78 !important; }" not in s:
              s = s.replace("    .bp-title span.lda-script-hero { font-size: 34px !important; line-height: .82 !important; }", "    .bp-title span.lda-script-hero { font-size: 46px !important; line-height: .78 !important; }")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Match mobile blog title Montserrat to visual reference"
          git push origin main
