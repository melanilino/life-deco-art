name: Sync public first paint
on:
  push:
    paths:
      - '.github/workflows/sync-public-first-paint.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gate public pages until DC content is mounted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              'Aprende Detalle.dc.html',
              'Aprende.dc.html',
              'Blog Post.dc.html',
              'Contacto.dc.html',
              'Encargos.dc.html',
              'Politica de Privacidad.dc.html',
              'Productos.dc.html',
              'Recursos.dc.html',
              'Servicios.dc.html',
              'Sobre Mi.dc.html',
              'Terminos y Condiciones.dc.html',
              'Tienda.dc.html',
          ]

          gate = r'''\n<!-- LDA synchronized first paint -->
<style id="lda-first-paint-gate">
  html.lda-first-paint-pending,
  html.lda-first-paint-pending body { background:#fff !important; }
  html.lda-first-paint-pending body > * { visibility:hidden !important; }
</style>
<script id="lda-first-paint-gate-script">
(function(){
  var rootEl = document.documentElement;
  rootEl.classList.add('lda-first-paint-pending');
  var released = false;
  var observer = null;
  function release(){
    if (released) return;
    released = true;
    if (observer) observer.disconnect();
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        rootEl.classList.remove('lda-first-paint-pending');
      });
    });
  }
  function ready(){
    var root = document.getElementById('dc-root');
    if (!root) return false;
    if (!root.children.length && !(root.textContent || '').trim()) return false;
    release();
    return true;
  }
  if (!ready()) {
    observer = new MutationObserver(function(){ ready(); });
    observer.observe(rootEl, { childList:true, subtree:true });
    document.addEventListener('DOMContentLoaded', ready, { once:true });
    setTimeout(release, 3000);
  }
})();
</script>
<!-- /LDA synchronized first paint -->
'''

          changed = []
          for name in targets:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing expected public page: {name}')
              s = p.read_text()
              if 'id="lda-first-paint-gate"' in s:
                  continue
              if '</head>' not in s:
                  raise SystemExit(f'No </head> in {name}')
              s = s.replace('</head>', gate + '\n</head>', 1)
              p.write_text(s)
              changed.append(name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit public pages only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- 'Aprende Detalle.dc.html' 'Aprende.dc.html' 'Blog Post.dc.html' 'Contacto.dc.html' 'Encargos.dc.html' 'Politica de Privacidad.dc.html' 'Productos.dc.html' 'Recursos.dc.html' 'Servicios.dc.html' 'Sobre Mi.dc.html' 'Terminos y Condiciones.dc.html' 'Tienda.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize first paint across public pages"
          git push origin main
