name: Sync public first paint
on:
  push:
    paths:
      - '.github/workflows/sync-public-first-paint.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gate public pages until DC content is mounted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          targets = [
              'Aprende Detalle.dc.html',
              'Aprende.dc.html',
              'Blog Post.dc.html',
              'Contacto.dc.html',
              'Encargos.dc.html',
              'Politica de Privacidad.dc.html',
              'Productos.dc.html',
              'Recursos.dc.html',
              'Servicios.dc.html',
              'Sobre Mi.dc.html',
              'Terminos y Condiciones.dc.html',
              'Tienda.dc.html',
          ]

          gate = base64.b64decode('').decode()

          changed = []
          for name in targets:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing expected public page: {name}')
              s = p.read_text()
              if 'id="lda-first-paint-gate"' in s:
                  continue
              if '</head>' not in s:
                  raise SystemExit(f'No </head> in {name}')
              p.write_text(s.replace('</head>', gate + '\n</head>', 1))
              changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit public pages only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- 'Aprende Detalle.dc.html' 'Aprende.dc.html' 'Blog Post.dc.html' 'Contacto.dc.html' 'Encargos.dc.html' 'Politica de Privacidad.dc.html' 'Productos.dc.html' 'Recursos.dc.html' 'Servicios.dc.html' 'Sobre Mi.dc.html' 'Terminos y Condiciones.dc.html' 'Tienda.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize first paint across public pages"
          git push origin main
