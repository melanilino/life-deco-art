name: CMS per-image delete controls
on:
  push:
    paths:
      - '.github/workflows/cms-per-image-delete.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove global cleanup and add per-image controls
        run: |
          echo '' | base64 -d > /tmp/edit_cmsjs.py
          python /tmp/edit_cmsjs.py
          echo '' | base64 -d > /tmp/edit_cms.py
          python /tmp/edit_cms.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms.js CMS.dc.html
          git commit -m "Replace global CMS media purge with per-image delete controls"
          git push
