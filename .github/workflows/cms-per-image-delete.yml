name: Fix CMS trash icon markup
on:
  push:
    paths:
      - '.github/workflows/cms-per-image-delete.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair CMS delete controls
        run: |
          python -c "from pathlib import Path; p=Path('CMS.dc.html'); s=p.read_text(); import re; s=re.sub(r'M19 6l-1 14(?:onSobremiHeroRemove|onSobremiFeaturedRemove|ph\.onRemove|onTiendaBannerRemove|f\.onRemove|onAprendeBannerRemove)6L5 6','M19 6l-1 14H6L5 6',s); s=s.replace('),\\\\n      on', '),\\n      on'); p.write_text(s)"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMS.dc.html
          git commit -m "Repair CMS per-image trash controls"
          git push
