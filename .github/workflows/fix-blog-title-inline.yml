name: Fix blog title inline sizing
on:
  push:
    paths:
      - '.github/workflows/fix-blog-title-inline.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move blog title sizing inline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          old = '''<h1 class="bp-title" style="line-height:1.25;color:#000;font-weight:300;margin:0 0 14px;">{{ post.titleStart }}<span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:1.55em;">{{ post.titleAccent }}</span></h1>'''
          new = '''<h1 class="bp-title" style="font-size:clamp(20px,4.8vw,38px);line-height:1.32;color:#000;font-weight:300;margin:0 0 14px;">{{ post.titleStart }}<span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:.82;">{{ post.titleAccent }}</span></h1>'''
          if old not in s:
              raise SystemExit('Target blog title markup not found; refusing blind change')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Make blog title sizing render inline"
          git push origin main
