name: Integrate new subpages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-new-subpages.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect subpages
        shell: bash
        run: |
          echo '  ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tienda.dc.html Productos.dc.html Aprende.dc.html "Aprende Detalle.dc.html" Recursos.dc.html Servicios.dc.html Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect new detail subpages across site"
          git push origin main
