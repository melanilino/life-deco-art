name: One-time Camelia CSS cache bust 6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-css-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Camelia CSS version
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              new = text.replace('20260903camelia8', '20260903camelia9')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} HTML files')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No files needed updating"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump Camelia CSS version to camelia9"
          git push
