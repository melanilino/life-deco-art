name: Stop public double render
on:
  push:
    paths:
      - '.github/workflows/stop-public-double-render.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prevent redundant runtime self-fetch on public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'Aprende Detalle.dc.html',
              'Aprende.dc.html',
              'Blog Post.dc.html',
              'Contacto.dc.html',
              'Encargos.dc.html',
              'Politica de Privacidad.dc.html',
              'Productos.dc.html',
              'Recursos.dc.html',
              'Servicios.dc.html',
              'Sobre Mi.dc.html',
              'Terminos y Condiciones.dc.html',
              'Tienda.dc.html',
          ]

          marker = '<script id="lda-no-runtime-refetch">window.__resources=window.__resources||{};</script>\n'
          support_script = re.compile(r'<script\b[^>]*\bsrc=["\'][^"\']*support\.js[^"\']*["\'][^>]*></script>', re.I)
          changed = []
          for name in targets:
              p = Path(name)
              s = p.read_text()
              if 'id="lda-no-runtime-refetch"' in s:
                  continue
              m = support_script.search(s)
              if not m:
                  raise SystemExit(f'No support.js script found in {name}')
              s = s[:m.start()] + marker + s[m.start():]
              p.write_text(s)
              changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit public pages only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- 'Aprende Detalle.dc.html' 'Aprende.dc.html' 'Blog Post.dc.html' 'Contacto.dc.html' 'Encargos.dc.html' 'Politica de Privacidad.dc.html' 'Productos.dc.html' 'Recursos.dc.html' 'Servicios.dc.html' 'Sobre Mi.dc.html' 'Terminos y Condiciones.dc.html' 'Tienda.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Prevent redundant public page rerender"
          git push origin main
