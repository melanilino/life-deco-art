name: Align Aprende mobile FAQ spacing

on:
  push:
    paths:
      - '.github/workflows/align-aprende-faq-mobile.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Aprende FAQ spacing to Tienda on mobile
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Aprende.dc.html')
          t = p.read_text(encoding='utf-8')

          old = '<div style="max-width:820px;margin:0 auto;padding:{{ faqPad }};">\n    <div style="display:grid;grid-template-columns:{{ faqCols }};gap:{{ faqGap }};align-items:center;min-width:0;">\n      <div>\n        <div class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:{{ eyebrowGap }};">Preguntas frecuentes</div>'
          new = '<div class="lda-aprende-faq" style="max-width:820px;margin:0 auto;padding:{{ faqPad }};">\n    <div style="display:grid;grid-template-columns:{{ faqCols }};gap:{{ faqGap }};align-items:center;min-width:0;">\n      <div>\n        <div class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:#0CC0DF;font-weight:500;margin-bottom:{{ eyebrowGap }};">Preguntas frecuentes</div>'
          if old not in t:
              raise SystemExit('Aprende FAQ wrapper pattern not found')
          t = t.replace(old, new, 1)

          anchor = '</style>\n</helmet>'
          css = '''</style>\n<style id="lda-aprende-faq-mobile-align">\n  @media(max-width:859px){\n    .lda-aprende-faq{margin-top:-88px!important;}\n  }\n</style>\n</helmet>'''
          if anchor not in t:
              raise SystemExit('Helmet style anchor not found')
          t = t.replace(anchor, css, 1)

          p.write_text(t, encoding='utf-8')
          checks = ['class="lda-aprende-faq"', '.lda-aprende-faq{margin-top:-88px!important;}']
          for check in checks:
              if check not in t:
                  raise SystemExit(f'Guardrail failed: {check}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Aprende.dc.html'
          git commit -m "Match Aprende mobile FAQ spacing to Tienda"
          git push
