name: Fix mobile navigation transition
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-nav-transition.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile navigation fix
        run: python3 .github/scripts/fix_mobile_nav.py
      - name: Commit fixes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html' site-enhancements.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Remove page prefetch and close mobile menu before navigation"
          git push origin main
