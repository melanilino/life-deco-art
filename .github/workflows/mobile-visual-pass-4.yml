name: Mobile visual pass 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-visual-pass-4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n == 0:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              if count is not None and n != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new))

          # 1) Unify and truly center “Ver más” in Tienda + Aprende.
          replace('design-system.css',
          """  .lda-load-more-wrap {\n    height: auto !important;\n    min-height: 0 !important;\n    padding: 16px 0 12px !important;\n  }""",
          """  .lda-load-more-wrap {\n    height: 72px !important;\n    min-height: 72px !important;\n    padding: 0 !important;\n    display: flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    box-sizing: border-box !important;\n  }""")

          # 2) Compact Tienda categories a little more, without changing typography.
          replace('design-system.css',
          """  .lda-mobile-category-list {\n    gap: 2px !important;\n  }\n  .lda-mobile-category-list .lda-filter-control {\n    min-height: 36px !important;\n  }""",
          """  .lda-mobile-category-list {\n    gap: 0 !important;\n  }\n  .lda-mobile-category-list .lda-filter-control {\n    min-height: 32px !important;\n  }""")

          replace('Tienda.dc.html',
          'style="display:flex;flex-direction:column;gap:10px;padding-top:12px;animation:lda-fade-in .25s ease;"',
          'style="display:flex;flex-direction:column;gap:4px;padding-top:6px;animation:lda-fade-in .25s ease;"')

          # 3) Compact the two mobile Aprende tab rows.
          replace('Aprende.dc.html',
          "padding:4px 3px;min-height:44px;font-family:'Montserrat',sans-serif;",
          "padding:2px 3px;min-height:36px;font-family:'Montserrat',sans-serif;")

          # 4) Restore the blue Aprende spotlight composition to match the supplied reference:
          #    text centered in the visible blue band, with slightly less white space above.
          replace('Inicio.dc.html',
          "margin-top: {{ gapPx }}; opacity: 0;",
          "margin-top: {{ spotlightMarginTop }}; opacity: 0;",
          count=1)
          replace('Inicio.dc.html',
          "spotlightTopPad: m ? '16px' : '96px',\n      spotlightNegMargin: m ? '-120px' : '-100px',",
          "spotlightTopPad: m ? '52px' : '96px',\n      spotlightMarginTop: m ? '72px' : gap + 'px',\n      spotlightNegMargin: m ? '-70px' : '-100px',",
          count=1)
          PY
      - name: Commit refinements
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css Tienda.dc.html Aprende.dc.html Inicio.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish mobile spacing and spotlight alignment"
          git push origin main
