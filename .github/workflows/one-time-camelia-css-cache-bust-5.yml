name: One-time Camelia CSS cache bust 5

on:
  push:
    paths:
      - '.github/workflows/one-time-camelia-css-cache-bust-5.yml'

permissions:
  contents: write

jobs:
  update-camelia-css-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update CSS version across HTML files
        run: |
          grep -RIl --include='*.html' 'design-system.css?v=20260903camelia7' . | while read -r file; do
            sed -i 's/design-system.css?v=20260903camelia7/design-system.css?v=20260903camelia8/g' "$file"
          done
          git rm .github/workflows/one-time-camelia-css-cache-bust-5.yml
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Bust Camelia CSS cache for 1.80 alignment'
          git push
