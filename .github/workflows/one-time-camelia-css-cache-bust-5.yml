name: One-time Camelia CSS cache bust 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-camelia-css-cache-bust-5.yml'

permissions:
  contents: write

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stylesheet version across HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'/design-system\.css\?v=[^"\']+', '/design-system.css?v=20260903camelia7', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated {len(changed)} HTML files')
          for p in changed:
              print(p)
      - name: Commit cache bust
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
          else
            git commit -m "Bust Camelia stylesheet cache for 1.70 scale"
            git push
          fi
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          rm -f .github/workflows/one-time-camelia-css-cache-bust-5.yml
          git add .github/workflows/one-time-camelia-css-cache-bust-5.yml
          git commit -m "Remove one-time Camelia cache-bust workflow"
          git push
