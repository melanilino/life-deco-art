name: Mobile visual pass 2

on:
  push:
    paths:
      - '.github/workflows/mobile-visual-pass-2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refinements
        run: python .github/scripts/mobile_visual_pass_2.py
      - name: Commit refinements
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css "*.dc.html"
          git diff --cached --quiet || git commit -m "Refine mobile spacing and repeated CTA"
          git push
      - name: Remove one-time files
        if: success()
        run: |
          git rm .github/workflows/mobile-visual-pass-2.yml .github/scripts/mobile_visual_pass_2.py
          git commit -m "Remove one-time mobile visual workflow"
          git push
