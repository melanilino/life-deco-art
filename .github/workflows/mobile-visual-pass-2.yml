name: Mobile visual pass 2

on:
  push:
    paths:
      - '.github/workflows/mobile-visual-pass-2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile visual refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('design-system.css')
          css = css_path.read_text(encoding='utf-8')
          old_burger = 'height: 1px !important;'
          if old_burger not in css:
              raise SystemExit('Expected mobile burger thickness rule not found')
          css = css.replace(old_burger, 'height: 1.25px !important;', 1)

          marker = '  /* Give the Camelia descender in “ayudarte” room before the first card. */'
          mobile_block = '''  /* Mobile storefront / learning rhythm refinement. */
  .lda-mobile-category-list {
    gap: 6px !important;
  }
  .lda-mobile-category-list .lda-filter-control {
    min-height: 40px !important;
  }
  .lda-load-more-wrap {
    height: auto !important;
    min-height: 0 !important;
    padding: 16px 0 12px !important;
  }
  .lda-load-more-wrap .lda-load-more {
    min-height: 40px !important;
  }
  .lda-mobile-faq-card {
    padding: 10px 16px !important;
  }
  .lda-mobile-faq-card > button {
    min-height: 40px !important;
  }

'''
          if 'Mobile storefront / learning rhythm refinement.' not in css:
              if marker not in css:
                  raise SystemExit('CSS insertion marker not found')
              css = css.replace(marker, mobile_block + marker, 1)
          css_path.write_text(css, encoding='utf-8')

          # Make the repeated closing CTA follow Inicio's mobile line break everywhere.
          cta_pattern = re.compile(r'¿No diste con lo que\s+<span([^>]*)>querías</span>\?')
          cta_updates = 0
          for path in Path('.').glob('*.dc.html'):
              text = path.read_text(encoding='utf-8')
              updated, count = cta_pattern.subn(r'¿No diste con lo que<br class="lda-mobile-break"><span\1>querías</span>?', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  cta_updates += count
          if cta_updates < 2:
              raise SystemExit(f'Expected at least two repeated CTA updates, found {cta_updates}')

          # Tienda: compact categories, load-more region, and closed FAQ cards.
          tienda_path = Path('Tienda.dc.html')
          tienda = tienda_path.read_text(encoding='utf-8')
          old = '<div style="display:flex;flex-direction:column;gap:16px;">'
          if old not in tienda:
              raise SystemExit('Tienda category list marker not found')
          tienda = tienda.replace(old, '<div class="lda-mobile-category-list" style="display:flex;flex-direction:column;gap:16px;">', 1)
          old = '<div style="display:flex;justify-content:center;padding:44px 0 24px;">'
          if old not in tienda:
              raise SystemExit('Tienda load-more wrapper marker not found')
          tienda = tienda.replace(old, '<div class="lda-load-more-wrap" style="display:flex;justify-content:center;padding:44px 0 24px;">', 1)
          faq_card = '<div style="background:#F3EEE4;border-radius:10px;padding:16px 20px;transition:background .25s ease;">'
          if faq_card not in tienda:
              raise SystemExit('Tienda FAQ card marker not found')
          tienda = tienda.replace(faq_card, '<div class="lda-mobile-faq-card" style="background:#F3EEE4;border-radius:10px;padding:16px 20px;transition:background .25s ease;">')
          tienda_path.write_text(tienda, encoding='utf-8')

          # Aprende: compact load-more region and FAQ cards.
          aprende_path = Path('Aprende.dc.html')
          aprende = aprende_path.read_text(encoding='utf-8')
          old = '<div style="height:88px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">'
          if old not in aprende:
              raise SystemExit('Aprende load-more wrapper marker not found')
          aprende = aprende.replace(old, '<div class="lda-load-more-wrap" style="height:88px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">', 1)
          old_button = '<button type="button" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;'
          if old_button not in aprende:
              raise SystemExit('Aprende load-more button marker not found')
          aprende = aprende.replace(old_button, '<button type="button" class="lda-load-more" onClick="{{ onLoadMore }}" style="min-height:44px;min-width:44px;', 1)
          if faq_card not in aprende:
              raise SystemExit('Aprende FAQ card marker not found')
          aprende = aprende.replace(faq_card, '<div class="lda-mobile-faq-card" style="background:#F3EEE4;border-radius:10px;padding:16px 20px;transition:background .25s ease;">')
          aprende_path.write_text(aprende, encoding='utf-8')

          # Inicio: lift the prompt within the blue learning band without changing the image overlap.
          inicio_path = Path('Inicio.dc.html')
          inicio = inicio_path.read_text(encoding='utf-8')
          old = "spotlightTopPad: m ? '64px' : '96px'"
          if old not in inicio:
              raise SystemExit('Inicio spotlight top padding marker not found')
          inicio = inicio.replace(old, "spotlightTopPad: m ? '52px' : '96px'", 1)
          inicio_path.write_text(inicio, encoding='utf-8')
          PY

          git config user.name 'Life Deco Art'
          git config user.email 'life-deco-art@local'
          git add design-system.css '*.dc.html'
          git diff --cached --quiet || git commit -m 'Refine mobile spacing and repeated CTA'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/mobile-visual-pass-2.yml
          git commit -m 'Remove one-time mobile visual workflow'
          git push
