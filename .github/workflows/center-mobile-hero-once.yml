name: Center mobile hero once

on:
  push:
    paths:
      - '.github/workflows/center-mobile-hero-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update mobile hero padding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Inicio.dc.html')
          s = p.read_text()
          old = 'padding:72px 26px 16px'
          new = 'padding:44px 26px 44px'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 matches, found {count}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/center-mobile-hero-once.yml
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Inicio.dc.html .github/workflows/center-mobile-hero-once.yml
          git commit -m "Center mobile home hero content"
          git push
