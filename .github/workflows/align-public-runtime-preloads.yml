name: Align public runtime preloads
on:
  push:
    paths:
      - '.github/workflows/align-public-runtime-preloads.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply runtime preload alignment
        run: python3 .github/scripts/align_public_runtime_preloads.py
      - name: Commit fixes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Preload React before public page boot"
          git push origin main
