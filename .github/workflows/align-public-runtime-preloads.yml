name: Align public runtime preloads
on:
  push:
    paths:
      - '.github/workflows/align-public-runtime-preloads.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match homepage runtime preload strategy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          preload = '''<link rel="preload" as="script" href="/vendor/react-18.3.1.production.min.js">
<link rel="preload" as="script" href="/vendor/react-dom-18.3.1.production.min.js">
'''
          changed=[]
          for p in Path('.').glob('*.dc.html'):
              if p.name == 'Inicio.dc.html':
                  continue
              s=p.read_text()
              old=s
              if '/vendor/react-18.3.1.production.min.js' not in s:
                  anchor='<link rel="preconnect" href="https://unpkg.com" crossorigin>\n'
                  if anchor in s:
                      s=s.replace(anchor, anchor+preload, 1)
                  else:
                      anchor='<meta name="viewport" content="width=device-width, initial-scale=1">\n'
                      if anchor in s:
                          s=s.replace(anchor, anchor+preload, 1)
                      else:
                          raise SystemExit(f'No preload insertion point in {p.name}')
              s=re.sub(r'<script src="(?:\./|/)support\.js\?v=[^"]+" defer></script>', '<script src="/support.js?v=20260906boot2" defer></script>', s, count=1)
              if s != old:
                  p.write_text(s)
                  changed.append(p.name)
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit fixes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -- '*.dc.html'
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Preload React before public page boot"
          git push origin main
