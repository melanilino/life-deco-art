name: Fix Tienda CTA spacing
on:
  push:
    paths:
      - '.github/workflows/fix-tienda-cta-spacing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix desktop CTA word spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tienda.dc.html')
          s=p.read_text()
          old='¿No diste con lo que<br class="lda-mobile-break"><span class="lda-script-section lda-cta-script-word"'
          new='¿No diste con lo que<br class="lda-mobile-break"> <span class="lda-script-section lda-cta-script-word"'
          if old not in s:
              raise SystemExit('CTA target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Tienda.dc.html
          git diff --cached --check
          git commit -m "Fix Tienda desktop CTA spacing"
          git push origin main
