name: Localize site fonts
on:
  push:
    paths:
      - '.github/workflows/localize-site-fonts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Montserrat locally and remove visible font swapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request

          root = Path('.')
          fonts = root / 'fonts'
          fonts.mkdir(exist_ok=True)

          css_url = 'https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&display=swap'
          req = urllib.request.Request(css_url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          remote_css = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
          blocks = re.findall(r'@font-face\s*\{.*?\}', remote_css, flags=re.S)
          if not blocks:
              raise SystemExit('Could not retrieve Montserrat @font-face blocks')

          localized = []
          chosen = {}
          counters = {}
          for block in blocks:
              murl = re.search(r'url\((https://[^)]+)\)', block)
              mw = re.search(r'font-weight:\s*([^;]+);', block)
              ms = re.search(r'font-style:\s*([^;]+);', block)
              if not (murl and mw and ms):
                  continue
              url = murl.group(1)
              weight = mw.group(1).strip()
              style = ms.group(1).strip()
              key = (style, weight)
              counters[key] = counters.get(key, 0) + 1
              idx = counters[key]
              ext = '.woff2' if '.woff2' in url else '.woff'
              fname = f'montserrat-{style}-{weight}-{idx}{ext}'
              dest = fonts / fname
              reqf = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              dest.write_bytes(urllib.request.urlopen(reqf, timeout=30).read())
              block = block.replace(url, f'/fonts/{fname}')
              block = re.sub(r'font-display:\s*swap\s*;', 'font-display: block;', block)
              localized.append(block)
              chosen[key] = fname

          if not localized:
              raise SystemExit('No Montserrat font blocks localized')

          ds = Path('design-system.css')
          s = ds.read_text()
          s = re.sub(r'/\* Local Montserrat fonts \*/.*?/\* End local Montserrat fonts \*/\n*', '', s, flags=re.S)
          font_block = '/* Local Montserrat fonts */\n' + '\n'.join(localized) + '\n/* End local Montserrat fonts */\n\n'
          s = font_block + s
          # Camelia is local too: avoid rendering a fallback and swapping later.
          camelia = re.search(r"@font-face\s*\{\s*font-family:\s*'Camelia Beauty';.*?\}", s, flags=re.S)
          if camelia:
              fixed = re.sub(r'font-display:\s*swap\s*;', 'font-display: block;', camelia.group(0))
              s = s[:camelia.start()] + fixed + s[camelia.end():]
          ds.write_text(s)

          # Preload the most common local faces on every page, and remove remote Montserrat CSS.
          preload_files = []
          for key in [('normal','300'), ('normal','400'), ('normal','500')]:
              if key in chosen:
                  preload_files.append(chosen[key])
          preload_tags = ['<link rel="preload" as="font" type="font/otf" href="/fonts/camelia-beauty-latin.otf" crossorigin>']
          preload_tags += [f'<link rel="preload" as="font" type="font/woff2" href="/fonts/{f}" crossorigin>' for f in preload_files]
          preload_html = '\n'.join(preload_tags) + '\n'

          changed = 0
          for p in root.rglob('*.html'):
              if any(part in {'.git','node_modules','.github'} for part in p.parts):
                  continue
              text = p.read_text(errors='ignore')
              original = text
              # Remove Google font preconnects; Montserrat is now same-origin.
              text = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.gstatic\.com[^>]*>\s*', '\n', text, flags=re.I)
              text = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.googleapis\.com[^>]*rel=["\']preconnect["\'][^>]*>\s*', '\n', text, flags=re.I)
              # Replace any mixed Montserrat + Homemade Apple request with Homemade Apple only; remove Montserrat-only requests.
              def repl_google(m):
                  tag = m.group(0)
                  if 'Montserrat' not in tag:
                      return tag
                  if 'Homemade+Apple' in tag or 'Homemade%20Apple' in tag:
                      return '<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">'
                  return ''
              text = re.sub(r'<link[^>]+href=["\']https://fonts\.googleapis\.com/css2[^>]*>', repl_google, text, flags=re.I)
              # Remove any previous local-font preload block and insert fresh preloads before design-system.css.
              text = re.sub(r'<!-- LDA local font preloads -->.*?<!-- /LDA local font preloads -->\s*', '', text, flags=re.S)
              marker = '<!-- LDA local font preloads -->\n' + preload_html + '<!-- /LDA local font preloads -->\n'
              if '/design-system.css' in text:
                  text = re.sub(r'(<link[^>]+href=["\'][^"\']*design-system\.css[^>]*>)', marker + r'\1', text, count=1, flags=re.I)
              # Inline duplicate Camelia declarations should not swap either.
              text = text.replace("font-display:swap", "font-display:block").replace("font-display: swap", "font-display: block")
              if text != original:
                  p.write_text(text)
                  changed += 1

          print(f'Localized {len(localized)} Montserrat faces; updated {changed} HTML files; preloads: {preload_files}')
          PY
      - name: Commit font stabilization only
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css fonts '*.html' ':!cms-admin.html' || true
          git add -A -- '*.html' '*.dc.html' design-system.css fonts
          git diff --cached --check
          git commit -m "Stabilize site fonts and remove font swapping"
          git push origin main
