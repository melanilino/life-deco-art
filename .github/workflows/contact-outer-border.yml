name: Contact outer border
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-outer-border.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match outer contact border
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Contacto.dc.html')
          s = p.read_text()
          old = 'border-color: #F0EEE6'
          new = 'border-color: #E4DDCC'
          if old not in s:
              raise SystemExit('Outer contact border color not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Contacto.dc.html
          git diff --cached --quiet && exit 0
          git commit -m "Match outer contact border to Aprende"
          git push origin main
