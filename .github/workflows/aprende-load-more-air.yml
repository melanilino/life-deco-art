name: Aprende load more spacing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aprende-load-more-air.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase Aprende load more spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Aprende.dc.html')
          s = p.read_text()
          old = '<div class="lda-load-more-wrap" style="height:88px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">'
          new = '<div class="lda-load-more-wrap lda-aprende-load-more" style="height:88px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;">'
          if old not in s:
              raise SystemExit('Aprende load-more wrapper not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('design-system.css')
          s = p.read_text()
          anchor = "  .lda-tienda-load-more {\n    height: 96px !important;\n    min-height: 96px !important;\n    margin-top: 4px !important;\n    margin-bottom: 4px !important;\n    transform: none !important;\n  }"
          block = "\n  /* Aprende: a little more breathing room than the generic wrapper, while keeping Tienda unchanged. */\n  .lda-aprende-load-more {\n    height: 88px !important;\n    min-height: 88px !important;\n    transform: none !important;\n  }"
          if '.lda-aprende-load-more {' not in s:
              if anchor not in s:
                  raise SystemExit('Tienda load-more anchor not found')
              s = s.replace(anchor, anchor + block, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add Aprende.dc.html design-system.css
          git diff --cached --quiet && exit 0
          git commit -m "Increase Aprende load more breathing room"
          git push origin main
