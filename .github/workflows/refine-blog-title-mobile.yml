name: Refine blog title mobile
on:
  push:
    paths:
      - '.github/workflows/refine-blog-title-mobile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match mobile blog title to reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          s = s.replace("    .bp-title { font-size: 26px; }", "    .bp-title { font-size: 20px; line-height: 1.32; }")
          s = s.replace("    .bp-title span.lda-script-hero { font-size: 46px !important; line-height: .78 !important; }", "    .bp-title span.lda-script-hero { font-size: 34px !important; line-height: .82 !important; }")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Refine mobile blog title proportions"
          git push origin main
