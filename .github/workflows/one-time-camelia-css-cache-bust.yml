name: One-time Camelia CSS cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update stylesheet version across HTML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260903camelia3'
          pattern = re.compile(r'design-system\.css\?v=[^\"\'\s>]+')
          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = pattern.sub(f'design-system.css?v={version}', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-camelia-css-cache-bust.yml
      - name: Commit cache-bust
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bust Camelia stylesheet cache across site"
          git push origin HEAD:main
