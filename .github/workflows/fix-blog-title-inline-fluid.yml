name: Fix blog title inline fluid sizing
on:
  push:
    paths:
      - '.github/workflows/fix-blog-title-inline-fluid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make blog title size direct and viewport-driven
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Blog Post.dc.html')
          s = p.read_text()
          old = '''<h1 class="bp-title" style="font-size:{{ post.titleFontSize }};line-height:{{ post.titleLineHeight }};color:#000;font-weight:300;margin:0 0 14px;">{{ post.titleStart }}<span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:{{ post.accentFontSize }};line-height:{{ post.accentLineHeight }};">{{ post.titleAccent }}</span></h1>'''
          new = '''<h1 class="bp-title" style="font-size:min(38px,4.6vw);line-height:1.32;color:#000;font-weight:300;margin:0 0 14px;">{{ post.titleStart }}<span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:min(52px,8.7vw);line-height:.82;">{{ post.titleAccent }}</span></h1>'''
          if old not in s:
              raise SystemExit('Expected title markup not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add 'Blog Post.dc.html'
          git commit -m "Reduce blog title Montserrat with inline viewport sizing"
          git push origin main
