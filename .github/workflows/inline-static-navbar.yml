name: Inline static navbar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[static-nav]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace runtime navbar with initial HTML navbar
        shell: python
        run: |
          import re
          from pathlib import Path

          pages = {
              'Inicio.dc.html': 'inicio',
              'Sobre Mi.dc.html': 'sobre-mi',
              'Tienda.dc.html': 'tienda',
              'Aprende.dc.html': 'aprende',
              'Contacto.dc.html': 'contacto',
          }
          links = [
              ('inicio','Inicio','/'),
              ('sobre-mi','Sobre Mí','/sobre-mi'),
              ('tienda','Tienda','/tienda'),
              ('aprende','Aprende','/aprende'),
              ('contacto','Contacto','/contacto'),
          ]
          colors = {'inicio':'#8B795E','sobre-mi':'#8B795E','tienda':'#F65091','aprende':'#0CC0DF','contacto':'#8B795E'}

          font_head = '''<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Homemade+Apple&display=swap" rel="stylesheet">\n<style id="lda-static-nav-css">\n#lda-static-nav{position:fixed;top:0;left:0;right:0;z-index:2147482000;height:80px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 48px;background:#fff;font-family:'Montserrat',sans-serif;color:#000}\n#lda-static-nav a{text-decoration:none;color:#000}\n#lda-static-nav .lda-brand{font:400 20px/1.2 'Homemade Apple',cursive;letter-spacing:.13px;white-space:nowrap}\n#lda-static-nav .lda-desktop{display:flex;align-items:center;gap:32px}\n#lda-static-nav .lda-link{font-size:14px;font-weight:400;letter-spacing:.01em;padding-bottom:6px;background-repeat:no-repeat;background-position:left bottom;background-size:0 1px;transition:background-size .25s ease,color .25s ease}\n#lda-static-nav .lda-link:hover{background-size:100% 1px}\n#lda-static-nav .lda-link.lda-active{background-size:100% 1px}\n#lda-static-nav .lda-mobile{display:none}\n#lda-static-nav summary{list-style:none;cursor:pointer;padding:10px;display:flex;flex-direction:column;gap:5px}\n#lda-static-nav summary::-webkit-details-marker{display:none}\n#lda-static-nav .lda-burger{display:block;height:2px;background:#000}.lda-b1,.lda-b2{width:22px}.lda-b3{width:15px}\n#lda-static-nav .lda-mobile-panel{position:fixed;top:64px;left:0;right:0;bottom:0;background:#fff;padding:24px;overflow:auto;box-sizing:border-box}\n#lda-static-nav .lda-mobile-panel a{display:block;padding:18px 4px;border-bottom:1px solid #F0EAE0;font-size:20px;font-weight:300}\n.lda-nav-spacer{height:80px}\n#lda-whatsapp-fab-static{position:fixed;bottom:40px;right:24px;z-index:2147483000;width:56px;height:56px;border-radius:999px;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .25s ease}\n#lda-whatsapp-fab-static:hover{transform:scale(1.08)}\n@media(max-width:859px){#lda-static-nav{height:64px;padding:0 20px}#lda-static-nav .lda-desktop{display:none}#lda-static-nav .lda-mobile{display:block}.lda-nav-spacer{height:64px}#lda-whatsapp-fab-static{bottom:24px;right:18px}}\n</style>'''

          def navbar(active):
              desktop=[]; mobile=[]
              for id_, label, href in links:
                  active_cls = ' lda-active' if id_ == active else ''
                  color = colors[id_] if id_ == active else '#000000'
                  bg = color
                  desktop.append(f'<a class="lda-link{active_cls}" href="{href}" style="color:{color};background-image:linear-gradient({bg},{bg})">{label}</a>')
                  mobile.append(f'<a href="{href}" style="color:{color}">{label}</a>')
              return f'''<nav id="lda-static-nav" aria-label="Navegación principal">\n  <a href="/" class="lda-brand">Life Deco Art</a>\n  <div class="lda-desktop">{''.join(desktop)}</div>\n  <details class="lda-mobile">\n    <summary aria-label="Abrir menú"><span class="lda-burger lda-b1"></span><span class="lda-burger lda-b2"></span><span class="lda-burger lda-b3"></span></summary>\n    <div class="lda-mobile-panel">{''.join(mobile)}</div>\n  </details>\n</nav>\n<a id="lda-whatsapp-fab-static" href="https://wa.me/18495390410" target="_blank" rel="noopener" title="Escríbenos por WhatsApp" aria-label="Escríbenos por WhatsApp"><svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.87.5 3.62 1.44 5.15L2 22l5.13-1.5a9.8 9.8 0 0 0 4.91 1.32h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.51 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.96-.31-1.65-.61-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.81 1.98.88 2.12.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.13.63-.05.17-.17.71-.83.9-1.11.19-.29.38-.24.63-.15.26.1 1.65.78 1.93.92.29.15.48.22.55.34.07.13.07.72-.17 1.4z"></path></svg></a>'''

          changed=[]
          for filename, active in pages.items():
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              original=s
              if 'id="lda-static-nav"' not in s:
                  s=s.replace('</head>', font_head+'\n</head>', 1)
                  marker='<div id="dc-boot-fallback" style="display:none!important" aria-hidden="true"></div>'
                  if marker not in s:
                      raise SystemExit(f'{filename}: hidden boot marker missing')
                  s=s.replace(marker, marker+'\n'+navbar(active), 1)
              # Remove the asynchronous imported navbar and replace its variable gap with a fixed spacer.
              s=re.sub(r'<dc-import\s+name="NavBar"[^>]*></dc-import>\s*<div\s+style="height:\{\{\s*navGap\s*\}\};"></div>', '<div class="lda-nav-spacer" aria-hidden="true"></div>', s, count=1)
              s=re.sub(r'<dc-import\s+name="NavBar"[^>]*></dc-import>', '<div class="lda-nav-spacer" aria-hidden="true"></div>', s, count=1)
              # Avoid loading the same Google font stylesheet a second time from the runtime helmet.
              s=re.sub(r'<link rel="preconnect" href="https://fonts.googleapis.com">\s*', '', s, count=1)
              s=re.sub(r'<link href="https://fonts.googleapis.com/css2\?family=Montserrat:[^>]+rel="stylesheet">\s*', '', s, count=1)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(filename)
          print('Changed:', changed)
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Inicio.dc.html" "Sobre Mi.dc.html" "Tienda.dc.html" "Aprende.dc.html" "Contacto.dc.html"
          git commit -m "Inline navbar into initial HTML to eliminate flicker [static-nav]"
          git push
