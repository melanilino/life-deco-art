name: Fix Aprende FAQ gap by category

on:
  push:
    paths:
      - '.github/workflows/fix-aprende-faq-gap-by-category.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Esenciales compact and restore other Aprende FAQ gaps
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Aprende.dc.html')
          t = p.read_text(encoding='utf-8')
          old = "faqPad: m ? '20px 24px 0' : '72px 48px',"
          new = "faqPad: m ? (category === 'Esenciales' ? '20px 24px 0' : '48px 24px 0') : '72px 48px',"
          if old not in t:
              raise SystemExit('Current faqPad pattern not found')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          if new not in t:
              raise SystemExit('faqPad guardrail failed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Aprende.dc.html'
          git commit -m "Fix Aprende mobile FAQ spacing by category"
          git push
