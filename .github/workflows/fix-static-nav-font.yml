name: Fix static navbar font loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nav-font-head]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure navbar fonts load in initial head
        shell: python
        run: |
          from pathlib import Path
          pages=['Inicio.dc.html','Sobre Mi.dc.html','Tienda.dc.html','Aprende.dc.html','Contacto.dc.html']
          block='''<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Homemade+Apple&display=swap" rel="stylesheet">\n'''
          for f in pages:
            p=Path(f); s=p.read_text(encoding='utf-8'); original=s
            head=s.split('</head>',1)[0]
            if 'fonts.googleapis.com/css2?family=Montserrat' not in head:
              anchor='<style id="lda-static-nav-css">'
              if anchor not in s: raise SystemExit(f'{f}: static nav css missing')
              s=s.replace(anchor, block+anchor, 1)
            if s!=original: p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Inicio.dc.html" "Sobre Mi.dc.html" "Tienda.dc.html" "Aprende.dc.html" "Contacto.dc.html"
          git commit -m "Load navbar fonts in initial document head [nav-font-head]"
          git push
