name: Fix mobile CTA bottom padding

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-cta-bottom-padding.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match mobile CTA bottom padding to top padding
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = ['Inicio.dc.html','Sobre Mi.dc.html','Tienda.dc.html','Aprende.dc.html']
          for path in files:
              p = Path(path)
              t = p.read_text(encoding='utf-8')

              anchor = "ctaTopPad: m ? '60px' : '72px',"
              insert = "ctaTopPad: m ? '60px' : '72px',\n      ctaBottomPad: m ? '60px' : '80px',"
              if "ctaBottomPad:" not in t:
                  if anchor not in t:
                      raise SystemExit(f'Missing CTA top-pad anchor in {path}')
                  t = t.replace(anchor, insert, 1)

              old = "padding:{{ ctaTopPad }} {{ sidePad }} 80px;"
              new = "padding:{{ ctaTopPad }} {{ sidePad }} {{ ctaBottomPad }};"
              if old not in t and new not in t:
                  raise SystemExit(f'Missing CTA outer padding pattern in {path}')
              t = t.replace(old, new, 1)

              p.write_text(t, encoding='utf-8')

          for path in files:
              t = Path(path).read_text(encoding='utf-8')
              checks = [
                  "ctaRegionHeight: m ? '432px'",
                  "ctaTopPad: m ? '60px' : '72px'",
                  "ctaBottomPad: m ? '60px' : '80px'",
                  "ctaBoxHeight: m ? '312px'",
                  "padding:{{ ctaTopPad }} {{ sidePad }} {{ ctaBottomPad }};",
              ]
              for check in checks:
                  if check not in t:
                      raise SystemExit(f'Guardrail failed: {check} missing in {path}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Inicio.dc.html' 'Sobre Mi.dc.html' 'Tienda.dc.html' 'Aprende.dc.html'
          git commit -m "Match mobile CTA bottom padding to 60px"
          git push
