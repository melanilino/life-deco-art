name: Normalize spacing once

on:
  push:
    paths:
      - '.github/workflows/normalize-spacing-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize vertical rhythm
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            'Inicio.dc.html': [
              ('padding:64px 48px 64px;margin-top:45px', 'padding:96px 48px 72px;margin-top:0'),
              ('margin-top: 0; padding: 64px 48px 64px;', 'margin-top: 0; padding: 72px 48px 72px;'),
              ("timelineBlockPad: m ? '56px 24px 60px' : '140px 48px 100px'", "timelineBlockPad: m ? '64px 24px 64px' : '120px 48px 96px'"),
              ("spotlightTopPad: m ? '56px' : '80px'", "spotlightTopPad: m ? '64px' : '96px'"),
              ('padding: 60px {{ sidePad }} 80px;', 'padding: 72px {{ sidePad }} 72px;'),
            ],
            'Sobre Mi.dc.html': [
              ("heroPad: m ? '36px 26px 0' : '80px 48px 56px'", "heroPad: m ? '40px 26px 0' : '80px 48px 72px'"),
              ("queHagoTopGap: m ? '36px' : '0'", "queHagoTopGap: m ? '40px' : '0'"),
              ("closingOuterPad: m ? '40px 24px 56px' : '60px 48px 80px'", "closingOuterPad: m ? '40px 24px 64px' : '72px 48px 72px'"),
            ],
            'Tienda.dc.html': [
              ("heroPad: m ? '36px 24px 20px' : '76px 48px 8px'", "heroPad: m ? '40px 24px 24px' : '72px 48px 24px'"),
              ("shopPad: m ? '16px 24px 24px' : '80px 48px 100px'", "shopPad: m ? '24px 24px 40px' : '72px 48px 96px'"),
              ("faqPad: m ? '50px 24px 55px' : '80px 48px'", "faqPad: m ? '48px 24px 48px' : '72px 48px'"),
              ("ctaPad: m ? '56px 24px' : '100px 48px'", "ctaPad: m ? '64px 24px' : '96px 48px'"),
            ],
            'Aprende.dc.html': [
              ("heroPad: m ? '36px 26px 20px' : '76px 48px 32px'", "heroPad: m ? '40px 26px 24px' : '72px 48px 40px'"),
              ("mainPad: m ? '48px 24px 24px' : '88px 48px 40px'", "mainPad: m ? '48px 24px 40px' : '96px 48px 48px'"),
              ("faqPad: m ? '32px 24px 55px' : '40px 48px 80px'", "faqPad: m ? '40px 24px 48px' : '48px 48px 72px'"),
              ("ctaPad: m ? '56px 28px' : '100px 48px'", "ctaPad: m ? '64px 28px' : '96px 48px'"),
            ],
            'Contacto.dc.html': [
              ("heroPad: m ? '36px 26px 32px' : '76px 48px 96px'", "heroPad: m ? '40px 26px 40px' : '72px 48px 96px'"),
            ],
          }

          total = 0
          for filename, pairs in changes.items():
            p = Path(filename)
            s = p.read_text()
            for old, new in pairs:
              count = s.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected exactly 1 match for {old!r}, found {count}')
              s = s.replace(old, new)
              total += 1
            p.write_text(s)

          ds = Path('design-system.css')
          s = ds.read_text()
          marker = '  /* Core brand colors */'
          if '--lda-section-sm:' not in s:
            block = """  /* Vertical rhythm */\n  --lda-section-sm: 48px;\n  --lda-section-md: 72px;\n  --lda-section-lg: 96px;\n  --lda-section-xl: 120px;\n  --lda-section-mobile-sm: 40px;\n  --lda-section-mobile-md: 48px;\n  --lda-section-mobile-lg: 64px;\n  --lda-section-mobile-xl: 80px;\n\n"""
            if marker not in s:
              raise SystemExit('design-system marker not found')
            s = s.replace(marker, block + marker, 1)
            ds.write_text(s)
          print(f'Applied {total} spacing replacements')
          PY
      - name: Commit spacing system
        shell: bash
        run: |
          git config user.name "Life Deco Art Automation"
          git config user.email "actions@users.noreply.github.com"
          git add Inicio.dc.html "Sobre Mi.dc.html" Tienda.dc.html Aprende.dc.html Contacto.dc.html design-system.css
          git commit -m "Normalize vertical spacing across main pages [spacing-system]"
          git push