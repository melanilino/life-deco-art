name: Force Tienda hero deploy
on:
  push:
    paths:
      - '.github/workflows/force-tienda-hero-deploy.yml'
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Touch Tienda source and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Tienda.dc.html')
          s=p.read_text()
          marker='<!-- force-deploy-buscas-20260811-1942 -->'
          if marker not in s:
              s=s.replace('</x-dc>', marker+'\n</x-dc>', 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/force-tienda-hero-deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tienda.dc.html .github/workflows/force-tienda-hero-deploy.yml
          git commit -m 'Force production deploy for Tienda hero typography'
          git push
