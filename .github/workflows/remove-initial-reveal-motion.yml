name: Remove initial reveal motion
on:
  push:
    paths:
      - '.github/workflows/remove-initial-reveal-motion.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Disable initial reveal motion sitewide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('design-system.css')
          s = p.read_text()
          marker = '/* Sitewide: content is visible immediately; no initial reveal/lift animation. */'
          if marker in s:
              raise SystemExit('Reveal motion override already present')
          block = '''\n\n/* Sitewide: content is visible immediately; no initial reveal/lift animation. */
html body [data-reveal]:not([data-revealed]) {
  opacity: 1 !important;
  transform: none !important;
  transition: none !important;
}
html body .lda-motion-card[data-reveal]:not([data-revealed]) {
  opacity: 1 !important;
  transform: none !important;
  transition-delay: 0s !important;
}
'''
          p.write_text(s.rstrip() + block + '\n')
          print('disabled initial reveal/lift animation sitewide')
          PY
      - name: Commit changes
        run: |
          git config user.name "Life Deco Art"
          git config user.email "life-deco-art@local"
          git add design-system.css
          git commit -m "Remove initial reveal motion sitewide"
          git push origin main
