name: Fix Sobre Mi final region
on:
  push:
    paths:
      - .github/workflows/fix-sobremi-final-region.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match visible post-content region to Tienda
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Sobre Mi.dc.html')
          t = p.read_text(encoding='utf-8')

          old = '<div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ sectionPad }};opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">\n    <div class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:{{ eyebrowGap }};">Lo que dicen</div>'
          new = '<div data-reveal="" style="max-width:1240px;margin:0 auto;padding:{{ testimonialSectionPad }};opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);">\n    <div class="lda-section-eyebrow" style="font-size:{{ eyebrowSize }};letter-spacing:0.2em;text-transform:uppercase;color:#8B795E;font-weight:500;margin-bottom:{{ eyebrowGap }};">Lo que dicen</div>'
          if old not in t:
              raise SystemExit('Testimonials wrapper not found')
          t = t.replace(old, new, 1)

          t = t.replace("      testimonialTextSize: m ? '13.5px' : '14px',\n", "      testimonialTextSize: m ? '13.5px' : '14px',\n      testimonialSectionPad: m ? '48px 24px 0' : '72px 48px 0',\n", 1)
          t = t.replace("      ctaRegionHeight: m ? '440px' : '508px',\n      ctaTopPad: m ? '48px' : '72px',\n", "      ctaRegionHeight: m ? '488px' : '580px',\n      ctaTopPad: m ? '96px' : '144px',\n", 1)

          assert "testimonialSectionPad: m ? '48px 24px 0' : '72px 48px 0'" in t
          assert "ctaRegionHeight: m ? '488px' : '580px'" in t
          assert "ctaTopPad: m ? '96px' : '144px'" in t
          p.write_text(t, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Sobre Mi.dc.html'
          git commit -m 'Match Sobre Mi last-content-to-footer height to Tienda'
          git push
