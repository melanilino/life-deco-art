name: Fix Aprende FAQ single gap

on:
  push:
    paths:
      - '.github/workflows/fix-aprende-faq-single-gap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use one 60px gap above and below FAQ
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Aprende.dc.html')
          t = p.read_text(encoding='utf-8')
          old1 = "bannerBottomGap: m ? '24px' : '40px',"
          new1 = "bannerBottomGap: m ? '0px' : '40px',"
          old2 = "faqPad: m ? '20px 24px 0' : '72px 48px',"
          new2 = "faqPad: m ? (category === 'Esenciales' ? '20px 24px 0' : '60px 24px 0') : '72px 48px',"
          if old1 not in t: raise SystemExit('bannerBottomGap pattern not found')
          if old2 not in t: raise SystemExit('faqPad pattern not found')
          t = t.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Aprende.dc.html'
          git commit -m "Make Aprende FAQ whitespace exactly 60px"
          git push
