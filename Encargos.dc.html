<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://lifedecoart.com/encargo-personalizado">
<meta property="og:url" content="https://lifedecoart.com/encargo-personalizado">
<script src="/support.js?v=20260812-subpages4"></script>
<script src="/site-enhancements.js?v=20260901a11y1" defer></script>
<title>Encargo Personalizado | Life Deco Art</title>
<meta name="description" content="Cuéntanos lo que imaginas: tipo de pieza, ocasión, fecha y detalles. Recibe una cotización por WhatsApp.">
<meta property="og:type" content="website"><meta property="og:title" content="Encargo Personalizado | Life Deco Art"><meta property="og:description" content="Cuéntanos lo que imaginas: tipo de pieza, ocasión, fecha y detalles. Recibe una cotización por WhatsApp."><meta property="og:image" content="https://lifedecoart.com/og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Encargo Personalizado | Life Deco Art"><meta name="twitter:description" content="Cuéntanos lo que imaginas y recibe una cotización personalizada."><meta name="twitter:image" content="https://lifedecoart.com/og-image.png">
<link rel="stylesheet" href="/design-system.css?v=20260903camelia9">
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&amp;family=Homemade+Apple&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; max-width: 100%; overflow-x: clip; }
  body { background: #FFFFFF;  }
a { color: #F65091; }
  a:hover { color: #000000; }
  .lda-enc-input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #FFFFFF inset; }
  .lda-enc-input[type="date"] { -webkit-appearance:none; appearance:none; background:#FFFFFF !important; color:#2B2420; min-height:44px; }
  .lda-enc-input[type="date"]::-webkit-date-and-time-value { text-align:left; }
  .lda-enc-input[type="date"]::-webkit-calendar-picker-indicator { opacity:.7; }
</style>
</helmet>
<dc-import name="NavBar" active-page="tienda" hint-size="100%,80px" style="position: absolute; left: 4px; top: 1px"></dc-import>
<div style="height:{{ navGap }};"></div>

<section style="font-family:'Montserrat',sans-serif;background:#FFFFFF;">

  <div style="max-width:760px;margin:0 auto;padding:{{ heroPad }};text-align:center;">
    <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#F65091;font-weight:500;margin-bottom:16px;">Encargo Personalizado</div>
    <h1 style="font-size:{{ h1Size }};line-height:1.2;color:#000000;font-weight:300;margin:0;">Cuéntame lo que <span class="lda-script-hero" style="font-family:'Camelia Beauty',cursive;font-weight:400;font-size:1.6em;">imaginas</span></h1>
    <p style="font-size:15px;color:#8B795E;font-weight:300;max-width:480px;margin:16px auto 0;">{{ introText }}</p>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:{{ formPad }};">
    <div style="display:flex;flex-direction:column;gap:22px;">

      <div>
        <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Tipo de pieza</label>
        <select value="{{ tipo }}" onChange="{{ onTipo }}" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;background:#FFFFFF;outline:none;">
          <sc-for list="{{ tipos }}" as="t" hint-placeholder-count="6">
            <option value="{{ t }}">{{ t }}</option>
          </sc-for>
        </select>
        <sc-if value="{{ tipoEsOtro }}" hint-placeholder-val="{{ false }}">
          <input class="lda-enc-input" type="text" value="{{ tipoOtro }}" onChange="{{ onTipoOtro }}" placeholder="Escribe el tipo de pieza" style="width:100%;margin-top:8px;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </sc-if>
      </div>

      <div style="display:grid;grid-template-columns:{{ twoCol }};gap:16px;">
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Ocasión o propósito</label>
          <input class="lda-enc-input" type="text" value="{{ ocasion }}" onChange="{{ onOcasion }}" placeholder="Ej. cumpleaños, boda, regalo" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </div>
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Fecha en que la necesitas</label>
          <input class="lda-enc-input" type="date" value="{{ fecha }}" onChange="{{ onFecha }}" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </div>
      </div>

      <div style="display:grid;grid-template-columns:{{ twoCol }};gap:16px;">
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Cantidad</label>
          <input class="lda-enc-input" type="number" min="1" value="{{ cantidad }}" onChange="{{ onCantidad }}" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </div>
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Tamaño aproximado</label>
          <input class="lda-enc-input" type="text" value="{{ tamano }}" onChange="{{ onTamano }}" placeholder="Ej. 25x30cm" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </div>
      </div>

      <div>
        <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Nombre, frase o texto a incluir</label>
        <textarea class="lda-enc-input" value="{{ texto }}" onChange="{{ onTexto }}" rows="2" placeholder="Escribe el texto exacto que quieres en la pieza" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;resize:vertical;"></textarea>
      </div>

      <div>
        <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Colores o estilo deseado</label>
        <input class="lda-enc-input" type="text" value="{{ colores }}" onChange="{{ onColores }}" placeholder="Ej. tonos pastel, negro y dorado" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
      </div>

      <div style="display:grid;grid-template-columns:{{ twoCol }};gap:16px;">
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Presupuesto estimado <span style="color:#8B795E;font-weight:300;">(opcional)</span></label>
          <div style="position:relative;">
            <div onClick="{{ onTogglePresupuesto }}" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:{{ presupuestoDisplayColor }};background:#FFFFFF;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <span>{{ presupuestoDisplay }}</span>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8B795E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:{{ presupuestoArrow }};transition:transform .25s ease;flex-shrink:0;"><path d="M6 9l6 6 6-6"></path></svg>
            </div>
            <sc-if value="{{ presupuestoOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:calc(100% + 6px);left:0;right:0;background:#FFFFFF;border:1px solid #E5DDD0;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.08);z-index:10;overflow:hidden;">
                <sc-for list="{{ presupuestoOpciones }}" as="op" hint-placeholder-count="5">
                  <div onClick="{{ op.onClick }}" style="padding:11px 14px;font-size:13px;color:{{ op.color }};font-weight:{{ op.weight }};background:{{ op.bg }};cursor:pointer;">{{ op.label }}</div>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{ presupuestoEsOtro }}" hint-placeholder-val="{{ false }}">
            <input class="lda-enc-input" type="text" value="{{ presupuestoOtro }}" onChange="{{ onPresupuestoOtro }}" placeholder="Escribe tu presupuesto" style="width:100%;margin-top:8px;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
          </sc-if>
        </div>
        <div>
          <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Ciudad de entrega</label>
          <input class="lda-enc-input" type="text" value="{{ ciudad }}" onChange="{{ onCiudad }}" placeholder="Ej. Santo Domingo" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
        </div>
      </div>

      <div>
        <label style="font-size:13px;color:#2B2420;font-weight:400;display:block;margin-bottom:8px;">Enlace de referencia <span style="color:#8B795E;font-weight:300;">(opcional)</span></label>
        <input class="lda-enc-input" type="url" value="{{ referencia }}" onChange="{{ onReferencia }}" placeholder="Pega un enlace de Pinterest, Instagram u otra referencia" style="width:100%;padding:12px 14px;border-radius:6px;border:1px solid #E5DDD0;font-family:'Montserrat',sans-serif;font-size:14px;color:#2B2420;outline:none;box-sizing:border-box;">
      </div>

    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:{{ processPad }};">
    <div style="font-size:14px;color:#2B2420;font-weight:400;margin-bottom:8px;">Así funciona después de enviar tu solicitud:</div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
        <div style="display:flex;gap:14px;align-items:flex-start;">
          <div style="width:26px;height:26px;border-radius:999px;background:#F65091;color:#FFFFFF;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ s.n }}</div>
          <div style="font-size:13px;color:#8B795E;font-weight:300;line-height:1.6;padding-top:4px;">{{ s.text }}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:{{ previewPad }};">
    <div style="font-size:14px;color:#2B2420;font-weight:400;margin-bottom:10px;">Así llegará tu mensaje:</div>
    <div style="background:#F3EEE4;border-radius:10px;padding:18px 20px;font-size:13px;color:#2B2420;font-weight:300;line-height:1.7;white-space:pre-wrap;">{{ preview }}</div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:{{ ctaPad }};text-align:center;">
    <a href="{{ whatsappUrl }}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#F65091;color:#FFFFFF;padding:16px 36px;border-radius:6px;font-size:15px;font-weight:500;transition:transform .25s ease;" style-hover="transform:translateY(-3px);">Enviar</a>
    <p style="font-size:12px;color:#8B795E;font-weight:300;margin-top:14px;">Se abrirá WhatsApp con tu información precargada,<br class="lda-mobile-break"> lista para enviar.</p>
  </div>

</section>

<dc-import name="Footer" hint-size="100%,320px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = {
    isMobile: typeof window !== 'undefined' && window.innerWidth < 860,
    tipo: 'Cuadro personalizado', tipoOtro: '', ocasion: '', fecha: '', cantidad: 1, tamano: '',
    texto: '', colores: '', presupuesto: '', presupuestoOtro: '', ciudad: '', referencia: '', presupuestoOpen: false, content: {},
  };
  async componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
    window.addEventListener('resize', check);
    try { const cms = await import('/cms.js'); this.setState({ content: await cms.getPageContent('encargos') }); } catch (_) {}
  }
  TIPOS = ['Cuadro personalizado', 'Bandeja', 'Caja sorpresa', 'Letrero', 'Llavero', 'Vinera', 'Otro'];
  PRESUPUESTOS = ['Menos de RD$2,000', 'RD$2,000 – RD$5,000', 'RD$5,000 – RD$10,000', 'Más de RD$10,000', 'Otro'];
  STEPS = [
    { n: 1, text: 'Reviso tu solicitud y te respondo con una propuesta de precio y tiempo de entrega.' },
    { n: 2, text: 'Confirmas con un anticipo del 50% y comienzo a producir tu pieza.' },
    { n: 3, text: 'Te comparto un boceto digital de la pieza para tu aprobación.' },
  ];
  renderVals() {
    const m = this.state.isMobile;
    const s = this.state;
    const content = s.content || {};
    const tiposBase = Array.isArray(content.pieceTypes) && content.pieceTypes.length ? content.pieceTypes : this.TIPOS;
    const tipos = tiposBase.includes('Otro') ? tiposBase : [...tiposBase, 'Otro'];
    const presupuestosBase = Array.isArray(content.budgetOptions) && content.budgetOptions.length ? content.budgetOptions : this.PRESUPUESTOS;
    const presupuestos = presupuestosBase.includes('Otro') ? presupuestosBase : [...presupuestosBase, 'Otro'];
    const onField = (key) => (e) => this.setState({ [key]: e.target.value });
    const onTipo = onField('tipo'), onOcasion = onField('ocasion'), onFecha = onField('fecha'),
      onCantidad = onField('cantidad'), onTamano = onField('tamano'), onTexto = onField('texto'),
      onColores = onField('colores'), onPresupuesto = onField('presupuesto'), onCiudad = onField('ciudad'),
      onPresupuestoOtro = onField('presupuestoOtro'), onTipoOtro = onField('tipoOtro'), onReferencia = onField('referencia');
    const tipoFinal = s.tipo === 'Otro' ? (s.tipoOtro || 'Otro') : s.tipo;
    const presupuestoFinal = s.presupuesto === 'Otro' ? s.presupuestoOtro : s.presupuesto;
    const contentSteps = Array.isArray(content.steps) && content.steps.length ? [...content.steps] : null;
    if (contentSteps && contentSteps.length >= 3 && /boceto/i.test(contentSteps[1]) && /anticipo/i.test(contentSteps[2])) {
      [contentSteps[1], contentSteps[2]] = [contentSteps[2], contentSteps[1]];
    }
    const presupuestoOpciones = presupuestos.map(p => ({
      label: p,
      bg: s.presupuesto === p ? '#F3EEE4' : '#FFFFFF',
      color: s.presupuesto === p ? '#F65091' : '#2B2420',
      weight: s.presupuesto === p ? 500 : 400,
      onClick: () => this.setState({ presupuesto: p, presupuestoOpen: false }),
    }));
    const onTogglePresupuesto = () => this.setState({ presupuestoOpen: !s.presupuestoOpen });
    const parts = [
      `Tipo de pieza: ${tipoFinal}`,
      s.ocasion && `Ocasión: ${s.ocasion}`,
      s.fecha && `Fecha necesaria: ${s.fecha}`,
      `Cantidad: ${s.cantidad}`,
      s.tamano && `Tamaño: ${s.tamano}`,
      s.texto && `Texto a incluir: ${s.texto}`,
      s.colores && `Colores/estilo: ${s.colores}`,
      presupuestoFinal && `Presupuesto: ${presupuestoFinal}`,
      s.ciudad && `Ciudad: ${s.ciudad}`,
      s.referencia && `Referencia: ${s.referencia}`,
    ].filter(Boolean);
    const message = (content.whatsappMessage || 'Hola! Quiero hacer un encargo personalizado.') + '\n' + parts.join('\n');
    return {
      preview: message,
      previewPad: m ? '22px 24px 0' : '22px 48px 0',
      navGap: m ? '64px' : '88px',
      heroPad: m ? '36px 24px 0' : '64px 48px 0',
      h1Size: m ? '26px' : '42px',
      formPad: m ? '32px 24px 18px' : '48px 48px 18px',
      twoCol: m ? '1fr' : '1fr 1fr',
      processPad: m ? '0 24px' : '0 48px',
      ctaPad: m ? '40px 24px 60px' : '48px 48px 90px',
      tipo: s.tipo, tipoOtro: s.tipoOtro, tipoEsOtro: s.tipo === 'Otro', ocasion: s.ocasion, fecha: s.fecha, cantidad: s.cantidad, tamano: s.tamano,
      texto: s.texto, colores: s.colores, presupuesto: s.presupuesto, presupuestoOtro: s.presupuestoOtro, ciudad: s.ciudad, referencia: s.referencia,
      presupuestoOpciones, presupuestoEsOtro: s.presupuesto === 'Otro',
      presupuestoOpen: s.presupuestoOpen, onTogglePresupuesto,
      presupuestoDisplay: s.presupuesto || 'Selecciona un rango',
      presupuestoDisplayColor: s.presupuesto ? '#2B2420' : '#8B795E',
      presupuestoArrow: s.presupuestoOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      introText: content.introText || 'Completa estos datos y te escribo por WhatsApp con una propuesta y precio para tu pieza.',
      tipos, steps: contentSteps ? contentSteps.map((text, index) => ({ n: index + 1, text })) : this.STEPS,
      onTipo, onTipoOtro, onOcasion, onFecha, onCantidad, onTamano, onTexto, onColores, onPresupuesto, onCiudad, onPresupuestoOtro, onReferencia,
      whatsappUrl: 'https://wa.me/18495390410?text=' + encodeURIComponent(message),
    };
  }
}

</script>
</body>
</html>
