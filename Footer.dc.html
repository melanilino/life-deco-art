        <a href="Tienda.dc.html" style="color:#FFFFFF;text-decoration:none;font-size:13px;font-weight:300;padding-bottom:2px;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size .3s ease;width:fit-content;" style-hover="background-size:100% 1px;">Tienda</a>
        <a href="Aprende.dc.html" style="color:#FFFFFF;text-decoration:none;font-size:13px;font-weight:300;padding-bottom:2px;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size .3s ease;width:fit-content;" style-hover="background-size:100% 1px;">Aprende</a>
        <a href="Contacto.dc.html" style="color:#FFFFFF;text-decoration:none;font-size:13px;font-weight:300;padding-bottom:2px;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size .3s ease;width:fit-content;" style-hover="background-size:100% 1px;">Contacto</a>
      </div>
    </div>
    <div>
      <div style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #FFFFFF; font-weight: 500; margin-bottom: 16px">Sígueme</div>

      <a href="http://wa.me/18495390410" target="_blank" style="font-size:13px;font-weight:300;color:#FFFFFF;margin-top:8px;text-decoration:none;display:block;width:fit-content;padding-bottom:2px;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size .3s ease;" style-hover="background-size:100% 1px;">+1 849-539-0410</a>

      <sc-if value="{{ notSubscribed }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ onSubmit }}" style="display:flex;gap:8px;">
          <input type="email" class="lda-footer-email" value="{{ email }}" onChange="{{ onEmailChange }}" required="required" placeholder="Tu email" style="flex:1;min-width:0;padding:10px 12px;border-radius:4px;border:1px solid #262626;background:#141414;color:#FFFFFF;font-family:'Montserrat',sans-serif;font-size:12px;outline:none;" style-focus="outline:none;border-color:#262626;box-shadow:none;">

    <div style="display:flex;gap:24px;flex-wrap:wrap;">
      <a href="Politica de Privacidad.dc.html" style="font-size:11px;font-weight:300;color:#FFFFFF;text-decoration:none;padding-bottom:2px;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size .3s ease;" style-hover="background-size:100% 1px;">Política de Privacidad</a>

    </div>

</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:360}}">class Component extends DCLogic {
  state = { subscribed: false, email: '', isMobile: typeof window !== 'undefined' && window.innerWidth < 860 };
  componentDidMount() {
    const check = () => this.setState({ isMobile: window.innerWidth < 860 });
    check();
  }
  renderVals() {
    return {
      gridCols: this.state.isMobile ? '1fr' : 'repeat(4,1fr)',
      padding: this.state.isMobile ? '48px 24px 40px' : '64px 48px 56px',
      subscribed: this.state.subscribed,
      notSubscribed: !this.state.subscribed,
      email: this.state.email,
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onSubmit: (e) => {
        e.preventDefault();
        const email = this.state.email;
        if (!email) return;
        const body = new URLSearchParams({ EMAIL: email, email_address_check: '', locale: 'es' });
        fetch('https://89ab9516.sibforms.com/serve/MUIFAMSaY1ivtOV72aaFecvV98Fj2n909HATZUJAJBq-8554DySSkKmJFacXUWh7sUgixF0l-vHog0NjyOrT4W_Oo9OwhPXPVBQnXvDN7rDCAc7lDywnn2m_klLzx5bIrW_GD27oktV8IyExFC1gFbDCT4RWOrPBw_3wRU3oQXNiOQOu4DlIHNYFrrJ8nOIIDL9UOWLaudIkazpI-w==', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString(),
        }).catch(() => {});
        this.setState({ subscribed: true });
      },
    };
  }
}</script>
</body>
</html>
