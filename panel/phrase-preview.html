<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba del panel de frases</title><link rel="stylesheet" href="/panel/panel.css"><link rel="stylesheet" href="/panel/shared.css"><main style="padding:32px"><h1>Inicio · comprobación visual</h1><p>Datos ficticios de prueba, sin conexión con registros reales.</p><div id="phrase-preview"></div></main><script type="module">
